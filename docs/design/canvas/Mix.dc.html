<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ashfall: mix</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&amp;family=Alegreya+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#d9894a}a:hover{color:#f0a868}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121012; color: #d8d0c4; font-family: 'Alegreya Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 16px; flex-grow: 1; min-height: 0">

    <div role="tablist" aria-label="Saved mixes" style="display: flex; gap: 6px; flex-wrap: wrap">
      <button role="tab" aria-selected="true" style="min-height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid #6b3f22; background: #2a1b14; color: #f0b27a; font: 500 15px 'Alegreya Sans', sans-serif; cursor: pointer">Study</button>
      <button role="tab" aria-selected="false" style="min-height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid #2c2629; background: #19161a; color: #b9b0a3; font: 500 15px 'Alegreya Sans', sans-serif; cursor: pointer">Stockpile</button>
      <button role="tab" aria-selected="false" style="min-height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid #2c2629; background: #19161a; color: #b9b0a3; font: 500 15px 'Alegreya Sans', sans-serif; cursor: pointer">Recover</button>
      <button aria-label="New mix" style="min-height: 44px; width: 44px; border-radius: 6px; border: 1px dashed #3a3236; background: transparent; color: #9a9187; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </button>
    </div>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-family: 'IM Fell English SC', serif; font-weight: 400; font-size: 22px; color: #e8dfd2">Mix: Study</h2>
        <span style="font-size: 13px; color: #b9b0a3">runs 7 h</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{actions}}" as="a" hint-placeholder-count="5">
          <div style="display: grid; grid-template-columns: 120px 38px minmax(0, 1fr) 60px; gap: 8px; align-items: center; font-size: 14px">
            <span style="color: #e2d9cc">{{a.name}}<span style="display: block; font-size: 11px; color: #9a9187">{{a.sub}}</span></span>
            <span style="color: #9a9187; text-align: right">{{a.share}}</span>
            <div style="height: 8px; border-radius: 4px; background: #2a2427; overflow: hidden"><div style="{{a.fill}}"></div></div>
            <span style="color: #b9b0a3; font-size: 12px; text-align: right">{{a.eta}}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="border-top: 1px solid #2c2629; padding-top: 12px; display: flex; flex-direction: column; gap: 6px">
      <h3 style="margin: 0 0 2px; font-size: 13px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #9a9187">Ledger, per hour</h3>
      <sc-for list="{{ledger}}" as="l" hint-placeholder-count="5">
        <a href="LineTarget.dc.html" style="min-height: 44px; display: grid; grid-template-columns: minmax(0, 1fr) 56px 92px; gap: 8px; align-items: center; padding: 0 12px; background: #19161a; border: 1px solid #2c2629; border-radius: 6px; text-decoration: none; font-size: 14px">
          <span style="color: #e2d9cc">{{l.name}}</span>
          <span style="{{l.style}}">{{l.rate}}</span>
          <span style="color: #9a9187; font-size: 12px; text-align: right">{{l.store}}</span>
        </a>
      </sc-for>
    </section>

    <section style="border: 1px solid #3a3236; border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; font-size: 14px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d9894a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>
      <span style="flex-grow: 1">Tallow candles<span style="display: block; font-size: 13px; color: #9a9187">Knowledge +18 → <span style="color: #a9c48a">+21/h</span></span></span>
      <button style="min-height: 44px; padding: 0 12px; border-radius: 6px; border: 1px solid #6b3f22; background: #2a1b14; color: #f0b27a; font: 500 14px 'Alegreya Sans', sans-serif; cursor: pointer; flex-shrink: 0">Swap</button>
    </section>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #2c2629; background: #0e0c0e; flex-shrink: 0">
    <a href="Main.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; text-decoration: none; color: #9a9187">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 20V10l4-3 4 3v10"/><path d="M13 20v-6h6v6"/></svg>Town</a>
    <a href="#mix" aria-current="page" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; text-decoration: none; color: #e0954f">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h10"/><path d="M4 12h14"/><path d="M4 17h7"/><circle cx="17" cy="7" r="2"/><circle cx="14" cy="17" r="2"/></svg>Mix</a>
    <a href="Orders.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; text-decoration: none; color: #9a9187">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4 6l1 1 2-2"/><path d="M4 12l1 1 2-2"/><path d="M4 18l1 1 2-2"/></svg>Orders</a>
    <a href="Map.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; text-decoration: none; color: #9a9187">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>Map</a>
    <a href="Journal.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; text-decoration: none; color: #9a9187">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 8h6"/></svg>Journal</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ember":{"editor":"color","default":"#c8743a","options":["#c8743a","#b8462e","#8f9a6a"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ember = this.props.ember ?? '#c8743a';
    const bar = (pct) => 'height: 8px; width: ' + pct + '%; border-radius: 4px; background: ' + ember;
    const actions = [
      { name: 'Arcana: study', sub: 'level 7', share: '40%', pct: 62, eta: '1 h 12 m' },
      { name: 'Scavenging', sub: 'level 9', share: '25%', pct: 35, eta: '24 m' },
      { name: 'Cooking', sub: 'level 4', share: '15%', pct: 80, eta: '6 m' },
      { name: 'Foraging', sub: 'level 5', share: '10%', pct: 18, eta: '41 m' },
      { name: 'Recover', sub: 'saved mix', share: '10%', pct: 50, eta: '15 m' }
    ].map((a) => ({ ...a, fill: bar(a.pct) }));
    const plus = 'color: #a9c48a; font-weight: 700; text-align: right';
    const even = 'color: #b9b0a3; font-weight: 500; text-align: right';
    const minus = 'color: #d9a066; font-weight: 700; text-align: right';
    const ledger = [
      { name: 'Knowledge', rate: '+18', style: plus, store: '412 / 600' },
      { name: 'Scrap', rate: '+6', style: plus, store: '133' },
      { name: 'Candles', rate: '−4', style: minus, store: '28 · 7 h left' },
      { name: 'Energy', rate: '0', style: even, store: 'steady' },
      { name: 'Forage', rate: '0', style: even, store: 'steady' }
    ];
    return { actions, ledger };
  }
}
</script>
</body>
</html>
