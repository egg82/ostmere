# The nightly run on main, the lane the whole-game simulations live in. Two jobs:
# - `full`: ci.yml with full, so the playthroughs and the chapter saves run beside the per-PR set. Each chapter is played
#   from the saved end of the one before it, the saves restored from the last nightly's cache and written where a chapter's
#   key is new (tests/weektwo/keys.py); the run caches its saves for the pull requests' slices (ci.yml, `publish-ends`).
#   Pull requests play only the chapters they touch (ci.yml, `slice`), unless labelled `playthroughs`. A red nightly holds
#   the next release (ci.yml, `release`), unless it is red only for readouts (`refresh-readouts`): dispatch this workflow on main once it is fixed, then re-run the held job.
# - `tests-deep`: the deep Hypothesis profile (HYPOTHESIS_PROFILE=ci) over every engine contract suite, while pull
#   requests and pushes run the fast default profile in ci.yml's `tests`. A new engine part's suite is added here when it
#   lands. The same variable makes tests/rules play every route at seeds 0-2 and both kinds of player past the end
#   (routes.py, DEEP).

name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    uses: ./.github/workflows/ci.yml
    with:
      full: true
    secrets: inherit
    permissions:
      actions: read
      contents: read
      packages: write

  tests-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HYPOTHESIS_PROFILE: ci
      TEST_CEILING_S: "120"   # the per-test ceiling is for pushes (tests/conftest.py); this run is meant to be deep
      SAVES_DAYS: "30"   # golden saves run on 30 game days here, one on a push (tests/saves/builds/test_golden.py)
      ASHFALL_TEST_PG: postgresql://postgres@127.0.0.1/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres
        run: >
          docker run -d --name postgres -p 5432:5432
          -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_INITDB_ARGS="--locale=C --encoding=UTF8"
          postgres:18.6 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: Wait for Postgres
        working-directory: app
        run: for _ in $(seq 60); do python -c "import psycopg; psycopg.connect('$ASHFALL_TEST_PG').close()" 2>/dev/null && break; sleep 1; done
      - working-directory: app
        run: >
          python -m pytest -q --timeout=600 tests/engine_contract tests/cards_contract tests/journal_contract tests/rules
          tests/saves tests/dayone tests/daytwo

  # A nightly red only because readouts differ from their committed text (ci.yml's ci-ok decides, tools/nightly_verdict.py)
  # refreshes them: one pull request from a fixed branch, updated each night. The verdict file it uploads first is what lets
  # `release` pass for this run. The only job here that writes to the repository, and the pull request it opens runs no CI
  # of its own (a GITHUB_TOKEN push starts no workflow): the orchestrator starts it before merging.
  # The same pull request carries the chapter-save cost table (app/tools/ci_costs.json, refreshed from the last runs' logs by
  # tools/ci_costs.py) whenever it changed, so tests/tools/test_saves_plan.py reads the new costs on that pull request: a jump
  # that puts a planned job over its cap is a red pull request. A table refresh that fails measures nothing and holds nothing.
  refresh-readouts:
    needs: [full, tests-deep, ci-health]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: bot/readout-refresh-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        if: needs.full.result == 'failure'
        run: >
          python3 app/tools/nightly_verdict.py decide --full-only "${{ needs.full.outputs.readouts_only }}"
          --deep "${{ needs.tests-deep.result }}" --health "${{ needs.ci-health.result }}"
          --run "$GITHUB_RUN_ID" --out "$RUNNER_TEMP/verdict" | tee -a "$GITHUB_OUTPUT"
      - if: steps.decide.outputs.refresh == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-verdict
          path: ${{ runner.temp }}/verdict
          retention-days: 14
      - if: steps.decide.outputs.refresh == 'true'
        run: (cd app && python3 -m tools.readouts_pull "$GITHUB_RUN_ID")
      - name: Chapter-save costs, from the last runs' logs
        continue-on-error: true
        run: cd app && python3 -m tools.ci_costs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add app/tests/readouts app/tools/ci_costs.json
          if git diff --cached --quiet; then echo "the readouts and chapter-save costs on main already match this run's"; exit 0; fi
          git diff --cached --name-only | python3 app/tools/nightly_verdict.py body > "$RUNNER_TEMP/body.md"
          title="$(git diff --cached --name-only | python3 app/tools/nightly_verdict.py title --run "$GITHUB_RUN_ID")"
          git commit -m "$title"
          git push --force origin "$BRANCH"
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"bot/readout-refresh\")) | select(.headRefName != \"$BRANCH\") | .number" |
            while read -r old; do gh pr close "$old" --delete-branch --comment "Superseded by nightly $GITHUB_RUN_ID."; done

  # The last week of pull-request CI against its budget, and the runs that failed a test job and passed on a rerun
  # (app/tools/ci_health.py): one open issue per problem, updated each night, or one log line.
  ci-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 app/tools/ci_health.py --repo "$GITHUB_REPOSITORY" --budget-min 10
