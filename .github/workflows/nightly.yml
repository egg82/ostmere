# The nightly deep run: the deep Hypothesis profile (HYPOTHESIS_PROFILE=ci) over every engine contract suite, while
# pull requests and pushes run the fast default profile in ci.yml's `tests`. A new engine part's suite is added here when
# it lands. The same variable makes tests/opening play every route at seeds 0-2 and both kinds of player past the end
# (routes.py, DEEP); ci.yml plays the representative ones in `playthrough`.

name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HYPOTHESIS_PROFILE: ci
      TEST_CEILING_S: "120"   # the per-test ceiling is for pushes (tests/conftest.py); this run is meant to be deep
      SAVES_DAYS: "30"   # golden saves run on 30 game days here, one on a push (tests/saves/test_golden.py)
      ASHFALL_TEST_PG: postgresql://postgres@127.0.0.1/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres
        run: >
          docker run -d --name postgres -p 5432:5432
          -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_INITDB_ARGS="--locale=C --encoding=UTF8"
          postgres:18.6 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: Wait for Postgres
        working-directory: app
        run: for _ in $(seq 60); do python -c "import psycopg; psycopg.connect('$ASHFALL_TEST_PG').close()" 2>/dev/null && break; sleep 1; done
      - working-directory: app
        run: >
          python -m pytest -q --timeout=600 tests/engine_contract tests/cards_contract tests/opening tests/saves
          tests/dayone tests/daytwo
