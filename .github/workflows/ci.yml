# CI for Ostmere. Every pull request and push to main that changes code runs the per-PR set, inside the budget in
# docs/engineering.md ("Scope and test budget"): the suite, pyright, the client, the engine and save checks, the app image,
# the opening's smoke route, and a slice of the whole game: the chapters the change touches, each played from the base's
# saved end of the chapter before it (`slice` decides, tools/pr_plan.py; `playthrough-slice` plays). A pull request that
# changes only docs runs `docs`, the tests that read them. The whole-game playthroughs and the chapter saves they read are
# the full run: nightly (nightly.yml calls this file with full), on a pull request labelled `playthroughs`, and on a manual
# dispatch. `publish-ends` caches the full run's saves on main, where the slices and later full runs restore them. On
# main, once everything is green and the last nightly passed, `release` tags the
# image already pushed by digest: `dev` and `main-<sha8>-<commit-timestamp>`, the tag Flux image automation sorts on.
# Pull requests build the image and push nothing.
#
# Images go to Docker Hub (`docker.io/<vars.DOCKERHUB_USERNAME>/ostmere`, logged in with `secrets.DOCKERHUB_TOKEN`) and
# GHCR (`ghcr.io/<owner>/ostmere`, logged in with GITHUB_TOKEN).

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: run the whole-game playthroughs too
        type: boolean
        default: false
    outputs:
      readouts_only:
        description: "true when every red job failed only because readouts differ (ci-ok, tools/nightly_verdict.py)"
        value: ${{ jobs.ci-ok.outputs.readouts_only }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The owner stands in where the variable is unset (a fork's pull request), so the names still parse.
  DOCKERHUB_REPO: docker.io/${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}/ostmere
  GHCR_REPO: ghcr.io/${{ github.repository_owner }}/ostmere
  PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  PYTHON_VERSION: "3.12"
  # Production's Postgres. Tests that need a database copy a template migrated once per run (app/tests/pg.py); the
  # data is thrown away, so nothing is flushed.
  PG_IMAGE: postgres:18.6

jobs:
  # What this run covers. `code` is false only for a pull request whose every changed file is under docs/ or android/, a
  # top-level Markdown file or LICENSE (content/ is read by the play tests, so it is code). `full` adds the playthroughs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      code: ${{ steps.diff.outputs.code }}
      full: ${{ steps.diff.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          FULL: ${{ inputs.full == true || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'playthroughs') }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$FULL" = true ]; then
            echo "full=$FULL" >> "$GITHUB_OUTPUT"
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "$EVENT: code=true full=$FULL"; exit 0
          fi
          git diff --name-only "$(git merge-base "origin/$BASE_REF" HEAD)" HEAD > "$RUNNER_TEMP/changed"
          cat "$RUNNER_TEMP/changed"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          if [ ! -s "$RUNNER_TEMP/changed" ] || grep -v -E '^(docs/.*|android/.*|[^/]+\.md|LICENSE)$' "$RUNNER_TEMP/changed" > /dev/null; then
            code=true
          else
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"; echo "code=$code full=$FULL"

  # A docs-only pull request: the tests that read docs/ (citations of code and of decisions, the gates table against
  # gates.sh) and the household-names
  # guard, which reads every tracked file.
  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OSTMERE_HOUSEHOLD_NAMES: ${{ secrets.OSTMERE_HOUSEHOLD_NAMES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - working-directory: app
        run: python -m pytest -q tests/test_doc_citations.py tests/test_decision_citations.py tests/test_gates_command.py tests/test_household_names.py

  # Three shards (app/tools/shards.py): a is tests/saves, accounts and api_contract; c is tests/rules; b is everything
  # else, so a new test directory runs in b. `shards-cover` fails if the three together are not the whole suite.
  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c]
    env:
      # app/tests/test_household_names.py: the names, held only as this secret; unset (forks), it skips.
      OSTMERE_HOUSEHOLD_NAMES: ${{ secrets.OSTMERE_HOUSEHOLD_NAMES }}
      ASHFALL_TEST_PG: postgresql://postgres@127.0.0.1/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres
        run: >
          docker run -d --name postgres -p 5432:5432
          -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_INITDB_ARGS="--locale=C --encoding=UTF8"
          "$PG_IMAGE" -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: Wait for Postgres
        working-directory: app
        run: for _ in $(seq 60); do python -c "import psycopg; psycopg.connect('$ASHFALL_TEST_PG').close()" 2>/dev/null && break; sleep 1; done
      - name: Test (shard ${{ matrix.shard }})
        working-directory: app
        run: python -m tools.shards "${{ matrix.shard }}" -q --durations=25 --durations-min=1

  # Collection only (no database): the three shards of `tests` together collect exactly what one unsharded run does, and
  # week two's shards (app/tools/weektwo_shards.py) select each week-two test exactly once; their names are handed to
  # `playthrough-week-two` as its matrix, so the shards checked are the shards run.
  shards-cover:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      weektwo: ${{ steps.weektwo.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - working-directory: app
        run: python -m tools.shards --check
      - id: weektwo
        working-directory: app
        run: |
          set -o pipefail
          python -m tools.weektwo_shards --check | tee weektwo-shards.out
          grep '^matrix=' weektwo-shards.out >> "$GITHUB_OUTPUT"

  # Every planted mutant (app/tools/mutants/*/, and the journal contract's tests/journal_contract/journal_plants.py)
  # applies to the current code: each anchor occurs exactly once. Plants only, and every row of every suite's MUTANTS
  # file is claimed by a test marked @kills. No test run, no dependencies beyond the standard library; a mutation run
  # is by hand.
  mutant-plants:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - working-directory: app
        run: python -m tools.mutate_suite --plants
      - working-directory: app
        run: |
          bad=0
          for suite in $(python -c "from tools.mutate_suite import SUITES; print(*SUITES)"); do
            echo "== $suite"
            python -m tools.mutate_suite "$suite" --check || bad=1
          done
          exit $bad
      - working-directory: app
        run: python tests/journal_contract/plant_mutants.py --plants

  # The per-PR smoke route: the opening's representative routes (tests/rules/play/routes.py, PUSH_ROUTES) and the tests
  # that read them, so a change that breaks play itself goes red before it merges. The rest of the playthroughs are the
  # full run below.
  playthrough-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      READOUTS_OUT: ${{ github.workspace }}/readouts-new
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: Playthrough (the opening)
        working-directory: app
        run: python -m pytest -q -m playthrough tests/rules --durations=10 --durations-min=1
      - name: Upload changed readouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readouts-new-${{ github.job }}
          path: readouts-new/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record whether the tests passed
        if: always()
        uses: ./.github/actions/readout-verdict
        with:
          status: ${{ job.status }}
          index: ${{ strategy.job-index }}
          total: ${{ strategy.job-total }}
      - name: Fail when a readout differs from its committed text
        if: always() && hashFiles('readouts-new/**') != ''
        uses: ./.github/actions/readout-differs

  # What of the whole game this pull request plays (tools/pr_plan.py): its chapters' own files compared with the base's,
  # chapter by chapter. `matrix` is the touched chapters, `smoke` where every chapter's key moved or week one changed, and
  # empty where no chapter's inputs did. The base's saves are the last nightly's (`publish-ends`), under the keys the base
  # computes, which `base_keys` hands the play.
  slice:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      slice: ${{ steps.plan.outputs.slice }}
      files: ${{ steps.plan.outputs.files }}
      base_keys: ${{ steps.plan.outputs.base_keys }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: The last nightly's saved ends, to see which of them are there
        uses: actions/cache/restore@v4
        with:
          path: chapter-saves
          key: chapter-ends-v1-none
          restore-keys: chapter-ends-v1-
      - id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then BASE=$BEFORE
          else BASE=$(git rev-parse HEAD~1); fi
          git worktree add -q "$RUNNER_TEMP/base" "$BASE"
          cd app
          python -m tools.pr_plan --base-tree "$RUNNER_TEMP/base" --saves "$GITHUB_WORKSPACE/chapter-saves" > "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json"
          jq -r '"Plan: \(.mode)" + (if .why then " (\(.why))" else "" end) + (if (.left | length) > 0 then "; left to the nightly: \(.left | join(", "))" else "" end)' "$RUNNER_TEMP/plan.json" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"matrix=" + (.shards | tojson)' "$RUNNER_TEMP/plan.json" >> "$GITHUB_OUTPUT"
          jq -r '"slice=" + (if .mode == "smoke" then "smoke" elif (.chapters | length) > 0 then (.chapters | join(",")) else "files" end)' "$RUNNER_TEMP/plan.json" >> "$GITHUB_OUTPUT"
          jq -r '"files=" + (.files | join(","))' "$RUNNER_TEMP/plan.json" >> "$GITHUB_OUTPUT"
          jq -r '"base_keys=" + (.base_keys | tojson)' "$RUNNER_TEMP/plan.json" >> "$GITHUB_OUTPUT"

  # The slice's plays, one job per week-two shard of a touched chapter (tools/weektwo_shards.py, WEEKTWO_SLICE and
  # WEEKTWO_SHARD): that shard's tests of the chapter, each play on from the base's saved end of the chapter before, which
  # fails, not replays, when it is missing. A shard too long for the job's timeout is left to the nightly (NIGHTLY_ONLY). `smoke`
  # plays the push routes from the start through day eight, no saves read. A readout that differs leaves its new text as
  # an artifact, like the full run's.
  playthrough-slice:
    needs: slice
    if: needs.slice.outputs.matrix != '[]' && needs.slice.outputs.matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.slice.outputs.matrix) }}
    env:
      READOUTS_OUT: ${{ github.workspace }}/readouts-new
      WEEKTWO_SLICE: ${{ needs.slice.outputs.slice }}
      WEEKTWO_SHARD: ${{ matrix.shard != 'smoke' && matrix.shard || '' }}
      WEEKTWO_FILES: ${{ needs.slice.outputs.files }}
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
      ASHFALL_BASE_KEYS: ${{ github.workspace }}/base-keys.json
      ASHFALL_REQUIRE_SAVED: ${{ needs.slice.outputs.slice != 'smoke' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: The base's saved ends
        if: needs.slice.outputs.slice != 'smoke'
        uses: actions/cache/restore@v4
        with:
          path: chapter-saves
          key: chapter-ends-v1-none
          restore-keys: chapter-ends-v1-
      - name: The keys they are under
        env:
          BASE_KEYS: ${{ needs.slice.outputs.base_keys }}
        run: echo "$BASE_KEYS" > "$ASHFALL_BASE_KEYS"
      - name: Playthrough (${{ matrix.shard }})
        working-directory: app
        run: |
          python -m pytest -q -m playthrough tests/weektwo -n 4 --dist loadgroup --durations=15 --durations-min=1
      - name: Upload changed readouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readouts-new-${{ github.job }}-${{ strategy.job-index }}
          path: readouts-new/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record whether the tests passed
        if: always()
        uses: ./.github/actions/readout-verdict
        with:
          status: ${{ job.status }}
          index: ${{ strategy.job-index }}
          total: ${{ strategy.job-total }}
      - name: Fail when a readout differs from its committed text
        if: always() && hashFiles('readouts-new/**') != ''
        uses: ./.github/actions/readout-differs

  # The whole game's smoke plan, beside the slice rather than after it: where a change is one every chapter reads, or week
  # one's, the shards of `WHOLE_GAME` (tools/weektwo_shards.py) play from the start, since the base's saved ends are older
  # than the change and no chapter's slice reads their readouts. It decides for itself (tools/pr_plan.py, `whole_game`)
  # so that it waits on `changes` alone: a job after `slice` has 6 minutes (tests/test_ci_budget.py), which the plays
  # from the start overran on half the runs; beside `slice` it has 8, the same 10-minute chain.
  playthrough-whole-game:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      READOUTS_OUT: ${{ github.workspace }}/readouts-new
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then BASE=$BEFORE
          else BASE=$(git rev-parse HEAD~1); fi
          git worktree add -q "$RUNNER_TEMP/base" "$BASE"
          cd app
          python -m tools.pr_plan --base-tree "$RUNNER_TEMP/base" > "$RUNNER_TEMP/plan.json"
          jq -r '"shards=" + (.whole_game | join(","))' "$RUNNER_TEMP/plan.json" | tee -a "$GITHUB_OUTPUT"
      - name: Playthrough (${{ steps.plan.outputs.shards }})
        if: steps.plan.outputs.shards != ''
        working-directory: app
        env:
          SHARDS: ${{ steps.plan.outputs.shards }}
        run: |
          for shard in ${SHARDS//,/ }; do
            WEEKTWO_SHARD=$shard python -m pytest -q -m playthrough tests/weektwo -n 4 --dist loadgroup --durations=15 --durations-min=1
          done
      - name: Upload changed readouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readouts-new-${{ github.job }}
          path: readouts-new/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record whether the tests passed
        if: always()
        uses: ./.github/actions/readout-verdict
        with:
          status: ${{ job.status }}
          index: ${{ strategy.job-index }}
          total: ${{ strategy.job-total }}
      - name: Fail when a readout differs from its committed text
        if: always() && hashFiles('readouts-new/**') != ''
        uses: ./.github/actions/readout-differs

  # Full run only. The tests that read a whole scripted playthrough (marked playthrough; tests/rules/play/routes.py plays
  # each representative route once per session and they share it). Split by which session-scoped plays a test shares,
  # so no job plays another's plays again; a directory added later runs in `everything-else` until it gets a job of its
  # own. A readout whose text changed (app/tests/readout_snapshot.py) leaves its new text in readouts-new/, uploaded as
  # an artifact.
  playthrough:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: everything-else
            args: --ignore=tests/daytwo --ignore=tests/weekone --ignore=tests/weekone_saved --ignore=tests/weektwo
          - part: day-two
            args: tests/daytwo
    env:
      READOUTS_OUT: ${{ github.workspace }}/readouts-new
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: Playthrough (${{ matrix.part }})
        working-directory: app
        run: python -m pytest -q -m playthrough ${{ matrix.args }} --durations=25 --durations-min=1
      - name: Upload changed readouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readouts-new-${{ github.job }}-${{ strategy.job-index }}
          path: readouts-new/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record whether the tests passed
        if: always()
        uses: ./.github/actions/readout-verdict
        with:
          status: ${{ job.status }}
          index: ${{ strategy.job-index }}
          total: ${{ strategy.job-total }}
      - name: Fail when a readout differs from its committed text
        if: always() && hashFiles('readouts-new/**') != ''
        uses: ./.github/actions/readout-differs

  # The saved ends week two's chapters play on (app/tests/weektwo/ends.py), written by tools/chapter_saves.py, one
  # directory per chapter under that chapter's key (tests/weektwo/keys.py). Each job starts from the last nightly's saves
  # (`publish-ends`) and writes only the chapters whose key is new, so a change to one chapter replays that chapter and the
  # ones after it, not the chain from day one. No route's chain reads another's and no heavy-step reading needs another, so
  # each part writes its routes' ends, a rebased group or a readings part, uploads what it wrote, and the readers restore the
  # cache and merge the parts' artifacts over it; test_weektwo_saved.py fails if a saved file is in no part. The jobs that
  # read the saves fail, not replay, when they are missing (ASHFALL_REQUIRE_SAVED).
  # Which chapters each part holds is planned from each chapter's measured cost (`saves-plan`, tools/saves_plan.py, the
  # table tools/ci_costs.json), so a chapter added re-splits them with no edit here. A route's chain is cut into links, link
  # k of every route in `chapter-saves-link-k` after `-(k-1)`, starting from the ends the link before uploaded (AFTER); a
  # rank the plan has no link for runs one idle leg, so every rank passes. The rebased groups and the readings parts start
  # from typical's saved ends, so they run once the last rank has. The ranks are the links a chain may have
  # (saves_plan.RANKS): a plan that needs more fails `saves-plan` and tests/test_saves_plan.py until a job is added by
  # copying the last. The steps are shared (the YAML anchor) and set by PART, NAMES and AFTER.
  saves-plan:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      rank1: ${{ steps.plan.outputs.rank1 }}
      rank2: ${{ steps.plan.outputs.rank2 }}
      rank3: ${{ steps.plan.outputs.rank3 }}
      rank4: ${{ steps.plan.outputs.rank4 }}
      rank5: ${{ steps.plan.outputs.rank5 }}
      rank6: ${{ steps.plan.outputs.rank6 }}
      rank7: ${{ steps.plan.outputs.rank7 }}
      rank8: ${{ steps.plan.outputs.rank8 }}
      rank9: ${{ steps.plan.outputs.rank9 }}
      rank10: ${{ steps.plan.outputs.rank10 }}
      rebased: ${{ steps.plan.outputs.rebased }}
      readings: ${{ steps.plan.outputs.readings }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - id: plan
        working-directory: app
        run: |
          PYTHONPATH=. python -m tools.saves_plan > "$RUNNER_TEMP/plan.json"
          jq -r '.ranks | to_entries[] | "rank\(.key + 1)=\(.value | tojson)"' "$RUNNER_TEMP/plan.json" >> "$GITHUB_OUTPUT"
          jq -r '"rebased=\(.rebased | tojson)", "readings=\(.readings | tojson)"' "$RUNNER_TEMP/plan.json" >> "$GITHUB_OUTPUT"

  chapter-saves:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: babysitter
            names: babysitter
    env:
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
      PART: ${{ matrix.part }}
      NAMES: ${{ matrix.names }}
      AFTER: ""
    steps: &chapter-saves-steps
      - if: env.NAMES != ''
        uses: actions/checkout@v4
      - if: env.NAMES != ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        if: env.NAMES != ''
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: The last nightly's saved ends
        if: env.NAMES != ''
        uses: actions/cache/restore@v4
        with:
          path: chapter-saves
          key: chapter-ends-v1-none
          restore-keys: chapter-ends-v1-
      - name: The ends this link starts from (${{ env.AFTER }})
        if: env.AFTER != ''
        uses: actions/download-artifact@v4
        with:
          name: chapter-saves-${{ env.AFTER }}
          path: chapter-saves
      - name: Saves, written where today's key is new (${{ env.NAMES }})
        id: write
        if: env.NAMES != ''
        working-directory: app
        run: |
          touch "$RUNNER_TEMP/stamp"
          PYTHONPATH=. python tools/chapter_saves.py --write $NAMES
          PYTHONPATH=. python tools/chapter_saves.py --prune
          test -n "$(find "$ASHFALL_SAVES_ROOT" -name manifest.json -newer "$RUNNER_TEMP/stamp")"
          echo "$PART" > "$ASHFALL_SAVES_ROOT/part-$PART.txt"
          { echo "files<<EOF"; find "$ASHFALL_SAVES_ROOT" -type f -newer "$RUNNER_TEMP/stamp"; echo EOF; } >> "$GITHUB_OUTPUT"
      - if: env.NAMES != ''
        uses: actions/upload-artifact@v4
        with:
          name: chapter-saves-${{ env.PART }}
          path: ${{ steps.write.outputs.files }}
          retention-days: 1

  chapter-saves-link-1:
    needs: saves-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.saves-plan.outputs.rank1) }}
    env:
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
      PART: ${{ matrix.part }}
      NAMES: ${{ matrix.names }}
      AFTER: ${{ matrix.after }}
    steps: *chapter-saves-steps

  chapter-saves-link-2:
    needs: [saves-plan, chapter-saves-link-1]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.saves-plan.outputs.rank2) }}
    env:
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
      PART: ${{ matrix.part }}
      NAMES: ${{ matrix.names }}
      AFTER: ${{ matrix.after }}
    steps: *chapter-saves-steps

  chapter-saves-link-3:
    needs: [saves-plan, chapter-saves-link-2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.saves-plan.outputs.rank3) }}
    env:
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
      PART: ${{ matrix.part }}
      NAMES: ${{ matrix.names }}
      AFTER: ${{ matrix.after }}
    steps: *chapter-saves-steps

  chapter-saves-link-4:
    needs: [saves-plan, chapter-saves-link-3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.saves-plan.outputs.rank4) }}
    env:
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
      PART: ${{ matrix.part }}
      NAMES: ${{ matrix.names }}
      AFTER: ${{ matrix.after }}
    steps: *chapter-saves-steps

  chapter-saves-link-5:
    needs: [saves-plan, chapter-saves-link-4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.saves-plan.outputs.rank5) }}
    env:
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
      PART: ${{ matrix.part }}
      NAMES: ${{ matrix.names }}
      AFTER: ${{ matrix.after }}
    steps: *chapter-saves-steps

  chapter-saves-link-6:
    needs: [saves-plan, chapter-saves-link-5]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.saves-plan.outputs.rank6) }}
    env:
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
      PART: ${{ matrix.part }}
      NAMES: ${{ matrix.names }}
      AFTER: ${{ matrix.after }}
    steps: *chapter-saves-steps

  chapter-saves-link-7:
    needs: [saves-plan, chapter-saves-link-6]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.saves-plan.outputs.rank7) }}
    env:
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
      PART: ${{ matrix.part }}
      NAMES: ${{ matrix.names }}
      AFTER: ${{ matrix.after }}
    steps: *chapter-saves-steps

  chapter-saves-link-8:
    needs: [saves-plan, chapter-saves-link-7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.saves-plan.outputs.rank8) }}
    env:
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
      PART: ${{ matrix.part }}
      NAMES: ${{ matrix.names }}
      AFTER: ${{ matrix.after }}
    steps: *chapter-saves-steps

  chapter-saves-link-9:
    needs: [saves-plan, chapter-saves-link-8]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.saves-plan.outputs.rank9) }}
    env:
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
      PART: ${{ matrix.part }}
      NAMES: ${{ matrix.names }}
      AFTER: ${{ matrix.after }}
    steps: *chapter-saves-steps

  chapter-saves-link-10:
    needs: [saves-plan, chapter-saves-link-9]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.saves-plan.outputs.rank10) }}
    env:
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
      PART: ${{ matrix.part }}
      NAMES: ${{ matrix.names }}
      AFTER: ${{ matrix.after }}
    steps: *chapter-saves-steps

  chapter-saves-rebased:
    needs: [saves-plan, chapter-saves-link-10]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.saves-plan.outputs.rebased) }}
    env:
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: The last nightly's saved ends
        uses: actions/cache/restore@v4
        with:
          path: chapter-saves
          key: chapter-ends-v1-none
          restore-keys: chapter-ends-v1-
      - uses: actions/download-artifact@v4
        with:
          pattern: chapter-saves-typical-*
          merge-multiple: true
          path: chapter-saves
      - name: Typical's rebased saves, written where today's key is new (${{ matrix.part }})
        id: write
        working-directory: app
        run: |
          touch "$RUNNER_TEMP/stamp"
          PYTHONPATH=. python tools/chapter_saves.py --write ${{ matrix.part }}
          echo "${{ matrix.part }}" > "$ASHFALL_SAVES_ROOT/part-${{ matrix.part }}.txt"
          { echo "files<<EOF"; find "$ASHFALL_SAVES_ROOT" -type f -newer "$RUNNER_TEMP/stamp"; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: chapter-saves-${{ matrix.part }}
          path: ${{ steps.write.outputs.files }}
          retention-days: 1

  # The typical route's heavy-step readings (planned by tools/saves_plan.py), each part read from typical's saved end, so a part pays for
  # its own steps and not for replaying typical's play to reach them.
  chapter-saves-readings:
    needs: [saves-plan, chapter-saves-link-10]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.saves-plan.outputs.readings) }}
    env:
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: The last nightly's saved ends
        uses: actions/cache/restore@v4
        with:
          path: chapter-saves
          key: chapter-ends-v1-none
          restore-keys: chapter-ends-v1-
      - uses: actions/download-artifact@v4
        with:
          pattern: chapter-saves-typical-*
          merge-multiple: true
          path: chapter-saves
      - name: Readings, written where today's key is new (${{ matrix.part }})
        id: write
        working-directory: app
        run: |
          touch "$RUNNER_TEMP/stamp"
          PYTHONPATH=. python tools/chapter_saves.py --write ${{ matrix.part }}
          echo "${{ matrix.part }}" > "$ASHFALL_SAVES_ROOT/part-${{ matrix.part }}.txt"
          { echo "files<<EOF"; find "$ASHFALL_SAVES_ROOT" -type f -newer "$RUNNER_TEMP/stamp"; echo EOF; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: chapter-saves-${{ matrix.part }}
          path: ${{ steps.write.outputs.files }}
          retention-days: 1

  # Full run only, like the jobs below that read the chapter saves (they are skipped with it). Week one's plays
  # (tests/weekone/routes.py, days three to six on one player) and the tests that read them. The push routes' plays are
  # left as an artifact (tests/weekone/test_weekone_export.py) for `playthrough-week-one-saved`.
  playthrough-week-one:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      READOUTS_OUT: ${{ github.workspace }}/readouts-new
      ASHFALL_WEEKONE_PLAYS: ${{ github.workspace }}/weekone-plays
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - working-directory: app
        run: python -m pytest -q -m playthrough tests/weekone --durations=25 --durations-min=1
      - name: Upload week one's plays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekone-plays
          path: weekone-plays/
          retention-days: 1
      - name: Upload changed readouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readouts-new-${{ github.job }}-${{ strategy.job-index }}
          path: readouts-new/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record whether the tests passed
        if: always()
        uses: ./.github/actions/readout-verdict
        with:
          status: ${{ job.status }}
          index: ${{ strategy.job-index }}
          total: ${{ strategy.job-total }}
      - name: Fail when a readout differs from its committed text
        if: always() && hashFiles('readouts-new/**') != ''
        uses: ./.github/actions/readout-differs
  # The saved chain's first link (tests/weekone_saved): week one's saved ends equal the plays week one's job made,
  # compared on the same play, not a replay; plays nothing, so it runs the moment both jobs are done.
  playthrough-week-one-saved:
    needs: [chapter-saves, chapter-saves-readings, chapter-saves-link-10, chapter-saves-rebased, playthrough-week-one]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      READOUTS_OUT: ${{ github.workspace }}/readouts-new
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
      ASHFALL_WEEKONE_PLAYS: ${{ github.workspace }}/weekone-plays
      ASHFALL_REQUIRE_SAVED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: The last nightly's saved ends
        uses: actions/cache/restore@v4
        with:
          path: chapter-saves
          key: chapter-ends-v1-none
          restore-keys: chapter-ends-v1-
      - uses: actions/download-artifact@v4
        with:
          pattern: chapter-saves-*
          merge-multiple: true
          path: chapter-saves
      - uses: actions/download-artifact@v4
        with:
          name: weekone-plays
          path: weekone-plays
      - working-directory: app
        run: python -m pytest -q -m playthrough tests/weekone_saved --durations=10 --durations-min=1
      - name: Upload changed readouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readouts-new-${{ github.job }}-${{ strategy.job-index }}
          path: readouts-new/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record whether the tests passed
        if: always()
        uses: ./.github/actions/readout-verdict
        with:
          status: ${{ job.status }}
          index: ${{ strategy.job-index }}
          total: ${{ strategy.job-total }}
      - name: Fail when a readout differs from its committed text
        if: always() && hashFiles('readouts-new/**') != ''
        uses: ./.github/actions/readout-differs
  # Week two's plays (tests/weektwo/routes.py), each chapter played on from the saved end of the one before
  # (tests/weektwo/ends.py), one job per shard (tools/weektwo_shards.py, the names from `shards-cover`): a play and its
  # readers are in one shard, and within it share one xdist worker (tests/weektwo/conftest.py, `group_by_play`).
  playthrough-week-two:
    needs: [chapter-saves, chapter-saves-readings, chapter-saves-link-10, chapter-saves-rebased, shards-cover]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards-cover.outputs.weektwo) }}
    env:
      READOUTS_OUT: ${{ github.workspace }}/readouts-new
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
      ASHFALL_REQUIRE_SAVED: "1"
      WEEKTWO_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: The last nightly's saved ends
        uses: actions/cache/restore@v4
        with:
          path: chapter-saves
          key: chapter-ends-v1-none
          restore-keys: chapter-ends-v1-
      - uses: actions/download-artifact@v4
        with:
          pattern: chapter-saves-*
          merge-multiple: true
          path: chapter-saves
      - name: Playthrough (week two, ${{ matrix.shard }})
        working-directory: app
        run: python -m pytest -v -m playthrough tests/weektwo -n 4 --dist loadgroup --durations=25 --durations-min=1
      - name: Upload changed readouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readouts-new-${{ github.job }}-${{ strategy.job-index }}
          path: readouts-new/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record whether the tests passed
        if: always()
        uses: ./.github/actions/readout-verdict
        with:
          status: ${{ job.status }}
          index: ${{ strategy.job-index }}
          total: ${{ strategy.job-total }}
      - name: Fail when a readout differs from its committed text
        if: always() && hashFiles('readouts-new/**') != ''
        uses: ./.github/actions/readout-differs
  # The nightly's saves, kept for the slices and the full runs after it: the last cache's ends with this run's written ones
  # over them, the directories of keys no chapter has today removed. Not on a pull request's full run: a cache saved there
  # is its own. The nightly saves on main, which is where every pull request restores from; a dispatch on a branch saves for
  # the pull requests based on it.
  publish-ends:
    needs: [changes, chapter-saves, chapter-saves-readings, chapter-saves-link-10, chapter-saves-rebased]
    if: needs.changes.outputs.full == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASHFALL_SAVES_ROOT: ${{ github.workspace }}/chapter-saves
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: The last nightly's saved ends
        uses: actions/cache/restore@v4
        with:
          path: chapter-saves
          key: chapter-ends-v1-none
          restore-keys: chapter-ends-v1-
      - uses: actions/download-artifact@v4
        with:
          pattern: chapter-saves-*
          merge-multiple: true
          path: chapter-saves
      - name: Drop the ends of old keys
        working-directory: app
        run: PYTHONPATH=. python tools/chapter_saves.py --prune
      - uses: actions/cache/save@v4
        with:
          path: chapter-saves
          key: chapter-ends-v1-${{ github.run_id }}

  # The engine's speed gate (tools/bench_ab.py): this tree's `reading` and `steps` against the base's, timed in turn in
  # this one job, so the runner's CPU type and load cancel. The base is the merge-base with the target branch on a pull
  # request, and the previous tip of main on a push. `steps` needs the Postgres.
  engine-bench:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ASHFALL_TEST_PG: postgresql://postgres@127.0.0.1/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start Postgres
        run: >
          docker run -d --name postgres -p 5432:5432
          -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_INITDB_ARGS="--locale=C --encoding=UTF8"
          "$PG_IMAGE" -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: Find the base
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then BASE=$BEFORE
          else BASE=$(git rev-parse HEAD~1); fi
          echo "base $BASE"
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          git worktree add -q /tmp/before "$BASE"
      - name: Wait for Postgres
        working-directory: app
        run: for _ in $(seq 60); do python -c "import psycopg; psycopg.connect('$ASHFALL_TEST_PG').close()" 2>/dev/null && break; sleep 1; done
      - working-directory: app
        run: |
          DATABASE_URL="$ASHFALL_TEST_PG" python -m ashfall_app.db migrate
          DATABASE_URL="$ASHFALL_TEST_PG" python -m tools.bench_ab /tmp/before/app 4 3

  # Strict on every package, with no held count (app/pyrightconfig.json). It also covers tools/scene, whose imports
  # (Pillow) are in requirements-dev.txt for its sake.
  pyright:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - working-directory: app
        run: pyright

  # The client (app/client/): its generated API types in step with the checked-in openapi.json (the spec's own match with
  # the app is tests/test_openapi_spec.py, in `tests`), strict tsc over src/, fixtures/ and test/, the tests, and the
  # bundle.
  client:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: app/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated types match openapi.json (on drift, run npm run types)
        run: |
          npx openapi-typescript generated/openapi.json -o "$RUNNER_TEMP/schema.d.ts"
          diff generated/schema.d.ts "$RUNNER_TEMP/schema.d.ts"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: test -s build/game.js && test -s build/game.css

  # The app image, built beside the tests. On main it is pushed by digest alone, a tag Flux never sees; `release` names
  # it once everything is green.
  app-image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 7

      # The placeholder page's dev log shows the latest commit subjects (served at /changes; ashfall_app/main.py).
      - name: Short sha and dev log
        id: sha
        run: |
          echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          mkdir -p app/ashfall_app/build
          git log -6 --format='%cs %s' > app/ashfall_app/build/changes.txt
          test -s app/ashfall_app/build/changes.txt

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, and on main push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Containerfile
          platforms: linux/amd64
          build-args: |
            BUILD_VERSION=${{ steps.sha.outputs.short }}
            BUILD_RELEASE=${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,"name=${{ env.DOCKERHUB_REPO }},${{ env.GHCR_REPO }}",push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The one check branch protection requires. A skipped required check counts as passed, and a job whose need failed is
  # skipped, so this runs always and fails unless every job this run was meant to run succeeded: `changes` always, the
  # per-PR set when code changed, `docs` when it did not, and the playthroughs when the run is full. A job outside the
  # run's set must be skipped, not merely absent from the count.
  ci-ok:
    if: always()
    timeout-minutes: 1
    outputs:
      readouts_only: ${{ steps.readouts.outputs.only }}
    needs:
      - changes
      - docs
      - tests
      - shards-cover
      - mutant-plants
      - playthrough-smoke
      - slice
      - playthrough-slice
      - playthrough-whole-game
      - publish-ends
      - playthrough
      - saves-plan
      - chapter-saves
      - chapter-saves-readings
      - chapter-saves-link-1
      - chapter-saves-link-2
      - chapter-saves-link-3
      - chapter-saves-link-4
      - chapter-saves-link-5
      - chapter-saves-link-6
      - chapter-saves-link-7
      - chapter-saves-link-8
      - chapter-saves-link-9
      - chapter-saves-link-10
      - chapter-saves-rebased
      - playthrough-week-one
      - playthrough-week-one-saved
      - playthrough-week-two
      - engine-bench
      - pyright
      - client
      - app-image
    runs-on: ubuntu-latest
    steps:
      # The full run's verdict for the nightly: red only where a readout job's tests passed and a readout differs.
      - if: always() && inputs.full == true
        uses: actions/checkout@v4
        with:
          sparse-checkout: app/tools
      - if: always() && inputs.full == true
        uses: actions/download-artifact@v4
        with:
          pattern: readout-verdict-*
          path: ${{ runner.temp }}/verdicts
          merge-multiple: true
      - id: readouts
        if: always() && inputs.full == true
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" > "$RUNNER_TEMP/needs.json"
          python3 app/tools/nightly_verdict.py readouts-only --needs "$RUNNER_TEMP/needs.json" --verdicts "$RUNNER_TEMP/verdicts" | tee -a "$GITHUB_OUTPUT"
      - env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          FULL: ${{ needs.changes.outputs.full }}
          MATRIX: ${{ needs.slice.outputs.matrix }}
          ENDS: ${{ needs.changes.outputs.full == 'true' && github.event_name != 'pull_request' }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"'
          echo "code=$CODE full=$FULL slice=$MATRIX ends=$ENDS"
          echo "$NEEDS" | jq -e --arg code "$CODE" --arg full "$FULL" --arg matrix "$MATRIX" --arg ends "$ENDS" '
            ["tests", "shards-cover", "mutant-plants", "playthrough-smoke", "engine-bench", "pyright",
             "client", "app-image"] as $per_pr
            | ["playthrough", "saves-plan", "chapter-saves", "chapter-saves-readings", "chapter-saves-link-1",
               "chapter-saves-link-2", "chapter-saves-link-3", "chapter-saves-link-4", "chapter-saves-link-5",
               "chapter-saves-link-6", "chapter-saves-link-7", "chapter-saves-link-8",
               "chapter-saves-link-9", "chapter-saves-link-10",
               "chapter-saves-rebased", "playthrough-week-one", "playthrough-week-one-saved",
               "playthrough-week-two"] as $full_run
            | (["changes"] + (if $code == "true" then $per_pr else ["docs"] end)
               + (if $code == "true" and $full != "true" then ["slice", "playthrough-whole-game"] else [] end)
               + (if $code == "true" and $full != "true" and $matrix != "[]" and $matrix != "" then ["playthrough-slice"] else [] end)
               + (if $ends == "true" then ["publish-ends"] else [] end)
               + (if $full == "true" then $full_run else [] end)) as $wanted
            | ($code == "true" or $code == "false")
              and all(to_entries[]; if (.key | IN($wanted[])) then .value.result == "success"
                                    else .value.result == "skipped" end)' > /dev/null

  # The pushed digest under its deployable names: a manifest copy inside each repository, so no layer moves.
  # always(), then the two results by name: without a status function the implicit success() also requires every job
  # upstream of ci-ok, and the jobs a run is not meant to run are skipped, which made release skip on every push.
  release:
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.ci-ok.result == 'success' && needs.app-image.result == 'success'
    needs: [ci-ok, app-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # The whole-game plays are the nightly's, so a red nightly means the game on main is broken somewhere this push's
      # slice did not play. The release holds until a nightly passes: dispatch Nightly on main once it is fixed, then re-run
      # this job.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Hold for a red nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly.yml --branch main --status completed --limit 10 \
            --json conclusion,databaseId,createdAt --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0] // empty | "\(.conclusion) \(.databaseId) \(.createdAt)"')
          echo "last nightly: ${last:-none}"
          set -- $last
          # A nightly red only because readouts differ leaves a verdict artifact (nightly.yml, refresh-readouts) and holds nothing.
          gh run download "${2:-0}" --repo "$GITHUB_REPOSITORY" -n nightly-verdict -D "$RUNNER_TEMP/nightly-verdict" 2>/dev/null || true
          python3 app/tools/nightly_verdict.py held --conclusion "${1:-}" --run "${2:-}" --verdict "$RUNNER_TEMP/nightly-verdict"

      # Flux's ImagePolicy sorts tag strings, so the commit timestamp must not go backwards.
      - name: Name the tag
        id: tag
        run: |
          TS=$(git show -s --format=%ct HEAD)
          PREV_TS=$(git show -s --format=%ct HEAD~1 2>/dev/null || echo 0)
          if [ "$TS" -lt "$PREV_TS" ]; then
            echo "REFUSING: commit timestamp $TS is older than its parent's $PREV_TS." >&2
            echo "Image tags would sort backwards and Flux would not deploy this commit." >&2
            exit 1
          fi
          echo "tag=main-${GITHUB_SHA::8}-$TS" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag dev and ${{ steps.tag.outputs.tag }}
        env:
          DIGEST: ${{ needs.app-image.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          test -n "$DIGEST"
          for repo in "$DOCKERHUB_REPO" "$GHCR_REPO"; do
            docker buildx imagetools create -t "$repo:dev" -t "$repo:$TAG" "$repo@$DIGEST"
          done
          echo "released $TAG"

  # After a push to main releases: is the scene art served live the art this sha's generator builds? Art is seeded by
  # hand (app/tools/seed_assets.sh), so a merge that changes tools/scene changes nothing live until someone reseeds. The
  # job only reports: exit 42 (stale or unstamped) and 43 (manifest unreadable) show as a warning, never a red run, and
  # nothing here reseeds. tools/scene/drift.py has the comparison.
  scene-art-drift:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          rc=0
          python tools/scene/drift.py || rc=$?
          case "$rc" in
            0) ;;
            42|43) echo "::warning title=Scene art drift::tools/scene/drift.py exited $rc: the live scene art is not what this commit builds" ;;
            *) exit "$rc" ;;
          esac
