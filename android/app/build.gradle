plugins {
    id 'com.android.application'
}

android {
    namespace = 'pub.yggdrasil.ostmere'
    compileSdk = 36
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId = 'pub.yggdrasil.ostmere'
        minSdk = 26
        targetSdk = 36
        // A release build passes both from the tag (.github/workflows/android.yml); other builds keep these.
        versionCode = (findProperty('ostmereVersionCode') ?: '1') as int
        versionName = findProperty('ostmereVersionName') ?: '0.1.0'
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
