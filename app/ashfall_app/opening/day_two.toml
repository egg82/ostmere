aim_night_2 = "get you both to morning."
aim_room = "make her a place of her own."
aim_cart = "get back what she left on the ridge."
aim_after = "dig in. something knows you're here."
l_her_row = "she's gone for roots. nobody asked."
l_her_first = "she's back with what she went for."
l_her_rule = "she hears you out and gets back to it."
l_stool_1 = "you give up your seat. it was a poor seat."
l_stool_2 = "it rocks. she knocks a stone chip under the short leg."
l_name = "lucy, she says, for the stool. a long look at the ridge."
l_evening_2 = "dusk. two at the fire."
l_night_2a = "from high up, wood grinding over stone. it goes on."
l_night_2b = "then nothing. she heard it. she sleeps, or seems to."
l_morning_3 = "she's up first, the fire fed. the stool's chip lies by it."
l_room_1 = "the lean-to is yours. the ash by the fire is pressed flat."
l_room_2 = "a shelter, a woodstack. one first."
l_shelter = "two stones and green poles, low by the lean-to. hers."
l_woodstack = "a bed of flat stones. dry wood stacks on it chest high."
l_bed_1 = "four poles, set to stand a hand off the ground."
l_bed_2 = "stones under each pole, tamped in."
l_bed_3 = "you lie on it. the wet is under you now, not in you."
l_offer_1 = "she glances at her roof, then asks you something."
l_offer_2 = "would you fetch the cart her people left? she could go herself."
l_yes = "she looks at you. an offer, and you took it."
l_walk_go = "you step into the gap, the ridge ahead."
l_she_goes = "she leaves for the ridge, her own work waiting."
l_walk_out = "the gap stands empty. the ridge is far."
l_walk_out_2 = "fog slides off the ridge and fills the low ground."
l_walk_out_3 = "the fire burns down a notch. no one comes back through the gap."
l_walk_out_4 = "the light goes flat. still no one on the ridge path."
l_b4_1 = "the ash holds the cart's shape. no cart."
l_b4_2 = "drag marks run off over the edge."
l_b4_3 = "wolf prints crowd the ground around it."
l_b4_4 = "you tell her, at the fire. she listens. she doesn't answer."
l_b4_h1 = "she walks in through the gap with nothing."
l_b4_h2 = "she sits at the fire. she doesn't look up."
l_b4_h3 = "not a word from her. you don't ask."
l_camp_7 = "nine dry on the wall now. she showed you how."
l_camp_8 = "the catch hangs two rows deep now."
