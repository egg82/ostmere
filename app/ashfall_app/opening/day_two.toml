l_seed_stand = "an old wall, and roots run to seed along it."
l_lichen = "lichen crusts the cold side of a stone. it roasts."
l_clay_bank = "a soft clay bank by the stream, roots through it."
l_old_bed = "an old bed of roots, gone wild and heavy."
l_wet_hollow = "roots thick in a wet hollow. you wade in."
l_root_mat = "roots matted so tight you roll them up."
l_flagged_floor = "ash over a flagged floor. you lift what you can."
l_fallen_gable = "a gable down, timbers whole. you take them."
l_dressed_kerb = "dressed stone along a kerb, edges still sharp."
l_straight_poles = "young birch grown straight. every one a pole."
l_root_plate = "a root plate taller than you, stones locked in it."
l_tighter_rack = "you turn the strips on edge. the rack takes one more."
n_day_b4 = "her people's cart wasn't on the ridge. she's stopped looking that way"
