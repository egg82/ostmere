# The opening: the first fifteen minutes, as data. Schema and units: schema.py (whole items, seconds, items per hour).
# Everything the server and the page need to know about the opening is in this file; nothing else holds a number.
# Every card is one card, tapped by hand or run in the mix (engine DESIGN.txt, "CARDS"); a told step is a card with a
# cap. No gate counts taps (docs/decisions.md): what opens the next thing is a step the player takes (a first armful,
# the wall's first batch, a cleared spot), a cost shown as have/need, a level that pays a find, or the body's clock.
version = 1

# The one card for the edge of the written content, out of the fiction (docs/decisions.md); the loader puts it on the
# last shipped chapter's end_feature.
end_card = { title_key = "end_title", line_keys = ["end_1", "end_2"], button_key = "end_button" }

# Unlocked at the start of a new save. The standing actions run from the first second; the stores they work on
# (warmth, fullness, energy) are never unlocked, so they stay out of the ledger and show only as chips.
start = [
  { unlock_kind = "card", id = "stand_up" },
  { unlock_kind = "action", id = "chill" },
  { unlock_kind = "action", id = "hunger" },
  { unlock_kind = "action", id = "weariness" },
  { unlock_kind = "chip", id = "hungry" },
  { unlock_kind = "chip", id = "tired" },
]
start_line_keys = []

# The label of the hands lane (never declared in [[lanes]]). The end moment is this feature unlocked (api/CONTRACT.txt,
# "The end"); its lines are appended by the page then, since no engine event marks it.
hands_label_key = "lane_hands"
end_feature = "keeps_going"
end_line_keys = ["l_dusk_1", "l_dusk_2"]

# The first mix: offered once the spot is cleared, when stones for the ring and wood for the wall pull at once. The
# player makes it with one tap; the page never does.
first_mix = { feature = "mix", cards = ["gather_wood", "scavenge"] }

# What the player keeps doing by hand becomes an offer. A hands card tapped `hand_taps` times within
# `hand_taps_within_s` game seconds, while the hands ran a mix without it, is offered to the mix: hands taps take 3 to
# 10 s, so five in fifteen minutes is a habit and not a one-off. The same switch of the player's mix made `switches`
# times under one chip within `switches_within_s` is offered as a rule: chips come and go over hours, so three in a day.
repeat_offers = { hand_taps = 5, hand_taps_within_s = 900, switches = 3, switches_within_s = 86400 }

# XP thresholds in whole items of XP, for levels 2, 3, ... of every skill.
curve_items = [6, 10, 20, 36]

# The bar to work toward. Every hands card fills it by its work (one per second at a full share), tapped or mixed
# alike, so taps count for no more than the time they take. Its bonuses never touch a mix card's rates, so no saved
# mix changes under the player.
[camp]
store = "camp"
items_per_hour = 3600

[[camp.levels]]
at_items = 150
pays_key = "camp_pays_1"
pays_from = 3
pays_to = 5
line_keys = ["l_camp_1"]
# The warm wall takes 5 at a time instead of 3: the drying wall, earned. Five thirds has no exact basis-point factor,
# so the cost is a hair under five (it never asks for more than five whole items) and the make a hair over.
modifiers = [
  { target = "rate", id = "lay_to_dry", flow = "cost", store = "damp_wood", kind = "mul_bp", amount_bp = 16666, source = "camp_1" },
  { target = "rate", id = "lay_to_dry", flow = "make", store = "dry_wood", kind = "mul_bp", amount_bp = 16667, source = "camp_1" },
]

[[camp.levels]]
at_items = 360
pays_key = "camp_pays_2"
pays_from = 12
pays_to = 18
line_keys = ["l_camp_2"]
# Stores hold half again.
modifiers = [
  { target = "cap", id = "damp_wood", kind = "mul_bp", amount_bp = 15000, source = "camp_2" },
  { target = "cap", id = "dry_wood", kind = "mul_bp", amount_bp = 15000, source = "camp_2" },
  { target = "cap", id = "stones", kind = "mul_bp", amount_bp = 15000, source = "camp_2" },
  { target = "cap", id = "roots", kind = "mul_bp", amount_bp = 15000, source = "camp_2" },
]

# Past the opening: the bar fills to it and holds there, "?" on its marker, until a later step lifts it.
[[camp.levels]]
at_items = 1500
pays_key = "pays_unknown"
held = true

# ---------- stores ----------

[[stores]]
id = "damp_wood"
label_key = "store_damp_wood"
cap_items = 12

[[stores]]
id = "dry_wood"
label_key = "store_dry_wood"
cap_items = 12

[[stores]]
id = "stones"
label_key = "store_stones"
cap_items = 12

[[stores]]
id = "nails"
label_key = "store_nails"
cap_items = 1

[[stores]]
id = "flint"
label_key = "store_flint"
cap_items = 2

[[stores]]
id = "roots"
label_key = "store_roots"
cap_items = 8

[[stores]]
id = "camp"
label_key = "store_camp"
cap_items = 1500

# Never unlocked: counts the steps the end waits for (both crafts and the roast), whichever comes last.
[[stores]]
id = "settled"
label_key = "store_settled"
cap_items = 3

# Never unlocked: the light going, filled by the evening action once the camp is settled. Dusk waits for it, so the
# last step's lines get a quiet stretch to themselves before the end lines come; the scene's dusk grade comes on over
# it (tools/scene/grades.py), keyed on the action.
[[stores]]
id = "evening"
label_key = "store_evening"
cap_items = 1

[[stores]]
id = "warmth"
label_key = "store_warmth"
cap_items = 10

[[stores]]
id = "fullness"
label_key = "store_fullness"
cap_items = 10
initial_items = 10

[[stores]]
id = "energy"
label_key = "store_energy"
cap_items = 10
initial_items = 10

# ---------- skills ----------

# Each row shows its next level and what it brings ("?" for a story unlock). Finds are triggers on the level below;
# Woodcutting 2 is what the crafts require.
[[skills]]
id = "scavenging"
label_key = "skill_scavenging"
levels = [{ level = 2, pays_key = "pays_find" }, { level = 3, pays_key = "pays_find" }, { level = 4, pays_key = "pays_unknown" }]

[[skills]]
id = "woodcutting"
label_key = "skill_woodcutting"
levels = [{ level = 2, pays_key = "pays_crafts" }, { level = 3, pays_key = "pays_unknown" }]

[[skills]]
id = "foraging"
label_key = "skill_foraging"
levels = [{ level = 2, pays_key = "pays_unknown" }]

# ---------- standing actions ----------

# The cold takes warmth, the fire gives it (and eats dry wood), the body tires and hungers, and eats roots from the
# first hunger on.
[[standing]]
id = "chill"
label_key = "action_chill"
costs = [{ store = "warmth", items_per_hour = 3600 }]

[[standing]]
id = "fire"
label_key = "action_fire"
makes = [{ store = "warmth", items_per_hour = 7200 }]
costs = [{ store = "dry_wood", items_per_hour = 6 }]

[[standing]]
id = "weariness"
label_key = "action_weariness"
costs = [{ store = "energy", items_per_hour = 54 }]

[[standing]]
id = "hunger"
label_key = "action_hunger"
costs = [{ store = "fullness", items_per_hour = 60 }]

[[standing]]
id = "eating"
label_key = "action_eating"
costs = [{ store = "roots", items_per_hour = 2 }]

# From the settled line to dusk: 45 s.
[[standing]]
id = "evening"
label_key = "action_evening"
makes = [{ store = "evening", items_per_hour = 80 }]

# ---------- lanes ----------

# The warm wall: wood laid against it dries on its own bar, tapped by hand or by an order, never mixed.
[[lanes]]
id = "rack"
label_key = "lane_rack"

# ---------- cards ----------

# The story steps by hand: stand (three pushes, each moving the figure), look, the coat.
[[cards]]
id = "stand_up"
presentation = "narrative"
label_key = "c_stand_up"
work_s = 3
cap = 3
glows = true
line_keys = ["l_up_1", "l_up_2", "l_up_3"]
finished = { unlocks = [{ unlock_kind = "card", id = "look_around" }] }

[[cards]]
id = "look_around"
presentation = "narrative"
label_key = "c_look_around"
work_s = 4
cap = 1
line_keys = ["l_look"]
finished = { unlocks = [{ unlock_kind = "card", id = "search_coat" }] }

# Coat before wood: the book is always found, so later lines can rely on it.
[[cards]]
id = "search_coat"
presentation = "narrative"
label_key = "c_search_coat"
work_s = 3
cap = 1
line_keys = ["l_coat"]
[cards.finished]
unlocks = [
  { unlock_kind = "feature", id = "book" },
  { unlock_kind = "card", id = "gather_wood" },
  { unlock_kind = "card", id = "scavenge" },
]

# Bare hands gather; the flint edge retires this card (tools before skills), which greys any mix holding it.
[[cards]]
id = "gather_wood"
presentation = "action"
label_key = "c_gather_wood"
work_s = 5
outcome = { stores = [{ store = "damp_wood", items = 1 }] }

[[cards]]
id = "scavenge"
presentation = "action"
label_key = "c_scavenge"
work_s = 6
skill = "scavenging"
xp_per_hour = 360
outcome = { stores = [{ store = "stones", items = 1 }] }

# With the edge: twice the wood, faster, and it trains a skill.
[[cards]]
id = "woodcutting"
presentation = "action"
label_key = "c_woodcutting"
work_s = 4
skill = "woodcutting"
xp_per_hour = 900
outcome = { stores = [{ store = "damp_wood", items = 2 }] }

[[cards]]
id = "forage"
presentation = "action"
label_key = "c_forage"
work_s = 5
skill = "foraging"
xp_per_hour = 300
outcome = { stores = [{ store = "roots", items = 1 }] }

[[cards]]
id = "rest"
presentation = "action"
label_key = "c_rest"
work_s = 10
# Tired halves it; a quarter share of the mix still clears tiredness in about a minute of mix time, one tap at once.
makes = [{ store = "energy", items_per_hour = 2400 }]

[[cards]]
id = "lay_to_dry"
lane = "rack"
presentation = "action"
label_key = "c_lay_to_dry"
work_s = 45
inputs = [{ store = "damp_wood", items = 3 }]
outcome = { stores = [{ store = "dry_wood", items = 3 }] }

# The fire plan, shown at the wall's first batch: clear, ring, strike. Ring and strike can be tried too early.
[[cards]]
id = "clear_spot"
presentation = "narrative"
label_key = "c_clear_spot"
work_s = 3
cap = 2
line_keys = ["l_clear_1", "l_clear_2"]
finished = { unlocks = [{ unlock_kind = "feature", id = "mix" }] }

[[cards]]
id = "ring_it"
presentation = "narrative"
label_key = "c_ring_it"
work_s = 3
cap = 1
inputs = [{ store = "stones", items = 5 }]
requires = [{ test = "at_least", subject_kind = "card_count", id = "clear_spot", value = 2 }]
line_keys = ["l_ring"]
finished = { unlocks = [{ unlock_kind = "feature", id = "ring" }] }

[[cards]]
id = "strike_fire"
presentation = "narrative"
label_key = "c_strike_fire"
work_s = 4
cap = 1
glows = true
inputs = [{ store = "dry_wood", items = 1 }]
requires = [
  { test = "at_least", subject_kind = "card_count", id = "ring_it", value = 1 },
  { test = "at_least", subject_kind = "store", id = "flint", value = 1 },
  { test = "at_least", subject_kind = "store", id = "nails", value = 1 },
]
line_keys = ["l_fire_takes"]
[cards.finished]
line_keys = ["l_fire_lit"]
unlocks = [
  { unlock_kind = "action", id = "fire" },
  { unlock_kind = "chip", id = "cold" },
  { unlock_kind = "feature", id = "ledger" },
  { unlock_kind = "card", id = "knap_edge" },
]

# Two pushes, a flint each: the first flint is struck for the fire, so the second push waits on Scavenging 3's find.
# The edge retires gathering by hand and brings woodcutting and the choice of two crafts, both in view at once.
[[cards]]
id = "knap_edge"
presentation = "narrative"
label_key = "c_knap_edge"
work_s = 3
cap = 2
inputs = [{ store = "flint", items = 1 }]
line_keys = ["l_knap_1", "l_knap_2"]
[cards.finished]
line_keys = ["l_retire"]
unlocks = [
  { unlock_kind = "retired", id = "gather_wood", replaced_by = "woodcutting" },
  { unlock_kind = "card", id = "woodcutting" },
  { unlock_kind = "skill", id = "woodcutting" },
  { unlock_kind = "feature", id = "craft" },
  { unlock_kind = "card", id = "make_stool" },
  { unlock_kind = "card", id = "build_fireback" },
]

[[cards]]
id = "roast_roots"
presentation = "narrative"
label_key = "c_roast_roots"
work_s = 4
cap = 1
inputs = [{ store = "roots", items = 3 }]
requires = [{ test = "at_least", subject_kind = "card_count", id = "strike_fire", value = 1 }]
line_keys = ["l_roast"]
outcome = { stores = [{ store = "fullness", items = 7 }] }
[cards.finished]
stores = [{ store = "settled", items = 1 }]
modifiers = [{ target = "rate", id = "hunger", flow = "cost", store = "fullness", kind = "mul_bp", amount_bp = 1000, source = "roasted" }]

# The choice: each names only its upside; the cost is what the other card's time now reads. Both get built before the
# end; the order is the choice. The first built opens reading by the fire.
[[cards]]
id = "make_stool"
presentation = "craft"
label_key = "c_make_stool"
upside_key = "up_stool"
work_s = 10
cap = 1
inputs = [{ store = "dry_wood", items = 3 }]
requires = [{ test = "at_least", subject_kind = "skill_level", id = "woodcutting", value = 2 }]
line_keys = ["l_stool"]
[cards.finished]
stores = [{ store = "settled", items = 1 }]
unlocks = [{ unlock_kind = "feature", id = "stool" }, { unlock_kind = "card", id = "read_by_fire" }]
modifiers = [
  { target = "rate", id = "rest", flow = "make", store = "energy", kind = "mul_bp", amount_bp = 15000, source = "stool" },
]

[[cards]]
id = "build_fireback"
presentation = "craft"
label_key = "c_build_fireback"
upside_key = "up_fireback"
work_s = 10
cap = 1
inputs = [{ store = "dry_wood", items = 3 }, { store = "stones", items = 4 }]
requires = [{ test = "at_least", subject_kind = "skill_level", id = "woodcutting", value = 2 }]
line_keys = ["l_fireback"]
[cards.finished]
stores = [{ store = "settled", items = 1 }]
unlocks = [{ unlock_kind = "feature", id = "fireback" }, { unlock_kind = "card", id = "read_by_fire" }]
modifiers = [
  { target = "rate", id = "fire", flow = "cost", store = "dry_wood", kind = "mul_bp", amount_bp = 6667, source = "fireback" },
]

[[cards]]
id = "read_by_fire"
presentation = "narrative"
label_key = "c_read_by_fire"
work_s = 6
cap = 1
line_keys = ["l_read"]

# ---------- chips ----------

[[chips]]
id = "cold"
label_key = "chip_cold"
tone = "cold"
when = { test = "at_most", subject_kind = "store", id = "warmth", value = 3, release = 5 }
effects = [{ target = "lane", id = "hands", kind = "mul_bp", amount_bp = 8000, source = "cold" }]
cost_key = "chip_cold_cost"

[[chips]]
id = "hungry"
label_key = "chip_hungry"
tone = "hungry"
on_line_key = "l_hungry"
when = { test = "at_most", subject_kind = "store", id = "fullness", value = 3, release = 6 }
effects = [{ target = "rate", id = "weariness", flow = "cost", store = "energy", kind = "mul_bp", amount_bp = 15000, source = "hungry" }]
cost_key = "chip_hungry_cost"

[[chips]]
id = "tired"
label_key = "chip_tired"
tone = "tired"
on_line_key = "l_tired"
when = { test = "at_most", subject_kind = "store", id = "energy", value = 3, release = 6 }
effects = [{ target = "lane", id = "hands", kind = "mul_bp", amount_bp = 5000, source = "tired" }]
cost_key = "chip_tired_cost"

# ---------- triggers ----------

# Each opens on a step the player takes (a first armful, a first find, the wall's first batch, both crafts built), a
# level, or the body's clock. Only the clock's two (hunger, tiredness) can open anything with nobody there.

[[triggers]]
id = "t_first_wood"
when = { test = "at_least", subject_kind = "card_count", id = "gather_wood", value = 1 }
[triggers.outcome]
line_keys = ["l_wood"]
unlocks = [{ unlock_kind = "store", id = "damp_wood" }, { unlock_kind = "card", id = "lay_to_dry" }]

[[triggers]]
id = "t_nail"
when = { test = "at_least", subject_kind = "card_count", id = "scavenge", value = 1 }
[triggers.outcome]
stores = [{ store = "nails", items = 1 }]
line_keys = ["l_nail"]
unlocks = [
  { unlock_kind = "store", id = "nails" },
  { unlock_kind = "store", id = "stones" },
  { unlock_kind = "skill", id = "scavenging" },
]

[[triggers]]
id = "t_wall"
when = { test = "at_least", subject_kind = "card_count", id = "lay_to_dry", value = 1 }
[triggers.outcome]
line_keys = ["l_wall"]
unlocks = [
  { unlock_kind = "store", id = "dry_wood" },
  { unlock_kind = "store", id = "camp" },
  { unlock_kind = "card", id = "clear_spot" },
  { unlock_kind = "card", id = "ring_it" },
  { unlock_kind = "card", id = "strike_fire" },
  { unlock_kind = "store", id = "flint" },
]

[[triggers]]
id = "t_flint"
when = { test = "at_least", subject_kind = "skill_level", id = "scavenging", value = 2 }
outcome = { stores = [{ store = "flint", items = 1 }], line_keys = ["l_flint"] }

[[triggers]]
id = "t_flint_2"
when = { test = "at_least", subject_kind = "skill_level", id = "scavenging", value = 3 }
outcome = { stores = [{ store = "flint", items = 1 }], line_keys = ["l_flint_2"] }

# In the wait for Woodcutting 2 after the edge: a line on the player's own first cut, tapped or mixed.
[[triggers]]
id = "t_stack"
when = { test = "at_least", subject_kind = "card_count", id = "woodcutting", value = 1 }
outcome = { line_keys = ["l_stack"] }

[[triggers]]
id = "t_woodcutting_2"
when = { test = "at_least", subject_kind = "skill_level", id = "woodcutting", value = 2 }
outcome = { line_keys = ["l_wc_2"] }

# The clock: hunger brings its cure and the roast, which needs the fire. Eating starts with it, so the roots line goes
# red with its order card: the hands' rule offer, mid-opening for a slow player, a step before the end for a quick one.
[[triggers]]
id = "t_hungry"
when = { test = "at_most", subject_kind = "store", id = "fullness", value = 3 }
[triggers.outcome]
unlocks = [
  { unlock_kind = "card", id = "forage" },
  { unlock_kind = "card", id = "roast_roots" },
  { unlock_kind = "store", id = "roots" },
  { unlock_kind = "skill", id = "foraging" },
  { unlock_kind = "action", id = "eating" },
]

[[triggers]]
id = "t_first_roots"
when = { test = "at_least", subject_kind = "card_count", id = "forage", value = 1 }
outcome = { line_keys = ["l_roots"] }

[[triggers]]
id = "t_tired"
when = { test = "at_most", subject_kind = "store", id = "energy", value = 3 }
outcome = { unlocks = [{ unlock_kind = "card", id = "rest" }] }

# The choice answered: when reading by the fire starts with one craft built and the other not, a line on what the
# player put first. Reading is the first thing either craft opens, so a player who builds both before reading gets
# neither line.
[[triggers]]
id = "t_stool_first"
when = { test = "at_least", subject_kind = "running", id = "read_by_fire", value = 1 }
requires = [
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "stool", value = 1 },
  { test = "at_most", subject_kind = "unlocked", unlock_kind = "feature", id = "fireback", value = 0 },
]
outcome = { line_keys = ["l_stool_first"] }

[[triggers]]
id = "t_fireback_first"
when = { test = "at_least", subject_kind = "running", id = "read_by_fire", value = 1 }
requires = [
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "fireback", value = 1 },
  { test = "at_most", subject_kind = "unlocked", unlock_kind = "feature", id = "stool", value = 0 },
]
outcome = { line_keys = ["l_fireback_first"] }

# The last of the two crafts and the roast, whichever it is (for a newcomer the second craft; a quick player can build
# both before hunger comes). The evening starts here; the end feature waits for it.
[[triggers]]
id = "t_settled"
when = { test = "at_least", subject_kind = "store", id = "settled", value = 3 }
[triggers.outcome]
line_keys = ["l_settled"]
unlocks = [{ unlock_kind = "action", id = "evening" }]

[[triggers]]
id = "t_evening"
when = { test = "at_least", subject_kind = "store", id = "evening", value = 1 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "keeps_going" }] }

# ---------- the journal ----------

[journal]
feature = "book"

# A days note is written at its beat's own step (api/CONTRACT.txt, "JOURNAL").
[[entries]]
id = "e_days_1"
section = "days"
hand = "ink"
runners = []

[[notes]]
id = "n_day_b2"
entry = "e_days_1"
gate = { test = "at_least", subject_kind = "card_count", id = "strike_fire", value = 1 }
beat = "B2"

# ---------- features ----------

[[features]]
id = "book"
label_key = "feature_book"

[[features]]
id = "mix"

[[features]]
id = "ring"

[[features]]
id = "ledger"

[[features]]
id = "craft"

[[features]]
id = "stool"

[[features]]
id = "fireback"

[[features]]
id = "keeps_going"

# ---------- aims ----------

# What each stretch is for, a felt goal in the story's voice, one line at the band's top (schema: feature_entries.AimEntry). An
# aim holds from its `after` until the next aim's is unlocked; the first holds from the start.
[[aims]]
id = "aim_fire"
text_key = "aim_fire"

[[aims]]
id = "aim_alive"
text_key = "aim_alive"
after = { unlock_kind = "action", id = "fire" }

[[aims]]
id = "aim_stay"
text_key = "aim_stay"
after = { unlock_kind = "feature", id = "craft" }

# ---------- order cards ----------

# Shown inline under the red line that needs them, pre-filled. Each lets go at its release, a few items above where it
# comes on, so a rule's mix does not flip on and off at one level; the release stays under the store's cap.
[[order_cards]]
store = "dry_wood"
tap_card = "lay_to_dry"
when = { test = "at_most", subject_kind = "store", id = "dry_wood", value = 2, release = 6 }

[[order_cards]]
store = "roots"
tap_card = "forage"
when = { test = "at_most", subject_kind = "store", id = "roots", value = 3, release = 6 }
offered_after = { unlock_kind = "action", id = "eating" }

# The second mix, taught after the end (docs/design/opening-screen.md, the hands strip): offered in the strip while
# tired, once the end lines have been read; its `when` is the chip's, so the rule reads as the chip.
[[order_cards]]
store = "energy"
tap_card = "rest"
chip = "tired"
after_end = true
when = { test = "at_most", subject_kind = "store", id = "energy", value = 3, release = 6 }

# ---------- text ----------
# Each line is true in every state it can fire in (content/team/opening-v2.md, "Line moments").

[line_kinds]
l_up_1 = "story"
l_up_2 = "story"
l_up_3 = "story"
l_look = "story"
