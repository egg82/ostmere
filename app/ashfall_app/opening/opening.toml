# Kept: approved lines whose moment opening v2 keeps.
l_up_1 = "you get an arm under you. it gives."
l_up_2 = "knees under you this time. then not."
l_up_3 = "up. the wall holds you there until the ground stops tilting."
l_look = "walls, mostly. a roof over one corner. grey every way you look, nothing moving in it. your hands have been cold a long while."
l_coat = "inside the coat, a book with its first pages gone at the stitching. wrapped with it, a charcoal stick worn short."
l_wood = "dead birch, snapped off by hand, wet through."
l_nail = "under a fallen beam, a bent nail. you keep it."
l_clear_1 = "you scrape the ash back to stone with the side of your boot."
l_flint = "a grey stone that sparks against the nail. you carry it back in your fist."
l_fire_takes = "it takes. you sit close enough to smell your sleeves."
l_fire_lit = "fire lit. it eats a stick every ten minutes."
l_knap_2 = "with the edge, a birch comes down in four strokes."
l_roots = "roots under the scrub, bitter and full of grit."
l_roast = "roasted, they go soft enough to eat. you eat three."
l_stool = "four legs, one of them short. you sit on it anyway."
l_fireback = "stones stacked at the fire's back. its heat comes off them onto your face."

# New in opening v2: moments that are new or changed.
l_wall = "the wood comes off the wall dry. the wall is warm, and clean of ash. nothing else here is."
l_clear_2 = "the stone underneath is cut, and fitted, and warm as the wall. your boot found its edge before you thought to look."
l_ring = "five stones in a ring on the cut stone. none of them rocks."
l_flint_2 = "another flint, from further in under the rubble."
l_camp_1 = "you've stopped tripping on the rubble."
l_camp_2 = "you could find anything here in the dark. there isn't much to find."
l_hungry = "you catch yourself chewing a birch splinter."
l_tired = "your arms go heavy. you work at half the pace, and it wasn't much of one."
l_knap_1 = "the flint splits wrong and opens two of your fingers. wiping the blood off, you find a mark inside your wrist, old and neater than a scar."
l_retire = "no more snapping dead wood by hand. the edge does it better."
l_wc_2 = "you split the birch where you mean to now."
l_stack = "you stack the cut birch by the wall. the ash greys the top logs and stops at the stone."
l_read = "by firelight, the first page after the torn ones isn't quite blank. something drawn on a page that's gone has pressed through: circles, round a circle."
l_settled = "it's starting to look like somewhere to stay. you eat from the roots as you go, a little at a time."
l_stool_first = "a seat first, then. the open fire eats wood while you sit."
l_fireback_first = "the fire got a back to lean on first. you read on your knees."
l_dusk_1 = "the grey goes to brown, and the brown to dark. then the cracks in the floor begin to glow, a dull red, in rings around the place you woke."
l_dusk_2 = "far off on the ridge, a light comes up that isn't yours. it doesn't move. it doesn't go out."

# Aims: each true for its whole stretch, a goal felt rather than a task named.
aim_fire = "you're freezing. a fire, before dark."
aim_alive = "keep the fire alive, and yourself."
aim_stay = "make this somewhere you could stay."

# The journal's notes (api/CONTRACT.txt, "JOURNAL").
n_day_b2 = "fire, by my own hand. the first thing i've made, that i know of"
