# Prestige: the rules numbers every skill's phases read, and each skill's track of nodes, as data merged after the
# last shipped chapter (schema.Chapter, chapters.merge). Mechanics: docs/design/prestige-phases.md.
version = 1

# A phase tops out at level 22: the lowest level whose span (54,980 items of XP) a full share of the fastest card
# (900 an hour) cannot cross inside the ordinary absence (opening/prestige.check_phase_spans).
[prestige]
top_level = 22
carry_window_s = 172800
menu_size = 3

# ---------- nodes ----------
# Each node acts outside its skill. A rank adds 2500 bp (+25%), about two and a half of the skill's x1.1 level pays.
# A track is sized so a typical game fills about two thirds of it: typical clicks woodcutting 5 times and scavenging 4 by
# day 90 with its mix left as at S4 (docs/design/prestige-phases.md, "Size each skill's track"), so woodcutting holds
# seven nodes and scavenging six, and a pick leaves the rest unfinished. The other skills do not reach a click by then:
# two one-rank nodes each, the least a choice needs.

[[nodes]]
id = "wc_lever"
skill = "woodcutting"
label_key = "node_wc_lever"
changes = { target = "work", id = "scavenge" }
ranks = 1
per_rank_bp = 2500

