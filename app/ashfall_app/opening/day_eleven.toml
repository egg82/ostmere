  { unlock_kind = "card", id = "n6_peg_flaps" },
  { unlock_kind = "card", id = "n7_peg_flaps" },
  { unlock_kind = "card", id = "g_hearth_peg_flaps" },
]

# The windbreak and the wraps on the family's lanes and their group, once the hands have each.
[[triggers]]
id = "t_family_windbreak"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "card", id = "build_windbreak", value = 1 }
