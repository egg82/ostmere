# ---------- damp wood's sink past woodcutting's first top ----------

# A reach stake on the hearth's lane (issue #40): woodcutting comes back faster after its first top and damp wood overfills.
# Level 24 counts across phases, so it opens at the first click. Its order card comes on with damp wood full and takes a
# whole store at a time, so it takes only what would overflow, and the hands' cards that take damp wood keep theirs.
# On the hearth's lane, so it never takes the hands' time.
