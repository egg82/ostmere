when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "card", id = "cover_beds", value = 1 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "family_joined", value = 1 }]
[triggers.outcome]
