# ---------- T1: night 15, the frost ----------

# The rime at the chip's 12, B13 + 10 h on every route: the night grade's clock, the chip and both its cures, its order
# card offered with it (day eight's roofs card, on her lane). Left undone the beds grow three quarters: a cost that
# stays small. A cover takes two pelts, the pelts' sink for the season.
[[triggers]]
id = "t_frost"
when = { test = "at_least", subject_kind = "store", id = "rime", value = 12 }
outcome = { line_keys = ["l_night_15", "l_frost_1", "l_frost_2"], unlocks = [{ unlock_kind = "action", id = "night_15" }] }

# The chip and both its cures wait for the beds: the frost's lines about them, the chip and the covers open with the beds
# while the frost still runs, at T1's instant when they are already open.
[[triggers]]
id = "t_frost_beds"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "action", id = "beds", value = 1 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "action", id = "night_15", value = 1 }, { test = "at_least", subject_kind = "running", id = "frost", value = 1 }]
outcome = { line_keys = ["l_frost_beds"], unlocks = [{ unlock_kind = "chip", id = "frosted" }, { unlock_kind = "card", id = "cover_beds" }, { unlock_kind = "card", id = "n3_cover_beds" }] }

# Night 15, a hidden clock the scene's night grade reads until morning 16 (clear_clock 18, T2's instant).
[[stores]]
id = "night_15"
label_key = "store_night_15"
cap_items = 20
hidden = true
clock = "night"

[[standing]]
id = "night_15"
label_key = "action_night_15"
makes = [{ store = "night_15", items_per_hour = 20 }]

[[chips]]
id = "frosted"
label_key = "chip_frosted"
tone = "cold"
when = { test = "at_least", subject_kind = "store", id = "rime", value = 12 }
effects = [{ target = "rate", id = "beds", flow = "make", store = "ripe", kind = "mul_bp", amount_bp = 7500, source = "frosted" }]
cost_key = "chip_frosted_cost"

[[cards]]
id = "cover_beds"
presentation = "action"
label_key = "c_cover_beds"
upside_key = "up_cover_beds"
work_s = 600
inputs = [{ store = "rime", items = 12 }, { store = "pelt", items = 2 }]
outcome = { stores = [{ store = "beds_covered", items = 1 }] }

[[cards]]
id = "n3_cover_beds"
twin_of = "cover_beds"
lane = "n3"
presentation = "action"
label_key = "c_n3_cover_beds"
upside_key = "up_cover_beds"
work_s = 1800
inputs = [{ store = "rime", items = 12 }, { store = "pelt", items = 2 }]
outcome = { stores = [{ store = "beds_covered", items = 1 }] }

# Every cover by anyone counts toward the fifth (day_sixteen.toml's tear): a tally the cover cards add to, read by no
# card, so the town's covers spend the rime toward it rather than past it (opening/finite_checks.py).
[[stores]]
id = "beds_covered"
label_key = "store_beds_covered"
cap_items = 5
hidden = true
tally = true

# Covering the beds is everyday work, everyone's as the reaping is, at her lane's pace.
[[town_cards]]
id = "{lane}_cover_beds"
twin_of = "cover_beds"
lanes = ["n1", "n2", "n4", "n5", "n6", "n7", "n8", "n9", "n10", "n11", "n12", "g_field"]
presentation = "action"
label_key = "c_cover_beds"
upside_key = "up_cover_beds"
work_s = 1800
inputs = [{ store = "rime", items = 12 }, { store = "pelt", items = 2 }]
outcome = { stores = [{ store = "beds_covered", items = 1 }] }

[[triggers]]
