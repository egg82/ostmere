  { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "clear", value = 1 },
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "card", id = "spar", value = 1 },
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "answered", id = "o_sun_rack", value = 1 },
]
outcome = { unlocks = [{ unlock_kind = "card", id = "stack_cordwood" }, { unlock_kind = "store", id = "cordwood" }] }

