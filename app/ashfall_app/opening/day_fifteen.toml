  { unlock_kind = "card", id = "n1_cover_beds" },
  { unlock_kind = "card", id = "n2_cover_beds" },
  { unlock_kind = "card", id = "n4_cover_beds" },
  { unlock_kind = "card", id = "n5_cover_beds" },
  { unlock_kind = "card", id = "n6_cover_beds" },
  { unlock_kind = "card", id = "n7_cover_beds" },
  { unlock_kind = "card", id = "g_field_cover_beds" },
]

# "When frosted, {n3} covers the beds": its `when` the chip's.
