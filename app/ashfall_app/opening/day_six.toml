l_pelt_kept = "story"
l_give_pelt_fail = "tap"
l_pelt_given = "story"
l_night_7 = "story"
l_sit_fire_7_fail = "tap"
l_g2_1 = "story"
l_g2_2 = "story"
l_g2_3 = "story"
l_camp_12 = "level"

