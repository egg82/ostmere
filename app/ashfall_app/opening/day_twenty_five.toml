when = { test = "at_least", subject_kind = "store", id = "bede_wait", value = 8 }
requires = [
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "belonging", value = 1 },
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "kept", value = 1 },
]
[triggers.outcome]
line_keys = ["l_b21_1", "l_b21_2", "l_b21_3", "l_b21_4"]
