# ---------- B21: the bedesman ----------

# The twenty-fifth arrival starts the wait (day eighteen's B16 shape); eight hours on, N4 walks in. The widowers' answer
# is that arrival on every route (15 at the turn, then one, two, four and three, each joining on either answer), and
# the wait reads the answer, not the count: answers are no supply to the finite check (D-169), so a count read would be
# a need nothing sure can meet.
[[stores]]
id = "bede_wait"
label_key = "store_bede_wait"
cap_items = 8
hidden = true

[[standing]]
id = "bede_wait"
label_key = "action_bede_wait"
makes = [{ store = "bede_wait", items_per_hour = 1 }]

[[triggers]]
id = "t_bede_wait"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "answered", id = "o_widowers", value = 1 }
outcome = { unlocks = [{ unlock_kind = "action", id = "bede_wait" }] }

# B21: joins N4 with every everyday town card, their first work the post's stakes; no faith bonus (cast.md, N4's rule).
[[triggers]]
