# Day twenty-five: from B20 (the wake at the stone) through I8 and the boar hunt, I9 and O-walkers, SL35, the
# post's door and Camp 19, I10, O-widowers and Lucy's next jobs to B21, as data merged after day_twenty_three.toml
# (schema.Chapter, chapters.merge). Story spoilers: never shown to the owner. Spec: content/team/week-four.md, "Day
# twenty-five"; numbers: content/team/week-four-numbers.md.
version = 1
end_feature = "bedesman_home"

# ---------- clocks ----------

# Never drawn: game hours since B20, for I8, SL35, I10 and the post's door.
[[stores]]
id = "kept_clock"
label_key = "store_kept_clock"
cap_items = 8760
hidden = true

[[standing]]
id = "kept_clock"
label_key = "action_kept_clock"
makes = [{ store = "kept_clock", items_per_hour = 1 }]

[[triggers]]
id = "t_kept_clock"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "kept", value = 1 }
outcome = { unlocks = [{ unlock_kind = "action", id = "kept_clock" }] }

# A latch, never drawn: started at B20 + 24 h, so the door can wait on it beside the post's count (a requirement reads
# only an unlock; day_twenty_three.toml's sorrel_16h). Machinery, no moment of its own.
[[stores]]
id = "kept_24h"
label_key = "store_kept_24h"
cap_items = 1
hidden = true

[[standing]]
id = "kept_24h"
label_key = "action_kept_24h"
makes = [{ store = "kept_24h", items_per_hour = 1 }]

[[triggers]]
id = "t_kept_24h"
when = { test = "at_least", subject_kind = "store", id = "kept_clock", value = 24 }
outcome = { unlocks = [{ unlock_kind = "action", id = "kept_24h" }] }

# ---------- I8: the bowl set out, and the boar hunt ----------

# The evening after the wake. The hunt opens with it: a fight card of the player's own whose losses are told from pools
# of its own (api/CONTRACT.txt, "LOSS LINES"), never before kept (loss_after).
[[triggers]]
id = "t_bowl_set"
when = { test = "at_least", subject_kind = "store", id = "kept_clock", value = 8 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "kept", value = 1 }]
outcome = { line_keys = ["l_bowl_set"], unlocks = [{ unlock_kind = "card", id = "hunt_boar" }, { unlock_kind = "feature", id = "combat" }] }

[[stores]]
id = "boar_lost"
label_key = "store_boar_lost"
cap_items = 20000

[[threats]]
id = "ash_boar"
label_key = "threat_ash_boar"
base = 14

# The hands against the boar at the warm patch: a won hunt brings meat and a hide, a lost one is told as the player's
# death and costs only the smoked carried out (no loses, no wounds).
[[cards]]
id = "hunt_boar"
only_player = "self"
presentation = "action"
label_key = "c_hunt_boar"
upside_key = "up_hunt_boar"
work_s = 7200
skill = "melee"
xp_per_hour = 900
inputs = [{ store = "smoked", items = 2 }]
outcome = { stores = [{ store = "catch", items = 6 }, { store = "pelt", items = 1 }] }
fight = { side = "hands", threat = "ash_boar", lost = "boar_lost", won_line_keys = ["l_fight_boar_won_1", "l_fight_boar_won_2", "l_fight_boar_won_3", "l_fight_boar_won_4", "l_fight_boar_won_5", "l_fight_boar_won_6"], loss_pool = ["l_fight_boar_death_1", "l_fight_boar_death_2", "l_fight_boar_death_3", "l_fight_boar_death_4", "l_fight_boar_death_5", "l_fight_boar_death_6"], loss_notes = ["n_forget_1", "n_forget_2", "n_forget_3", "n_forget_4", "n_forget_5", "n_forget_6", "n_forget_7", "n_forget_8", "n_forget_9", "n_forget_10", "n_forget_11", "n_forget_12"], on_loss_key = "on_loss_hunt_boar", loss_after = "kept" }

[[entries]]
id = "e_ash_boar"
section = "creatures"
hand = "ink"
runners = ["hunt_boar"]

[[notes]]
id = "n_boar_1"
entry = "e_ash_boar"
gate = { test = "at_least", subject_kind = "store", id = "kept_clock", value = 8 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "kept", value = 1 }]
hand = "ink"

# R2's first ramp step (regions.md, days 6-12): six days in, the sounders come; the boar a quarter stronger.
[[triggers]]
id = "t_boar_sounders"
when = { test = "at_least", subject_kind = "store", id = "r2_clock", value = 144 }
outcome = { modifiers = [{ target = "threat", id = "ash_boar", kind = "add_bp", amount_bp = 2500, source = "t_boar_sounders" }] }

