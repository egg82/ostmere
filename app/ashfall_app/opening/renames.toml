# Every id renamed or removed-with-a-mapping since release, never deleted once released (engine DESIGN.txt, "Renames",
# "Release lock"). One entry per rename:
#
#   [[renames]]
#   kind = "store"      # store, skill, standing, card, lane, chip, trigger, feature, or line (a log line's text key)
#   from = "old_id"
#   to = "new_id"       # always a new id: reusing a released one is forbidden
#
# Then run `python tools/content_lock.py --write` (from app/) so the release lock records it.
[[renames]]
kind = "trigger"
from = "t_stock_open"
to = "t_stock_shown"
