# B7: A29 in night 6, the strip on the rack's hang, the story fight (A27) and the combat it opens: the hunt, the spear,
# the poultice, the pests' standing fights, the hurt and its cure, Melee, the ramp's clock. Data merged after
# day_five.toml (schema.Chapter, chapters.merge). Story spoilers: never shown to the owner. Spec:
# content/team/days-four-to-seven.md, "B7"; numbers: content/team/days-four-to-seven-numbers.md, "Odds targets". In
# schema.IN_WRITING until its lines are written (days-four-to-seven plan, item 8). Combat-plan item 8.
version = 1
end_feature = "combat"

# ---------- A29, B7 ----------

# On the cards with B6, as sit_up_5 with B5; tappable in night 6 once three have arrived (beats.yaml, B7's gate).
[[triggers]]
id = "t_bank_fire_open"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "arcana", value = 1 }
outcome = { unlocks = [{ unlock_kind = "card", id = "bank_fire_6" }] }

# A29, B7: bank the fire in night 6. Its finish starts the strip and its clock and moves the aim.
[[cards]]
id = "bank_fire_6"
presentation = "narrative"
label_key = "c_bank_fire_6"
work_s = 5
cap = 1
glows = true
requires = [
  { test = "at_least", subject_kind = "store", id = "night_6", value = 5 },
  { test = "at_least", subject_kind = "store", id = "arrivals", value = 3 },
]
[cards.finished]
line_keys = ["l_b7_1", "l_b7_2", "l_b7_3"]
unlocks = [
  { unlock_kind = "feature", id = "wolves" },
  { unlock_kind = "action", id = "b7_clock" },
  { unlock_kind = "action", id = "b7_strip" },
  { unlock_kind = "action", id = "b7_strip_catch" },
]

# ---------- the strip ----------

# Never unlocked: fifteen game seconds, in tenths. b7_clock's own action and both strips draw it, 2400 an hour while
# all three run, so the strip ends by the clock whether or not the rack runs dry first. A paused runner makes and
# costs nothing, so each store has its own strip: one dry store never holds the other's.
[[stores]]
id = "b7_clock"
label_key = "store_b7_clock"
cap_items = 10
initial_items = 10

[[standing]]
id = "b7_clock"
label_key = "action_b7_clock"
costs = [{ store = "b7_clock", items_per_hour = 2200 }]

# Each takes more than its store's full cap at B7 (smoked 27, catch 13) inside the clock, pausing at empty.
[[standing]]
id = "b7_strip"
label_key = "action_b7_strip"
costs = [{ store = "smoked", items_per_hour = 7200 }, { store = "b7_clock", items_per_hour = 100 }]

[[standing]]
id = "b7_strip_catch"
label_key = "action_b7_strip"
costs = [{ store = "catch", items_per_hour = 3600 }, { store = "b7_clock", items_per_hour = 100 }]

# A27 opens with B7, so it is tapped in B7's visit. Its bar (20 s; the hands are only ever slowed) outlasts the strip's
# clock (15 s), so the rack its lines find stripped is bare whenever it finishes.
[[triggers]]
id = "t_stand_open"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "wolves", value = 1 }
outcome = { unlocks = [{ unlock_kind = "card", id = "b7_stand" }] }

# A27: drive them off. A beat never rolls, so no fight table. Its finish opens combat and all of the week's fights.
[[cards]]
id = "b7_stand"
presentation = "narrative"
label_key = "c_b7_stand"
work_s = 20
cap = 1
glows = true
[cards.finished]
line_keys = ["l_stand_1", "l_stand_2", "l_stand_3", "l_combat_first"]
unlocks = [
  { unlock_kind = "feature", id = "combat" },
  { unlock_kind = "skill", id = "melee" },
  { unlock_kind = "store", id = "pelt" },
  { unlock_kind = "chip", id = "hurt" },
  { unlock_kind = "card", id = "hunt_wolf" },
  { unlock_kind = "card", id = "make_spear" },
  { unlock_kind = "card", id = "poultice" },
  { unlock_kind = "action", id = "rats" },
  { unlock_kind = "action", id = "crows" },
  { unlock_kind = "action", id = "heal" },
  { unlock_kind = "action", id = "r1_clock" },
]

# ---------- sides and threats ----------

[[sides]]
id = "hands"
label_key = "side_hands"
base = 8

[[sides]]
id = "larder"
label_key = "side_larder"
base = 4

[[sides]]
id = "rack"
label_key = "side_rack"
base = 4

[[threats]]
id = "lone_wolf"
label_key = "threat_lone_wolf"
base = 4

[[threats]]
id = "ashrats"
label_key = "threat_ashrats"
base = 4

[[threats]]
id = "crows"
label_key = "threat_crows"
base = 4

# The old man's mending (day_five.toml, n4_mend), held on the hands while it runs, at its share of his time.
[while_running]
n4_mend = [{ side = "hands", amount_bp = 2500 }]

# Day three's cures, each an entry on its pest's side once built.
[[triggers]]
id = "t_floor_guard"
when = { test = "at_least", subject_kind = "card_count", id = "larder_floor", value = 3 }
outcome = { modifiers = [{ target = "side", id = "larder", kind = "add_bp", amount_bp = 30000, source = "larder_floor" }] }

[[triggers]]
id = "t_roof_guard"
when = { test = "at_least", subject_kind = "card_count", id = "rack_roof", value = 2 }
outcome = { modifiers = [{ target = "side", id = "rack", kind = "add_bp", amount_bp = 30000, source = "rack_roof" }] }

# ---------- the hunt, the spear, the hurt and its cure ----------

# Never drawn: what a lost hunt adds, shown by its chip. A drawn line would read as falling and uncovered while it heals.
[[stores]]
id = "hurt"
label_key = "store_hurt"
cap_items = 3

[[stores]]
id = "pelt"
label_key = "store_pelt"
cap_items = 12

# Tallies: made only by their fight's lines, never unlocked; caps over a year of the fastest rate.
[[stores]]
id = "hunt_lost"
label_key = "store_hunt_lost"
cap_items = 40000

[[stores]]
id = "rats_fought"
label_key = "store_rats_fought"
cap_items = 10000

[[stores]]
id = "rats_lost"
label_key = "store_rats_lost"
cap_items = 10000

[[stores]]
id = "crows_fought"
label_key = "store_crows_fought"
cap_items = 10000

[[stores]]
id = "crows_lost"
label_key = "store_crows_lost"
cap_items = 10000

# The hunt: uncapped on the hands, run in the mix; a won share brings the catch and a pelt, a lost one a hurt. Its
# work divides one item's quantity units.
[[cards]]
id = "hunt_wolf"
presentation = "action"
label_key = "c_hunt_wolf"
work_s = 1200
skill = "melee"
xp_per_hour = 2
inputs = [{ store = "smoked", items = 1 }]
outcome = { stores = [{ store = "catch", items = 3 }, { store = "pelt", items = 1 }] }
fight = { side = "hands", threat = "lone_wolf", lost = "hunt_lost", wounds = [{ store = "hurt", items = 1 }], won_line_keys = ["l_fight_hunt_won_1", "l_fight_hunt_won_2", "l_fight_hunt_won_3"], lost_line_keys = ["l_fight_hunt_lost_1", "l_fight_hunt_lost_2", "l_fight_hunt_lost_3"] }

[[cards]]
id = "make_spear"
presentation = "craft"
label_key = "c_make_spear"
upside_key = "up_make_spear"
work_s = 600
cap = 1
inputs = [{ store = "scrap", items = 6 }, { store = "dry_wood", items = 4 }]
[cards.finished]
modifiers = [{ target = "side", id = "hands", kind = "add_bp", amount_bp = 15000, source = "make_spear" }]

[[cards]]
id = "poultice"
presentation = "action"
label_key = "c_poultice"
work_s = 60
inputs = [{ store = "clay", items = 2 }, { store = "roots", items = 6 }]
# Takes up to a whole stack of hurt, forgiven past what is there: one tap clears any level, and it can be tapped
# whenever the chip shows (engine DESIGN.txt, "DRAINS").
drains = [{ store = "hurt", items = 3 }]

# The first poultice's line: an uncapped card's outcome holds stores only.
[[triggers]]
id = "t_poultice_first"
when = { test = "at_least", subject_kind = "card_count", id = "poultice", value = 1 }
outcome = { line_keys = ["l_poultice"] }

# Heals one hurt every 4 h by itself.
[[standing]]
id = "heal"
label_key = "action_heal"
costs = [{ store = "hurt", items_per_hour = 1, every_hours = 4 }]

[[chips]]
id = "hurt"
label_key = "chip_hurt"
tone = "hurt"
# Shows from a quarter hurt, the level the heal resumes at after pausing at 0, so it never shows with nothing healing
# (engine DESIGN.txt, "DRAINS", KNOWN GAPS).
when = { test = "at_least", subject_kind = "store", id = "hurt", value = 1, every = 4 }
effects = [
  { target = "lane", id = "hands", kind = "mul_bp", amount_bp = 8500, source = "hurt" },
  { target = "side", id = "hands", kind = "mul_bp", amount_bp = 7500, source = "hurt" },
]
cost_key = "chip_hurt_cost"
on_line_key = "l_hurt"
off_line_key = "l_healed"

# ---------- the pests ----------

[[standing]]
id = "rats"
label_key = "action_rats"
fight = { side = "larder", threat = "ashrats", lost = "rats_lost", fought = "rats_fought", fights_per_hour = 1, loses = [{ store = "roots", items = 2 }], won_line_keys = ["l_fight_rats_won_1", "l_fight_rats_won_2", "l_fight_rats_won_3"], lost_line_keys = ["l_fight_rats_lost_1", "l_fight_rats_lost_2", "l_fight_rats_lost_3"] }

[[standing]]
id = "crows"
label_key = "action_crows"
fight = { side = "rack", threat = "crows", lost = "crows_lost", fought = "crows_fought", fights_per_hour = 1, loses = [{ store = "smoked", items = 1 }], won_line_keys = ["l_fight_crows_won_1", "l_fight_crows_won_2", "l_fight_crows_won_3"], lost_line_keys = ["l_fight_crows_lost_1", "l_fight_crows_lost_2", "l_fight_crows_lost_3"] }

# ---------- the ramp's clock ----------

# Never unlocked: game hours since combat opened. Week 1 has no ramp step; week 2's first step reads it.
[[stores]]
id = "r1_clock"
label_key = "store_r1_clock"
cap_items = 8760

[[standing]]
id = "r1_clock"
label_key = "action_r1_clock"
makes = [{ store = "r1_clock", items_per_hour = 1 }]

