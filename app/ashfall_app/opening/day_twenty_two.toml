# Day twenty-two: week three's last visit (the walk shown at T13), then I1, the season's turn at 504 h, through B18 (the
# first walk), SL29, I2, I3, I4 and SL30 to B19 (the stranger home), as data merged after day_nineteen.toml
# (schema.Chapter, chapters.merge). Story spoilers: never shown to the owner. Spec: content/team/week-four.md, "Day
# twenty-two"; numbers: content/team/week-four-numbers.md.
version = 1
end_feature = "stranger_home"

# ---------- T13's visit: the walk shown ----------

# On week three's end: the walk over the ridge, shown unready with its countdown to the turn (D-156), so every route can
# queue it or set its share before the night's absence.
[[triggers]]
id = "t_walk_shown"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "week_three_end", value = 1 }
[triggers.outcome]
line_keys = ["l_walk_shown"]
unlocks = [
  { unlock_kind = "card", id = "walk_ashwood" },
  { unlock_kind = "store", id = "charwood" },
]

# Every walk's outcome adds one, hands or town, so the finds read one number whoever walked (D-158).
[[stores]]
id = "ashwood_trips"
label_key = "store_ashwood_trips"
cap_items = 8760
tally = true

# Dead hardwood, dry to the heart: the post's timber (day twenty-three).
[[stores]]
id = "charwood"
label_key = "store_charwood"
cap_items = 24

# Dawn 22, the hour before the turn, in twentieths of an hour (day four's dawn_5): the walk opens at its end, and the
# face says "opens at dawn" where a countdown beside the walk's supplies could not be drawn.
[[stores]]
id = "dawn_22"
label_key = "store_dawn_22"
cap_items = 20
clock = "dawn"

[[standing]]
id = "dawn_22"
label_key = "action_dawn_22"
makes = [{ store = "dawn_22", items_per_hour = 20 }]

[[triggers]]
id = "t_dawn_22"
when = { test = "after_time", value = 1810800 }
outcome = { unlocks = [{ unlock_kind = "action", id = "dawn_22" }] }

# A day out over the ridge and back, alone: an uncapped trip in the mix, its supplies what the table eats, ready from
# the turn (D-156).
[[cards]]
id = "walk_ashwood"
presentation = "action"
label_key = "c_walk_ashwood"
upside_key = "up_walk_ashwood"
work_s = 3600
skill = "wayfinding"
xp_per_hour = 360
inputs = [{ store = "smoked", items = 2 }]
requires = [{ test = "at_least", subject_kind = "store", id = "dawn_22", value = 20 }]
outcome = { stores = [{ store = "charwood", items = 2 }, { store = "fungus", items = 1 }, { store = "ashwood_trips", items = 1 }] }

