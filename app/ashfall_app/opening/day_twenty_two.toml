# SL30, texture: the three sing at supper on the season's thirtieth hour.
[[triggers]]
id = "t_singing"
when = { test = "at_least", subject_kind = "store", id = "still_clock", value = 30 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "answered", id = "o_choir", value = 1 }]
outcome = { line_keys = ["l_sing_1", "l_sing_2"], whereabouts = [{ person = "n8", layer = "figure_n8_singing" }, { person = "n9", layer = "figure_n9_singing" }, { person = "n10", layer = "figure_n10_singing" }] }

# ---------- B19: the stranger home ----------

# Six walks, I4 + 3 h, the season's thirtieth hour: they walk in behind the player and stay. A lane of their own from
# here, an arrival counted.
[[triggers]]
id = "t_b19"
when = { test = "at_least", subject_kind = "store", id = "ashwood_trips", value = 6 }
requires = [
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "action", id = "pace_3h", value = 1 },
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "action", id = "still_30", value = 1 },
]
[triggers.outcome]
whereabouts = [{ person = "n13", layer = "figure_n13_arrived" }]
line_keys = ["l_b19_1", "l_b19_2", "l_b19_3", "l_b19_group"]
stores = [{ store = "arrivals", items = 1 }]
unlocks = [
  { unlock_kind = "feature", id = "stranger_home" },
