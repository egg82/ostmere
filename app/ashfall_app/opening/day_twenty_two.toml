# ---------- I1: the season's turn ----------

# I1 at 504 h. What only the season brings draws a pool this turn fills (season_checks): the film's hours, the hour of
# thaw that takes the last season's rime, the fish under the fog. No rate is raised. The Clear's chore rules go (D-154,
# retire_checks), and the arrivals' count may run past 20 (D-164).
[[triggers]]
id = "t_i1"
season = true
when = { test = "after_time", value = 1814400 }
[triggers.outcome]
line_keys = ["l_i1_1", "l_i1_2", "l_i1_3"]
stores = [
  { store = "still_left", items = 168 },
  { store = "thaw_left", items = 1 },
  { store = "fish_rising", items = 24 },
]
unlocks = [
  { unlock_kind = "feature", id = "still" },
  { unlock_kind = "action", id = "settle" },
  { unlock_kind = "action", id = "thaw" },
]
modifiers = [{ target = "cap", id = "arrivals", kind = "mul_bp", amount_bp = 20000, source = "t_i1" }]
retire_orders = ["cover_beds", "n3_cover_beds", "warm_beds"]

# Never drawn: the season's hours of settling ash left. I1 fills it; the settling draws it, so it ends at 672 h.
[[stores]]
id = "still_left"
label_key = "store_still_left"
cap_items = 168
hidden = true

# Never drawn: the hour of thaw that empties the rime.
[[stores]]
id = "thaw_left"
label_key = "store_thaw_left"
cap_items = 1
hidden = true

# Never drawn but by its cures: ash settled on the open meat, the face of the chip below.
[[stores]]
id = "film"
label_key = "store_film"
cap_items = 24
hidden = true

# The pale fish under the fog: a pool nothing refills (the deer's shape); nothing waits on it.
[[stores]]
id = "fish_rising"
label_key = "store_fish_rising"
cap_items = 24

[[standing]]
id = "settle"
label_key = "action_settle"
costs = [{ store = "still_left", items_per_hour = 1 }]
makes = [{ store = "film", items_per_hour = 1 }]

[[standing]]
id = "thaw"
label_key = "action_thaw"
costs = [{ store = "thaw_left", items_per_hour = 1 }, { store = "rime", items_per_hour = 24 }]

# Never drawn: game hours since the turn, for the season's own steps (clear_clock's shape).
[[stores]]
id = "still_clock"
label_key = "store_still_clock"
cap_items = 8760
hidden = true

[[standing]]
id = "still_clock"
label_key = "action_still_clock"
makes = [{ store = "still_clock", items_per_hour = 1 }]

[[triggers]]
id = "t_still_clock"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "still", value = 1 }
outcome = { unlocks = [{ unlock_kind = "action", id = "still_clock" }] }

# The pack comes close in the fog: its strength steps up a quarter on the season's clock (the Clear's step's shape).
[[triggers]]
id = "t_still_step"
when = { test = "at_least", subject_kind = "store", id = "still_clock", value = 40 }
outcome = { modifiers = [{ target = "threat", id = "wolf_pack", kind = "add_bp", amount_bp = 2500, source = "t_still_step" }] }

