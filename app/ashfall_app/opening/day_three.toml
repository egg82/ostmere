# Day three: from B4 through story day 3's evening, the third night and story day 4 to B5, as data merged after
# day_two.toml (schema.Chapter, chapters.merge). Story spoilers: never shown to the owner. Spec: content/team/day-three.md;
# numbers: content/team/day-three-numbers.md. In schema.CHAPTERS: it ships. Its lines are checked written by
# tests/opening/test_day_two.py.
version = 1
end_feature = "warm_ground"

# ---------- the arrivals count ----------

# A tally only outcomes add to (tally_checks.py): the first arrival's feature seeds 1, so a save past B3 gets it at
# rebase; each join adds one. Nothing shows it.
[[stores]]
id = "arrivals"
label_key = "store_arrivals"
cap_items = 10
tally = true

[[triggers]]
id = "t_first_arrival"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "n1", value = 1 }
outcome = { stores = [{ store = "arrivals", items = 1 }] }

# ---------- A22, K1: walking the edge ----------

# On the cards with B4 (either answer's feature), so a save past B4 at the rebase has it one tap away.
[[triggers]]
id = "t_edge_open"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "cart_news", value = 1 }
outcome = { unlocks = [{ unlock_kind = "card", id = "walk_edge" }] }

# A22: its finish is K1, opens the track and the two comforts together (every sink in view at once, the first a full
# store's worth away), and starts the evening's clock.
[[cards]]
id = "walk_edge"
presentation = "narrative"
label_key = "c_walk_edge"
work_s = 5
cap = 1
glows = true
[cards.finished]
line_keys = ["l_edge_1", "l_edge_2"]
unlocks = [
  { unlock_kind = "feature", id = "track_open" },
  { unlock_kind = "card", id = "field_track" },
  { unlock_kind = "card", id = "track_end" },
  { unlock_kind = "card", id = "larder_floor" },
  { unlock_kind = "card", id = "wood_stack" },
  { unlock_kind = "card", id = "rack_roof" },
  { unlock_kind = "action", id = "evening_3" },
]

# ---------- the track ----------

# The trip: uncapped, run in the mix held against damp wood (the page's mix offer on the full line). Its three takes
# are the three stores that overflow, in about the ratio the camp makes them, so no one take binds the others; the bar
# is the 30 s floor and damp wood's take a full store (content/team/day-three.md, "Sinks after measuring"). It makes
# nothing per run: scrap comes only as finds on its run count. Each lump a whole rate (work_s divides one item's
# quantity units). Roots 15 a run, so with both foragers it still takes over half their roots (D-105).
[[cards]]
id = "field_track"
presentation = "action"
label_key = "c_field_track"
work_s = 30
skill = "scavenging"
xp_per_hour = 360
inputs = [{ store = "damp_wood", items = 18 }, { store = "stones", items = 4 }, { store = "roots", items = 15 }]

[[stores]]
id = "scrap"
label_key = "store_scrap"
cap_items = 12

# K2: the track's first run. Clay in view under the hearth's need, short of it, so the hearth shows unready.
[[triggers]]
id = "t_stream"
when = { test = "at_least", subject_kind = "card_count", id = "field_track", value = 1 }
[triggers.outcome]
line_keys = ["l_track_first", "l_stream"]
stores = [{ store = "clay", items = 4 }, { store = "hearth_dry", items = 1 }]
unlocks = [
  { unlock_kind = "store", id = "clay" },
  { unlock_kind = "card", id = "dig_clay" },
  { unlock_kind = "card", id = "clay_hearth" },
  { unlock_kind = "card", id = "cure_hearth" },
  { unlock_kind = "card", id = "stew" },
  { unlock_kind = "card", id = "pot_shelf" },
]

# K4: walking the track to its end, a step of its own at the Scavenging level the track trains toward (a level shown
# with the track, never a count of its runs: decisions.md, "No gate counts taps"; the level is the simulator's,
# day-three-numbers.md). The first scrap, so the scrap line shows here.
[[cards]]
id = "track_end"
presentation = "narrative"
label_key = "c_track_end"
work_s = 5
cap = 1
glows = true
requires = [{ test = "at_least", subject_kind = "skill_level", id = "scavenging", value = 16 }]
[cards.finished]
line_keys = ["l_field_1", "l_field_2"]
stores = [{ store = "scrap", items = 4 }]
unlocks = [{ unlock_kind = "store", id = "scrap" }, { unlock_kind = "feature", id = "dead_field" }]

# ---------- clay ----------

[[stores]]
id = "clay"
label_key = "store_clay"
cap_items = 12

[[cards]]
id = "dig_clay"
presentation = "action"
label_key = "c_dig_clay"
work_s = 10
skill = "foraging"
xp_per_hour = 300
outcome = { stores = [{ store = "clay", items = 1 }] }

[[order_cards]]
store = "clay"
tap_card = "dig_clay"
when = { test = "at_most", subject_kind = "store", id = "clay", value = 5, release = 11 }
offered_after = { unlock_kind = "store", id = "clay" }

# ---------- the comforts ----------

# Staged crafts on the hands, queued When ready; each stage up to a full store. Each names only its upside.
[[cards]]
id = "larder_floor"
presentation = "craft"
label_key = "c_larder_floor"
upside_key = "up_larder_floor"
work_s = 2400
cap = 3
inputs = [{ store = "stones", items = 18 }, { store = "damp_wood", items = 6 }]
line_keys = ["l_larder_1", "l_larder_2", "l_larder_3"]
[cards.finished]
line_keys = ["l_larder_done"]
modifiers = [{ target = "cap", id = "roots", kind = "mul_bp", amount_bp = 15000, source = "larder_floor" }]

[[cards]]
id = "rack_roof"
presentation = "craft"
label_key = "c_rack_roof"
upside_key = "up_rack_roof"
work_s = 2400
cap = 2
inputs = [{ store = "damp_wood", items = 18 }, { store = "dry_wood", items = 6 }]
line_keys = ["l_roof_1", "l_roof_2"]
[cards.finished]
line_keys = ["l_roof_done"]
modifiers = [{ target = "lane", id = "rack", kind = "mul_bp", amount_bp = 12500, source = "rack_roof" }]

# The two later comforts, in view from A22 and K2 (both moments present), each unready until the build it stands on is
# on its way, so its stages fall in the chapter's later visits: the stack once the larder's second stage is laid, the
# shelf once the hearth's second course is (its stages run beside the last cures). Each takes full stores and the
# hands' time against the builds beside it (the watch fire's last stage, the rack roof's). The gate is a token taken first (the
# hearth's idiom), not a requires, so the card's needs show it.
[[cards]]
id = "wood_stack"
presentation = "craft"
label_key = "c_wood_stack"
upside_key = "up_wood_stack"
work_s = 2400
cap = 3
inputs = [{ store = "stack_ready", items = 1 }, { store = "damp_wood", items = 18 }, { store = "stones", items = 6 }]
line_keys = ["l_stack_1", "l_stack_2", "l_stack_3"]
[cards.finished]
modifiers = [{ target = "cap", id = "dry_wood", kind = "mul_bp", amount_bp = 15000, source = "wood_stack" }]

[[cards]]
id = "pot_shelf"
presentation = "craft"
label_key = "c_pot_shelf"
upside_key = "up_pot_shelf"
work_s = 2400
cap = 3
inputs = [{ store = "shelf_ready", items = 1 }, { store = "stones", items = 12 }, { store = "damp_wood", items = 6 }]
line_keys = ["l_shelf_1", "l_shelf_2", "l_shelf_3"]
[cards.finished]
modifiers = [{ target = "cap", id = "stew", kind = "mul_bp", amount_bp = 15000, source = "pot_shelf" }]

# Never unlocked: a stage's worth of each later comfort, three apiece, set when the build it stands on is part laid.
[[stores]]
id = "stack_ready"
label_key = "store_stack_ready"
cap_items = 3

[[stores]]
id = "shelf_ready"
label_key = "store_shelf_ready"
cap_items = 3

[[triggers]]
id = "t_stack_ready"
when = { test = "at_least", subject_kind = "card_count", id = "larder_floor", value = 2 }
outcome = { stores = [{ store = "stack_ready", items = 3 }] }

[[triggers]]
id = "t_shelf_ready"
when = { test = "at_least", subject_kind = "card_count", id = "clay_hearth", value = 2 }
outcome = { stores = [{ store = "shelf_ready", items = 3 }] }

# The clay hearth: four courses, each laid on the hands and then cured on a lane of its own (the rack's shape), so the
# mix runs on meanwhile. Each course takes the dry token the last one's cure leaves (K2 leaves the first), so the next
# course waits, unready and queueable, until the last has cured. Laying one starts its cure with the wet token, so a
# cure by hand with no course laid is a failed tap. A course takes 2 dry wood, the floor the dry wood rule keeps: a
# larger take shows no ready time while the store falls (ready_at does not count the rule's refills), so When ready
# could not wait on the next course. 10 stones, so the first course can be queued the return the clay comes in (D-105).
[[cards]]
id = "clay_hearth"
presentation = "craft"
label_key = "c_clay_hearth"
upside_key = "up_clay_hearth"
work_s = 1800
cap = 4
inputs = [{ store = "hearth_dry", items = 1 }, { store = "clay", items = 6 }, { store = "stones", items = 10 }, { store = "dry_wood", items = 2 }]
outcome = { stores = [{ store = "hearth_wet", items = 1 }], starts = ["cure_hearth"] }
line_keys = ["l_hearth_1", "l_hearth_2", "l_hearth_3", "l_hearth_done"]
[cards.finished]
unlocks = [{ unlock_kind = "card", id = "bank_hearth" }]
modifiers = [{ target = "rate", id = "stew", flow = "make", store = "stew", kind = "add_bp", amount_bp = 5000, source = "clay_hearth" }]

[[lanes]]
id = "hearth"
label_key = "lane_hearth"

# One cure a course, four in all (the cap night 4 reads). The bar is the lever on B5's band (day-three-numbers.md,
# "Sizing the chain"): 38 000 s since the first course comes a visit earlier (D-105), which holds B5, B6 and B7 where
# they stood. A card's lump lands whole at any bar (engine DESIGN.txt, "Rate form").
[[cards]]
id = "cure_hearth"
lane = "hearth"
presentation = "action"
label_key = "c_cure_hearth"
work_s = 38000
cap = 4
inputs = [{ store = "hearth_wet", items = 1 }]
outcome = { stores = [{ store = "hearth_dry", items = 1 }] }

# Never unlocked: a course laid and not yet cured.
[[stores]]
id = "hearth_wet"
label_key = "store_hearth_wet"
cap_items = 1

# Never unlocked: the last course cured, ready for the next.
[[stores]]
id = "hearth_dry"
label_key = "store_hearth_dry"
cap_items = 1

# The first course readies the pot (shown at K2, unready until then).
[[triggers]]
id = "t_hearth_1"
when = { test = "at_least", subject_kind = "card_count", id = "clay_hearth", value = 1 }
outcome = { unlocks = [{ unlock_kind = "store", id = "stew" }] }

# The fourth course cured: the evening's clock for night 4.
[[triggers]]
id = "t_cured_4"
when = { test = "at_least", subject_kind = "card_count", id = "cure_hearth", value = 4 }
outcome = { unlocks = [{ unlock_kind = "action", id = "evening_4" }] }

# ---------- stew ----------

[[stores]]
id = "stew"
label_key = "store_stew"
cap_items = 12

[[cards]]
id = "stew"
presentation = "action"
label_key = "c_stew"
upside_key = "up_stew"
upside_of = "n2_eating"
work_s = 20
skill = "cooking"
xp_per_hour = 36
requires = [{ test = "at_least", subject_kind = "card_count", id = "clay_hearth", value = 1 }]
inputs = [{ store = "roots", items = 4 }, { store = "smoked", items = 1 }]
outcome = { stores = [{ store = "stew", items = 2 }] }

[[triggers]]
id = "t_stew_first"
when = { test = "at_least", subject_kind = "card_count", id = "stew", value = 1 }
outcome = { line_keys = ["l_stew_first"] }

# ---------- the evening, the third night, morning 4 ----------

# Never unlocked: the quarter hour after A22, in fifths, as day two's evening.
[[stores]]
id = "evening_3"
label_key = "store_evening_3"
cap_items = 5

[[standing]]
id = "evening_3"
label_key = "action_evening_3"
makes = [{ store = "evening_3", items_per_hour = 20 }]

# Never unlocked: the third night, about an hour in twentieths.
[[stores]]
id = "night_3"
label_key = "store_night_3"
cap_items = 20

[[standing]]
id = "night_3"
label_key = "action_night_3"
makes = [{ store = "night_3", items_per_hour = 20 }]

# Dusk: no feature of its own (the grade follows the night's clock), so the absence over it brings two unlocks.
[[triggers]]
id = "t_dusk_3"
when = { test = "at_least", subject_kind = "store", id = "evening_3", value = 5 }
outcome = { unlocks = [{ unlock_kind = "action", id = "night_3" }] }

# K3, three minutes into the night.
[[triggers]]
id = "t_night_3"
when = { test = "at_least", subject_kind = "store", id = "night_3", value = 1 }
outcome = { line_keys = ["l_night_3a", "l_night_3b"], unlocks = [{ unlock_kind = "feature", id = "night_3" }] }

# Morning 4, and SL1 with it: the watch fire opens on either lane, the same stores either way (a card is not shown
# before the beat it waits on). Her shift at it shows now, unready until it is lit.
[[triggers]]
id = "t_morning_4"
when = { test = "at_least", subject_kind = "store", id = "night_3", value = 20 }
[triggers.outcome]
line_keys = ["l_morning_4", "l_watch_1", "l_watch_2"]
unlocks = [
  { unlock_kind = "feature", id = "morning_4" },
  { unlock_kind = "card", id = "watch_fire" },
  { unlock_kind = "card", id = "n1_build_watch" },
  { unlock_kind = "card", id = "n1_watch" },
]

# ---------- night 4 ----------

[[stores]]
id = "evening_4"
label_key = "store_evening_4"
cap_items = 5

[[standing]]
id = "evening_4"
label_key = "action_evening_4"
makes = [{ store = "evening_4", items_per_hour = 20 }]

[[stores]]
id = "night_4"
label_key = "store_night_4"
cap_items = 20

[[standing]]
id = "night_4"
label_key = "action_night_4"
makes = [{ store = "night_4", items_per_hour = 20 }]

[[triggers]]
id = "t_dusk_4"
when = { test = "at_least", subject_kind = "store", id = "evening_4", value = 5 }
outcome = { unlocks = [{ unlock_kind = "action", id = "night_4" }] }

[[triggers]]
id = "t_night_4"
when = { test = "at_least", subject_kind = "store", id = "night_4", value = 1 }
outcome = { line_keys = ["l_night_4"], unlocks = [{ unlock_kind = "feature", id = "night_4" }] }

# A20, B5: bank the hearth in night 4, at B5's Foraging level (beats.yaml). Its finish lifts Camp 10.
[[cards]]
id = "bank_hearth"
presentation = "narrative"
label_key = "c_bank_hearth"
work_s = 5
cap = 1
glows = true
requires = [
  { test = "at_least", subject_kind = "store", id = "night_4", value = 1 },
  { test = "at_least", subject_kind = "skill_level", id = "foraging", value = 5 },
]
[cards.finished]
line_keys = ["l_b5_1", "l_b5_2", "l_b5_3"]
unlocks = [{ unlock_kind = "feature", id = "warm_ground" }]

# ---------- SL1, SL3: the watch fire ----------

# Either lane's stage counts toward the other's: both add to watch_done, and the second stage retires both cards.
[[cards]]
id = "watch_fire"
presentation = "craft"
label_key = "c_watch_fire"
work_s = 3600
cap = 2
inputs = [{ store = "stones", items = 12 }, { store = "dry_wood", items = 6 }]
outcome = { stores = [{ store = "watch_done", items = 1 }] }

# Hers: four times the hands' bar, at her lane's speed (each lump a whole rate at 1.0 and 1.2).
[[cards]]
id = "n1_build_watch"
lane = "n1"
presentation = "craft"
label_key = "c_n1_build_watch"
work_s = 14400
cap = 2
inputs = [{ store = "stones", items = 12 }, { store = "dry_wood", items = 6 }]
outcome = { stores = [{ store = "watch_done", items = 1 }] }

# Never unlocked: the watch fire's stages, from either lane.
[[stores]]
id = "watch_done"
label_key = "store_watch_done"
cap_items = 2

[[triggers]]
id = "t_watch_lit"
when = { test = "at_least", subject_kind = "store", id = "watch_done", value = 2 }
[triggers.outcome]
line_keys = ["l_watch_lit"]
unlocks = [
  { unlock_kind = "retired", id = "watch_fire" },
  { unlock_kind = "retired", id = "n1_build_watch" },
]

# Her share at the watch fire against her gathering.
[[cards]]
id = "n1_watch"
lane = "n1"
presentation = "action"
label_key = "c_n1_watch"
work_s = 600
requires = [{ test = "at_least", subject_kind = "store", id = "watch_done", value = 2 }]
inputs = [{ store = "dry_wood", items = 1 }]

# ---------- O-stay, the bay and K5 ----------

# O-stay's moment: the first pot of stew (a step of its own, not a count of them). Its own feature, so the aim can
# start at it.
[[triggers]]
id = "t_stay_offer"
when = { test = "at_least", subject_kind = "card_count", id = "stew", value = 1 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "stay_offer" }] }

[[offers]]
id = "o_stay"
text_key = "o_stay"
gate = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "stay_offer", value = 1 }
line_keys = ["l_stay_1", "l_stay_2"]
kind = "arrival"

[[offers.answers]]
id = "o_stay_room"
label_key = "a_make_room"
cost_key = "a_make_room_cost"
role = "self"
[offers.answers.outcome]
line_keys = ["l_bay_go"]
unlocks = [{ unlock_kind = "card", id = "make_bay" }]
queues = ["make_bay"]

[[offers.answers]]
id = "o_stay_his"
label_key = "a_let_him"
cost_key = "a_let_him_cost"
role = "other"
[offers.answers.outcome]
line_keys = ["l_bay_his"]
unlocks = [{ unlock_kind = "card", id = "n2_build_bay" }]
orders = [{ tap_card = "n2_build_bay", first = true }]

# A23 on the hands. Its work divides one item's quantity units at speeds 1 and a half (a tap keeps its start speed).
[[cards]]
id = "make_bay"
presentation = "craft"
label_key = "c_make_bay"
work_s = 18000
cap = 1
inputs = [{ store = "damp_wood", items = 12 }, { store = "stones", items = 12 }]
outcome = { stores = [{ store = "bay", items = 1 }] }

# A line when the hands start the bay: the build is a long wait the player chose, and a return during it needs something
# new to see (docs/decisions.md, "Tuned means checked").
[[triggers]]
id = "t_bay_begun"
when = { test = "at_least", subject_kind = "running", id = "make_bay", value = 1 }
outcome = { line_keys = ["l_bay_help"] }

# News part-way through the bay, 2 h after either builder starts it: the build runs five hours, so a return a few hours
# into it has something new (D-105).
[[triggers]]
id = "t_bay_clock"
when = { test = "at_least", subject_kind = "running", id = "make_bay", value = 1 }
outcome = { unlocks = [{ unlock_kind = "action", id = "bay_clock" }] }

[[triggers]]
id = "t_bay_clock_his"
when = { test = "at_least", subject_kind = "running", id = "n2_build_bay", value = 1 }
outcome = { unlocks = [{ unlock_kind = "action", id = "bay_clock" }] }

# Never unlocked: the bay's clock, in twentieths of an hour, as the walk's.
[[stores]]
id = "bay_clock"
label_key = "store_bay_clock"
cap_items = 40

[[standing]]
id = "bay_clock"
label_key = "action_bay_clock"
makes = [{ store = "bay_clock", items_per_hour = 20 }]

[[triggers]]
id = "t_bay_mid"
when = { test = "at_least", subject_kind = "store", id = "bay_clock", value = 40 }
outcome = { line_keys = ["l_bay_mid"] }

# His lane: a townsperson the player's rules set, as hers.
[[lanes]]
id = "n2"
label_key = "lane_n2"
ruled = true
later_labels = [{ after = { unlock_kind = "feature", id = "n2_joined" }, label_key = "lane_n2_named" }]
name_key = "name_n2"

# A24 on his lane, the same real time and stores as A23.
[[cards]]
id = "n2_build_bay"
lane = "n2"
presentation = "craft"
label_key = "c_n2_build_bay"
work_s = 18000
cap = 1
inputs = [{ store = "damp_wood", items = 12 }, { store = "stones", items = 12 }]
outcome = { stores = [{ store = "bay", items = 1 }] }

# Never unlocked: the bay built, by either lane.
[[stores]]
id = "bay"
label_key = "store_bay"
cap_items = 1

# A townsperson's cards, as the first one's (day two): the hands cards' takes and makes at base rate, no skill and no
# XP. Defined once; a lane joins by appending to `lanes`, and expands where its lane is declared (town.py).
[[town_cards]]
id = "{lane}_forage"
lanes = ["n2", "n3", "n5", "n6", "n7"]
presentation = "action"
label_key = "c_forage"
work_s = 120
outcome = { stores = [{ store = "roots", items = 24 }] }

[[town_cards]]
id = "{lane}_gather"
lanes = ["n2", "n3", "n5", "n6", "n7"]
presentation = "action"
label_key = "c_gather_wood"
work_s = 30
outcome = { stores = [{ store = "damp_wood", items = 6 }] }

[[town_cards]]
id = "{lane}_cut"
lanes = ["n2", "n5", "n6", "n7"]
presentation = "action"
label_key = "c_woodcutting"
work_s = 12
outcome = { stores = [{ store = "damp_wood", items = 6 }] }

[[town_cards]]
id = "{lane}_scavenge"
lanes = ["n2"]
presentation = "action"
label_key = "c_scavenge"
work_s = 48
outcome = { stores = [{ store = "stones", items = 8 }] }

# K5: the bay done, either answer. He joins the town's mix foraging at his whole share (the pot feeds three; cutting
# would pour his whole time into a full damp wood line the track cannot drink, day-three.md, "Sinks after measuring").
# Arrivals 2; she joins on her own trigger below.
[[triggers]]
id = "t_joins"
when = { test = "at_least", subject_kind = "store", id = "bay", value = 1 }
[triggers.outcome]
line_keys = ["l_join_1", "l_join_2", "l_his_first"]
stores = [{ store = "arrivals", items = 1 }]
unlocks = [
  { unlock_kind = "feature", id = "n2_joined" },
  { unlock_kind = "card", id = "n2_forage" },
  { unlock_kind = "card", id = "n2_gather" },
  { unlock_kind = "card", id = "n2_cut" },
  { unlock_kind = "card", id = "n2_scavenge" },
  { unlock_kind = "action", id = "n2_eating" },
  { unlock_kind = "action", id = "n2_hour" },
]
joins = [{ lane = "n2", mix = "town:camp", card = "n2_forage" }]

# She joins the town's mix with him (decisions.md, "The mix": her single task was a leftover). Her always task becomes
# her share at her whole time, so nothing she does changes at the join; with no always task she joins with no share.
# Her own trigger, as t_joins' outcome is released; after it, so a save past K5 gets the same mix order at rebase. She
# was counted at B3 (t_first_arrival), so the arrivals count does not move.
[[triggers]]
