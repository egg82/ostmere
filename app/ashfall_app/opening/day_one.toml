l_wc_faster = "you stop fighting the grain. the wood comes quicker."
l_scav_faster = "you've learned which heaps are worth turning over."
l_for_faster = "you can tell the good roots by their leaves now."
l_cook_faster = "you learn how the rack draws. the smoke takes quicker."
