[text]
aim_night = "see the night out."
n_day_b3 = "someone else is alive. she came in out of the grey and sat down like it was her fire"
aim_food = "find food that isn't roots."
aim_hold = "make the camp last, whoever's out there."
aim_worth = "be worth coming back to."
aim_two = "lay in enough for both of you."
