# Day one: from the opening's end (story dusk) through the night and the next day to the first arrival, as data merged
# onto opening.toml (schema.Chapter, chapters.merge). Story spoilers: never shown to the owner. Spec: content/team/day-one.md.
# Every number is provisional until the pacing simulator (tests/dayone) has tuned it; every line is the lead's pick
# from the writers' drafts (content/team/drafts/selection.md) until the voice pass reads them in player order.
version = 1
end_feature = "n1"

# Levels 6 and 7 for every skill (Scavenging's wire for the third snare); levels 8 on are the taper's (below).
curve_items = [60, 100, 160, 250, 385, 590, 900, 1370, 2080, 3150, 4760, 7180, 10800, 16250, 24400]

# The opening's "?" rows pay their finds now; the rest of each row, to the curve's top, is the taper's (below): each
# level its skill's work a tenth faster. Among the levels day one reaches, at least every third also pays a thing (a
# find: "the named pays", below), so no row pays speed alone three levels running
# (tests/dayone/test_dayone_level_pays.py).
[[skill_levels]]
skill = "scavenging"
levels = [{ level = 4, pays_key = "pays_find" }, { level = 5, pays_key = "pays_find" }, { level = 6, pays_key = "pays_find" }, { level = 7, pays_key = "pays_scav_faster" }, { level = 8, pays_key = "pays_scav_faster" }, { level = 9, pays_key = "pays_roof_beam" }, { level = 10, pays_key = "pays_scav_faster" }, { level = 11, pays_key = "pays_lintel" }, { level = 12, pays_key = "pays_doorway" }, { level = 13, pays_key = "pays_scav_faster" }, { level = 14, pays_key = "pays_cut_stones" }, { level = 15, pays_key = "pays_chimney" }, { level = 16, pays_key = "pays_scav_faster" }, { level = 17, pays_key = "pays_scav_faster" }, { level = 18, pays_key = "pays_scav_faster" }, { level = 19, pays_key = "pays_scav_faster" }, { level = 20, pays_key = "pays_scav_faster" }]

[[skill_levels]]
skill = "woodcutting"
levels = [{ level = 3, pays_key = "pays_builds" }, { level = 4, pays_key = "pays_wc_faster" }, { level = 5, pays_key = "pays_wc_faster" }, { level = 6, pays_key = "pays_deadfall" }, { level = 7, pays_key = "pays_wc_faster" }, { level = 8, pays_key = "pays_wc_faster" }, { level = 9, pays_key = "pays_tipped_birch" }, { level = 10, pays_key = "pays_wc_faster" }, { level = 11, pays_key = "pays_wc_faster" }, { level = 12, pays_key = "pays_green_birch" }, { level = 13, pays_key = "pays_hung_birch" }, { level = 14, pays_key = "pays_wc_faster" }, { level = 15, pays_key = "pays_clear_view" }, { level = 16, pays_key = "pays_wc_faster" }, { level = 17, pays_key = "pays_split_birch" }, { level = 18, pays_key = "pays_thick_birch" }, { level = 19, pays_key = "pays_wc_faster" }, { level = 20, pays_key = "pays_wc_faster" }]

[[skill_levels]]
skill = "foraging"
levels = [{ level = 2, pays_key = "pays_find" }, { level = 3, pays_key = "pays_for_faster" }, { level = 4, pays_key = "pays_for_faster" }, { level = 5, pays_key = "pays_root_hollow" }, { level = 6, pays_key = "pays_furrow" }, { level = 7, pays_key = "pays_for_faster" }, { level = 8, pays_key = "pays_for_faster" }, { level = 9, pays_key = "pays_for_faster" }, { level = 10, pays_key = "pays_for_faster" }, { level = 11, pays_key = "pays_for_faster" }, { level = 12, pays_key = "pays_for_faster" }, { level = 13, pays_key = "pays_for_faster" }, { level = 14, pays_key = "pays_for_faster" }, { level = 15, pays_key = "pays_for_faster" }, { level = 16, pays_key = "pays_for_faster" }, { level = 17, pays_key = "pays_for_faster" }, { level = 18, pays_key = "pays_for_faster" }, { level = 19, pays_key = "pays_for_faster" }, { level = 20, pays_key = "pays_for_faster" }]

# ---------- the Camp ----------

# Fills the opening's held marker: the wall takes 7 instead of 5.
[[camp_levels]]
at_items = 1500
pays_key = "camp_pays_1"
pays_from = 5
pays_to = 7
line_keys = ["l_camp_3"]
modifiers = [
  { target = "rate", id = "lay_to_dry", flow = "cost", store = "damp_wood", kind = "mul_bp", amount_bp = 14000, source = "camp_3" },
  { target = "rate", id = "lay_to_dry", flow = "make", store = "dry_wood", kind = "mul_bp", amount_bp = 14000, source = "camp_3" },
]

[[camp_levels]]
at_items = 10800
pays_key = "camp_pays_4"
pays_from = 6
pays_to = 9
line_keys = ["l_camp_4"]
modifiers = [{ target = "cap", id = "catch", kind = "mul_bp", amount_bp = 15000, source = "camp_4" }]

[[camp_levels]]
at_items = 28800
pays_key = "camp_pays_5"
pays_from = 2
pays_to = 3
line_keys = ["l_camp_5"]
modifiers = [
  { target = "rate", id = "smoke_catch", flow = "make", store = "smoked", kind = "add_bp", amount_bp = 5000, source = "camp_5" },
  { target = "rate", id = "smoke_roots", flow = "make", store = "smoked", kind = "add_bp", amount_bp = 5000, source = "camp_5" },
]

# Held at a "?" until B3 lifts it (take_stock's finish raises the camp cap): room for two.
[[camp_levels]]
at_items = 54000
pays_key = "pays_unknown"
held = true
lifted_by = ["take_stock"]
line_keys = ["l_camp_6"]
modifiers = [
  { target = "cap", id = "roots", kind = "mul_bp", amount_bp = 15000, source = "camp_6" },
  { target = "cap", id = "smoked", kind = "mul_bp", amount_bp = 15000, source = "camp_6" },
]

# ---------- stores ----------

# Holds all three finds: Scavenging 4-6 land in the night, before the first snare can take one.
[[stores]]
id = "wire"
label_key = "store_wire"
cap_items = 3

[[stores]]
id = "tinder_fungus"
label_key = "store_tinder_fungus"
cap_items = 1

[[stores]]
id = "catch"
label_key = "store_catch"
cap_items = 6

# Never unlocked: the larder and the rack, each counted once built; both make the roots rule's offer.
[[stores]]
id = "stock_ready"
label_key = "store_stock_ready"
cap_items = 2

[[stores]]
id = "smoked"
label_key = "store_smoked"
cap_items = 4

# Never unlocked: the night going, filled by the night action from the end. Morning waits for it.
[[stores]]
id = "night"
label_key = "store_night"
cap_items = 20

# Never unlocked: what the visitor will take, drawn down with the roots it takes, so H7 lands only once three roots
# are gone (always whole: a dry larder pauses the visitor, not the beat's truth).
[[stores]]
id = "h7_clock"
label_key = "store_h7_clock"
cap_items = 3
initial_items = 3

# ---------- skills ----------

# The row opens with the smoking rack.
[[skills]]
id = "cooking"
label_key = "skill_cooking"
levels = [{ level = 2, pays_key = "pays_smoke_batch" }, { level = 3, pays_key = "pays_cook_faster" }, { level = 4, pays_key = "pays_cook_faster" }, { level = 5, pays_key = "pays_cook_faster" }, { level = 6, pays_key = "pays_cook_faster" }]

# ---------- standing actions ----------

# From the end to morning: about an hour, in twentieths (H1's lines at the first, three minutes in, so they come after
# the dusk lines rather than on them).
[[standing]]
id = "night"
label_key = "action_night"
makes = [{ store = "night", items_per_hour = 20 }]

[[standing]]
id = "snare_1"
label_key = "action_snare"
makes = [{ store = "catch", items_per_hour = 1 }]

[[standing]]
id = "snare_2"
label_key = "action_snare"
makes = [{ store = "catch", items_per_hour = 1 }]

[[standing]]
id = "snare_3"
label_key = "action_snare"
makes = [{ store = "catch", items_per_hour = 1 }]

# From the first smoke: three roots over about ninety minutes, then never again (h7_clock empty pauses it for good).
[[standing]]
id = "visitor"
label_key = "action_visitor"
costs = [{ store = "roots", items_per_hour = 2 }, { store = "h7_clock", items_per_hour = 2 }]

# From B3: two eat.
[[standing]]
id = "n1_eating"
label_key = "action_n1_eating"
costs = [{ store = "smoked", items_per_hour = 1 }, { store = "roots", items_per_hour = 1 }]

# ---------- lanes ----------

[[lanes]]
id = "smoke"
label_key = "lane_smoke"

# ---------- cards ----------

# A11: on offer through the night, retired at morning if untapped.
[[cards]]
id = "sit_up"
presentation = "narrative"
label_key = "c_sit_up"
work_s = 20
cap = 1
line_keys = ["l_sit_up"]

# A12: H3.
[[cards]]
id = "look_out"
presentation = "narrative"
label_key = "c_look_out"
work_s = 5
cap = 1
requires = [{ test = "at_least", subject_kind = "store", id = "night", value = 20 }]
line_keys = ["l_look_out_1"]
finished = { line_keys = ["l_look_out_2"], unlocks = [{ unlock_kind = "card", id = "set_snare" }] }

# A13 and the two later snares: a wire each (Scavenging 4, 5, 6). The first is H4.
[[cards]]
id = "set_snare"
presentation = "narrative"
label_key = "c_set_snare"
work_s = 8
cap = 3
inputs = [{ store = "wire", items = 1 }]
line_keys = ["l_snare_1", "l_snare_2", "l_snare_3"]

# A14, H5: the camp by daylight, after the first snare; it brings the two builds and the rack into view.
[[cards]]
id = "look_over_camp"
presentation = "narrative"
label_key = "c_look_over_camp"
work_s = 5
cap = 1
line_keys = ["l_camp_daylight"]
finished = { unlocks = [{ unlock_kind = "card", id = "build_lean_to" }, { unlock_kind = "card", id = "build_larder" }, { unlock_kind = "card", id = "build_smoke_rack" }] }

# P0.1 and P0.2: each names only its upside; the order is the choice. They pull on different stores (the lean-to on dry
# wood, more than the wall's rule keeps, the larder on stones), so the need is a mix switch. Each finished one counts
# toward stock_ready, the roots rule's offer.
[[cards]]
id = "build_lean_to"
presentation = "craft"
label_key = "c_build_lean_to"
upside_key = "up_lean_to"
work_s = 20
cap = 1
inputs = [{ store = "dry_wood", items = 10 }, { store = "stones", items = 2 }]
requires = [{ test = "at_least", subject_kind = "skill_level", id = "woodcutting", value = 3 }]
line_keys = ["l_lean_to"]
[cards.finished]
unlocks = [{ unlock_kind = "feature", id = "lean_to" }]
modifiers = [
  { target = "rate", id = "weariness", flow = "cost", store = "energy", kind = "mul_bp", amount_bp = 7500, source = "lean_to" },
]

[[cards]]
id = "build_larder"
presentation = "craft"
label_key = "c_build_larder"
upside_key = "up_larder"
work_s = 20
cap = 1
inputs = [{ store = "dry_wood", items = 4 }, { store = "stones", items = 12 }]
requires = [{ test = "at_least", subject_kind = "skill_level", id = "woodcutting", value = 3 }]
line_keys = ["l_larder"]
[cards.finished]
stores = [{ store = "stock_ready", items = 1 }]
unlocks = [{ unlock_kind = "feature", id = "larder" }]
modifiers = [
  { target = "cap", id = "roots", kind = "mul_bp", amount_bp = 20000, source = "larder" },
  { target = "cap", id = "smoked", kind = "mul_bp", amount_bp = 30000, source = "larder" },
]

# P0.3: opened by A14, beside the builds, so the player builds it while there and its rule smokes the catch while
# they are away: the smoke, H6 and what follows come as soon as the player's setup makes them, not at the next return.
# Green poles, so damp wood (dry wood is for burning). It is shown while the player is there, and its A14 requires a
# tap, so it never turns ready unseen (the 2 AM test). The Smoke lane with smoke_catch, Cooking, and the rising-line
# rule's card.
[[cards]]
id = "build_smoke_rack"
presentation = "craft"
label_key = "c_build_smoke_rack"
work_s = 30
cap = 1
inputs = [{ store = "damp_wood", items = 10 }, { store = "tinder_fungus", items = 1 }]
requires = [{ test = "at_least", subject_kind = "card_count", id = "look_over_camp", value = 1 }]
line_keys = ["l_rack"]
[cards.finished]
line_keys = ["l_cooking_open"]
stores = [{ store = "stock_ready", items = 1 }]
unlocks = [
  { unlock_kind = "feature", id = "smoke_rack" },
  { unlock_kind = "card", id = "smoke_catch" },
  { unlock_kind = "store", id = "smoked" },
  { unlock_kind = "skill", id = "cooking" },
]

[[cards]]
id = "smoke_catch"
lane = "smoke"
presentation = "action"
label_key = "c_smoke_catch"
work_s = 80
skill = "cooking"
xp_per_hour = 18
inputs = [{ store = "catch", items = 4 }, { store = "damp_wood", items = 2 }]
outcome = { stores = [{ store = "smoked", items = 2 }] }

# Opened by the first smoke (t_smoke_roots): the what-to-smoke tradeoff (roots count toward Take stock too). Three
# roots, the shipped roots rule's floor (under 3, until 6), so with that rule set a return while the visitor is taking
# roots can always smoke some.
[[cards]]
id = "smoke_roots"
lane = "smoke"
presentation = "action"
label_key = "c_smoke_roots"
work_s = 80
skill = "cooking"
xp_per_hour = 18
inputs = [{ store = "roots", items = 3 }, { store = "damp_wood", items = 2 }]
outcome = { stores = [{ store = "smoked", items = 2 }] }

# The opening's roast, as often as hunger comes back: roots over the fire for fullness. Its label is the roast's, so the
# step the player took once is the one they take again. Opened by t_cook.
[[cards]]
id = "cook_roots"
presentation = "action"
label_key = "c_roast_roots"
work_s = 4
inputs = [{ store = "roots", items = 3 }]
requires = [{ test = "at_least", subject_kind = "card_count", id = "strike_fire", value = 1 }]
outcome = { stores = [{ store = "fullness", items = 7 }] }

# P0.4: spends nothing; its requires hold the day's conjunction. B3. Opened by t_stock_shown, so it is not shown before
# the prints beat has happened. The store levels come first, so the card reads "smoked 0/6" (its first unmet requires
# is its blocker) and When ready has a time to wait for.
[[cards]]
id = "take_stock"
presentation = "narrative"
label_key = "c_take_stock"
work_s = 10
cap = 1
requires = [
  { test = "at_least", subject_kind = "store", id = "smoked", value = 6 },
  { test = "at_least", subject_kind = "store", id = "roots", value = 15 },
  { test = "at_least", subject_kind = "card_count", id = "build_larder", value = 1 },
  { test = "at_least", subject_kind = "card_count", id = "build_smoke_rack", value = 1 },
]
line_keys = ["l_b3_1"]
[cards.finished]
line_keys = ["l_b3_2", "l_b3_3", "l_b3_4"]
unlocks = [{ unlock_kind = "feature", id = "n1" }, { unlock_kind = "action", id = "n1_eating" }]

# ---------- triggers ----------

# The night, from the end (t_evening, which unlocks keeps_going, is released and stays as it is).
[[triggers]]
id = "t_night"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "keeps_going", value = 1 }
[triggers.outcome]
unlocks = [
  { unlock_kind = "action", id = "night" },
  { unlock_kind = "store", id = "wire" },
  { unlock_kind = "store", id = "tinder_fungus" },
]

# H1: a little way into the night.
[[triggers]]
id = "t_h1"
when = { test = "at_least", subject_kind = "store", id = "night", value = 1 }
outcome = { line_keys = ["l_night_1", "l_night_2"], unlocks = [{ unlock_kind = "card", id = "sit_up" }] }

# Nightfall for the scene: its night grade from the first of the night until morning (decisions.md, "Day and night run on
# the story's clock"). The same moment as H1, but its own trigger, so H1's outcome stays as released.
[[triggers]]
id = "t_nightfall"
when = { test = "at_least", subject_kind = "store", id = "night", value = 1 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "night" }] }

# H2: morning.
[[triggers]]
id = "t_morning"
when = { test = "at_least", subject_kind = "store", id = "night", value = 20 }
[triggers.outcome]
line_keys = ["l_morning"]
unlocks = [
  { unlock_kind = "feature", id = "morning" },
  { unlock_kind = "card", id = "look_out" },
  { unlock_kind = "retired", id = "sit_up" },
]

# Finds behind the opening's "?" markers, and after them.
[[triggers]]
id = "t_wire_1"
when = { test = "at_least", subject_kind = "skill_level", id = "scavenging", value = 4 }
outcome = { stores = [{ store = "wire", items = 1 }], line_keys = ["l_wire_1"] }

[[triggers]]
id = "t_wire_2"
when = { test = "at_least", subject_kind = "skill_level", id = "scavenging", value = 5 }
outcome = { stores = [{ store = "wire", items = 1 }], line_keys = ["l_wire_2"] }

[[triggers]]
id = "t_wire_3"
when = { test = "at_least", subject_kind = "skill_level", id = "scavenging", value = 6 }
outcome = { stores = [{ store = "wire", items = 1 }], line_keys = ["l_wire_3"] }

[[triggers]]
id = "t_tinder"
when = { test = "at_least", subject_kind = "skill_level", id = "foraging", value = 2 }
outcome = { stores = [{ store = "tinder_fungus", items = 1 }], line_keys = ["l_tinder"] }

# Each snare set runs its own line of catch.
[[triggers]]
id = "t_snare_1"
when = { test = "at_least", subject_kind = "card_count", id = "set_snare", value = 1 }
outcome = { unlocks = [{ unlock_kind = "action", id = "snare_1" }, { unlock_kind = "store", id = "catch" }] }

[[triggers]]
id = "t_snare_2"
when = { test = "at_least", subject_kind = "card_count", id = "set_snare", value = 2 }
outcome = { unlocks = [{ unlock_kind = "action", id = "snare_2" }] }

[[triggers]]
id = "t_snare_3"
when = { test = "at_least", subject_kind = "card_count", id = "set_snare", value = 3 }
outcome = { unlocks = [{ unlock_kind = "action", id = "snare_3" }] }

# The first catch's line (the builds are A14's).
[[triggers]]
id = "t_first_catch"
when = { test = "at_least", subject_kind = "store", id = "catch", value = 1 }
outcome = { line_keys = ["l_first_catch"] }

# A14 after the first snare.
[[triggers]]
id = "t_look_over"
when = { test = "at_least", subject_kind = "card_count", id = "set_snare", value = 1 }
outcome = { unlocks = [{ unlock_kind = "card", id = "look_over_camp" }] }

# P0.3 at the first catch, for a player who set a snare and left before A14 (the card waits on A14 by its
# requires); a no-op once A14 has opened it.
[[triggers]]
id = "t_rack"
when = { test = "at_least", subject_kind = "store", id = "catch", value = 1 }
outcome = { unlocks = [{ unlock_kind = "card", id = "build_smoke_rack" }] }

# The larder built: the roots rule "until 15" is offered.
[[triggers]]
id = "t_stock_ready"
when = { test = "at_least", subject_kind = "store", id = "stock_ready", value = 2 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "roots_to_stock" }] }

[[triggers]]
id = "t_rack_shown"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "card", id = "build_smoke_rack", value = 1 }
outcome = { line_keys = ["l_rack_shown"] }

# H6: the first smoke; the visitor comes to look.
[[triggers]]
id = "t_first_smoke"
when = { test = "at_least", subject_kind = "card_count", id = "smoke_catch", value = 1 }
outcome = { line_keys = ["l_smoke_1"], unlocks = [{ unlock_kind = "action", id = "visitor" }] }

# The what-to-smoke choice once meat has hung in the smoke: roots can too. H6's condition, so one moment with it.
[[triggers]]
id = "t_smoke_roots"
when = { test = "at_least", subject_kind = "card_count", id = "smoke_catch", value = 1 }
outcome = { line_keys = ["l_smoke_roots"], unlocks = [{ unlock_kind = "card", id = "smoke_roots" }] }

# H7: three roots gone, a strip left.
[[triggers]]
id = "t_prints"
when = { test = "at_most", subject_kind = "store", id = "h7_clock", value = 0 }
[triggers.outcome]
stores = [{ store = "smoked", items = 1 }]
line_keys = ["l_prints_1", "l_prints_2"]
unlocks = [{ unlock_kind = "feature", id = "prints" }]

# P0.4 with the prints: Take stock waits on that beat, so it is not shown before it. H7's condition, so the two are one
# moment, also to an absence's count.
[[triggers]]
id = "t_stock_shown"
when = { test = "at_most", subject_kind = "store", id = "h7_clock", value = 0 }
outcome = { unlocks = [{ unlock_kind = "card", id = "take_stock" }] }

[[triggers]]
id = "t_cooking_2"
when = { test = "at_least", subject_kind = "skill_level", id = "cooking", value = 2 }
[triggers.outcome]
line_keys = ["l_cooking_2"]
modifiers = [
  { target = "rate", id = "smoke_catch", flow = "make", store = "smoked", kind = "add_bp", amount_bp = 5000, source = "cooking_2" },
]

# Cooking opens as the roast is done: cook_roots carries the roast's label, so the card the player tapped once reads as
# staying on the panel, there before hunger comes back and its rule offered with the chip. The opening's eating keeps
# drawing roots: its drain is what the roots rule forages against while the player is away, and that Foraging is what
# finds the tinder the rack needs.
[[triggers]]
id = "t_cook"
when = { test = "at_least", subject_kind = "card_count", id = "roast_roots", value = 1 }
outcome = { unlocks = [{ unlock_kind = "card", id = "cook_roots" }] }

# ---------- the taper: something to build toward after the end ----------

# First light on the clock: the morning's first step is on the cards from H1's moment, unready until morning,
# its countdown the time-driven next beside the levels (never instead of them). The page draws a need on a store the
# player has never been shown as its countdown alone, with no When ready (docs/design/opening-screen.md, "When ready"):
# queued, the step would open the snares unseen (the 2 AM test). t_morning's own unlock of the card is then a no-op.
[[triggers]]
id = "t_first_light_shown"
when = { test = "at_least", subject_kind = "store", id = "night", value = 1 }
outcome = { unlocks = [{ unlock_kind = "card", id = "look_out" }] }

# Every level past a row's finds pays its own skill's work a tenth faster (engine WorkRef: more made an hour, the same
# XP), to the curve's top for the skills a hands card trains, so the mix always has a next level it drives and the
# order the rows arrive in is the player's weighting (docs/decisions.md); Cooking, trained on the smoke lane, to 6,
# then "no more yet". A level's step grows by half again each level (curve_items) while its pay is a tenth: time
# per level never shrinks (tests/dayone/growth.py). Numbers provisional (tests/dayone, "goals").

[[triggers]]
id = "t_wc_4"
when = { test = "at_least", subject_kind = "skill_level", id = "woodcutting", value = 4 }
outcome = { line_keys = ["l_wc_faster"], modifiers = [{ target = "work", id = "woodcutting", kind = "mul_bp", amount_bp = 11000, source = "wc_4" }] }

[[triggers]]
