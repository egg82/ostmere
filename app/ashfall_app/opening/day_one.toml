l_night_1 = "no sound from the ridge. the light stays low."
l_night_2 = "one howl, a long way off. the air is so still you hear it end."
l_sit_up = "the light holds still. you keep yours low."
l_morning = "morning. the ridge light is out. your fire lasted the night."
l_look_out_1 = "fog fills the bowl, steam rising through it. old fields, still in rows."
l_look_out_2 = "where the light was, something dark and square."
l_wire_1 = "wire from the ruins. it rings when you flick it."
l_wire_2 = "a second wire. you work the kinks out."
l_wire_3 = "more wire, stiff with rust at one end."
l_tinder = "bracket fungus on dead birch, dry inside."
l_snare_1 = "the run you chose has a snare in it, rusted to flakes."
l_snare_2 = "you set the second a stride from the first, along the same run."
l_snare_3 = "the third goes in fast. you have the knot now."
l_first_catch = "an ashrat in a snare, gone quiet."
l_camp_daylight = "ash on all you left out, you too. the roots are soft."
l_lean_to = "birch poles, leaned. the open side faces the ridge."
l_larder = "a larder of piled stone, a hand's width off the ground."
l_rack_shown = "meat goes off fast on warm ground. hung in smoke, it lasts."
l_rack = "a birch rack over a smouldering knot of fungus."
l_cooking_open = "cooking, the slow way: smoke and a long wait."
l_smoke_1 = "no wind. the smoke stands straight up. you could steer by it."
l_cooking_2 = "you get the knack of packing the rack. more fits."
l_prints_1 = "one set of prints, from the gap to the larder."
l_prints_2 = "three roots gone. smoked meat left, not yours."
l_smoke_roots = "roots will smoke too. they come out like leather."
l_b3_1 = "you count the food twice. the count holds. you look up."
l_b3_2 = "a figure comes out of the ash at the gap. alone."
l_b3_3 = "she looks over the larder, then sits on your side of the fire."
l_b3_4 = "she eats. you do sums for two."
l_camp_3 = "seven fit on the wall. you know which seven."
l_camp_4 = "a better way to hang the catch."
l_camp_5 = "you cut the strips thinner. the same catch goes further."
l_camp_6 = "more room, by half. you'll need it."
store_wattle = "wattle"
c_weave_wattle = "Weave wattle"
c_screen_fire = "Build a screen round the fire"
up_screen_fire = "{pct} warmth lost to the cold"
l_screen_1 = "a wattle hurdle staked beside the fire. the heat stops at it."
l_screen_2 = "a second hurdle, angled to the first. you sit in the corner they make."
l_screen_3 = "a third hurdle. the firelight stays inside the screen now."
l_screen_4 = "the screen rings the fire. the cold has to come over the top."
