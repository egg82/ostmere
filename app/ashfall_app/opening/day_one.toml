l_deadfall = "you cut into a birch long down. it's dry to the heart."
l_tipped_birch = "a birch has tipped over. stones came up in its roots."
l_green_birch = "you drop a green birch in one piece. it takes two trips."
l_clear_view = "the near scrub is cut back. from the fire you can see the gap."
l_thick_birch = "you fell a birch thicker than you are. the ground jumps when it lands."
l_roof_beam = "you drag a roof beam from the rubble. under the rot, it's sound."
l_doorway = "a doorframe stands on its own, no walls to it. you take the step."
l_chimney = "a fallen chimney, its stones still squared, soot on one face."
l_split_birch = "an old birch stands split down its length. half the work is done."
l_cut_stones = "you clear the ash off a kerb of cut stone. the blocks lift out whole."
l_furrow = "you follow a furrow under the ash. roots grow all along it."
l_hung_birch = "a dead birch hangs in a live one. you cut the live one, and both come down."
l_lintel = "you lever a lintel out of the rubble. the wall under it was holding nothing up."
l_root_hollow = "a hollow full of roots, thick ones, clean of grit."
