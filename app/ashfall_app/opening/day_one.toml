# ---------- the screen: somewhere for what the hands make while away ----------

# From the end the hands make far more damp wood than its cap holds (docs/design/banked-time-plan.md). Weaving takes
# it in the mix, held against the damp wood line like a trip (engine DESIGN.txt, "BANKED TIME"); the screen is a
# comfort built from the weave by its order card, a stage whenever a stage's wattle is in, so a day away brings more
# of it than a night away. Both are on the cards from the end, while the player is there: the screen shows unready,
# with its wattle at 0, before it can be afforded (the 2 AM test).
[[triggers]]
id = "t_screen_open"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "keeps_going", value = 1 }
[triggers.outcome]
unlocks = [
  { unlock_kind = "card", id = "weave_wattle" },
  { unlock_kind = "card", id = "screen_fire" },
  { unlock_kind = "store", id = "wattle" },
]

[[stores]]
id = "wattle"
label_key = "store_wattle"
cap_items = 24

[[cards]]
id = "weave_wattle"
presentation = "action"
label_key = "c_weave_wattle"
work_s = 180
inputs = [{ store = "damp_wood", items = 18 }]
outcome = { stores = [{ store = "wattle", items = 1 }] }

# One stage a completion, each a full store of wattle, so its countdown is the wattle line's fill; the last pays. Tapped by its order card, so no stage is queued.
[[cards]]
id = "screen_fire"
presentation = "craft"
label_key = "c_screen_fire"
upside_key = "up_screen_fire"
work_s = 30
cap = 4
inputs = [{ store = "wattle", items = 24 }, { store = "stones", items = 12 }]
line_keys = ["l_screen_1", "l_screen_2", "l_screen_3", "l_screen_4"]
[cards.finished]
unlocks = [{ unlock_kind = "feature", id = "screen" }]
modifiers = [{ target = "rate", id = "chill", flow = "cost", store = "warmth", kind = "mul_bp", amount_bp = 7500, source = "screen" }]

# ---------- the journal ----------

# A days note is written at its beat's own step (api/CONTRACT.txt, "JOURNAL").
[[notes]]
id = "n_day_b3"
entry = "e_days_1"
gate = { test = "at_least", subject_kind = "card_count", id = "take_stock", value = 1 }
beat = "B3"

# ---------- features ----------

[[features]]
id = "night"

[[features]]
id = "morning"

[[features]]
id = "lean_to"

[[features]]
id = "larder"

[[features]]
id = "smoke_rack"

[[features]]
id = "prints"

[[features]]
id = "n1"

[[features]]
id = "roots_to_stock"

[[features]]
id = "screen"

# ---------- aims ----------

# Day one's stretches, after the opening's (schema: feature_entries.AimEntry), each from the moment the story moves on.
[[aims]]
id = "aim_night"
text_key = "aim_night"
after = { unlock_kind = "feature", id = "keeps_going" }

[[aims]]
id = "aim_food"
text_key = "aim_food"
after = { unlock_kind = "feature", id = "morning" }

[[aims]]
id = "aim_hold"
text_key = "aim_hold"
after = { unlock_kind = "card", id = "build_larder" }

[[aims]]
id = "aim_worth"
text_key = "aim_worth"
after = { unlock_kind = "feature", id = "prints" }

[[aims]]
id = "aim_two"
text_key = "aim_two"
after = { unlock_kind = "feature", id = "n1" }

# ---------- order cards ----------

# The first rule on a rising line: offered under the catch line while it is full and the rack idle.
[[order_cards]]
store = "catch"
tap_card = "smoke_catch"
when = { test = "at_least", subject_kind = "store", id = "catch", value = 4, release = 4 }
offered_after = { unlock_kind = "card", id = "smoke_catch" }

# The screen's rule: a stage whenever a stage's wattle is in, stones allowing; passed over at the cap.
[[order_cards]]
store = "wattle"
tap_card = "screen_fire"
when = { test = "at_least", subject_kind = "store", id = "wattle", value = 24, release = 24 }
offered_after = { unlock_kind = "card", id = "screen_fire" }

# Take stock's roots need: the roots rule re-tuned (forage under 13, until 15), once the larder can hold it.
[[order_cards]]
store = "roots"
tap_card = "forage"
when = { test = "at_most", subject_kind = "store", id = "roots", value = 12, release = 15 }
offered_after = { unlock_kind = "feature", id = "roots_to_stock" }

# Hunger's rule, as the tired one is taught: offered in the hands strip while hungry, once day one's end is reached; its
# `when` is the chip's, so the rule reads as the chip; offered once cooking is open (t_cook).
[[order_cards]]
store = "fullness"
tap_card = "cook_roots"
chip = "hungry"
after_end = true
when = { test = "at_most", subject_kind = "store", id = "fullness", value = 3, release = 6 }
offered_after = { unlock_kind = "card", id = "cook_roots" }

# ---------- text ----------
# Labels and lines after the voice pass (content/team/drafts/voice-notes.md); picks in content/team/drafts/selection.md.

[line_kinds]
l_wc_faster = "level"
