# ---------- the named pays: a thing at a level, beside its speed-up ----------

# Each on a level its taper trigger speeds, as its own trigger (that one's outcome is released): a find the player's own
# work earns, into a store the day already uses. None adds dry wood after the night, which could ready a build or the
# rack unseen (the 2 AM test). Every line holds from the morning (the night, for Woodcutting 6 and 9) to after B3.
# The levels most routes reach next after day one's end (Woodcutting 17, Scavenging 14, Foraging 6) pay one too, so the
# rows name a thing to come back for when the day is done.

[[triggers]]
id = "t_deadfall"
when = { test = "at_least", subject_kind = "skill_level", id = "woodcutting", value = 6 }
outcome = { stores = [{ store = "dry_wood", items = 4 }], line_keys = ["l_deadfall"] }

