[cards.finished]
modifiers = [{ target = "rate", id = "rest", flow = "make", store = "energy", kind = "mul_bp", amount_bp = 11000, source = "hall_hearth" }]

# ---------- T5: the rime stops short ----------

# Morning 18 on the season's clock, once T4 has landed. The field stone shows with it (A35), glowing, its countdown the
# Arcana level; T5's clock (386 h) is past B15's sharp floor (349 h), so no floor of its own is needed.
