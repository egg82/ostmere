# The camp stone's heat moved into the beds through the player's hands: a cure for the frost, no pelts, its tithe in
# ash, which is her ground's input. It cuts in, as any cure; the player's time is its cost. It takes half a cover's
# rime, so at the chip's 12 it and her covers' rule, both "when frosted", fit in the rime there together: drawn dry,
# both would pause until the rime's cap, and this one would hold the head of the queue meanwhile.
[[cards]]
id = "warm_beds"
only_player = "magic"
presentation = "action"
label_key = "c_warm_beds"
upside_key = "up_warm_beds"
# Slower than a cover (600), so covering is the fast trade and warming the pelt-free slow one; both count toward the tally.
