# Day sixteen: from B14 (the hall roofed) through T4-T6 and SL24-SL26 to B15 (the field stone), as data merged after
# day_fifteen.toml (schema.Chapter, chapters.merge). Story spoilers: never shown to the owner. Spec:
# content/team/week-three.md, "Day sixteen"; numbers: content/team/week-three-numbers.md.
version = 1
end_feature = "spellcraft"

# ---------- the table's clock ----------

# Never drawn: game hours since B14, for the chapter's own steps (T4, SL25).
[[stores]]
id = "table_clock"
label_key = "store_table_clock"
cap_items = 8760
hidden = true

[[standing]]
id = "table_clock"
label_key = "action_table_clock"
makes = [{ store = "table_clock", items_per_hour = 1 }]

[[triggers]]
id = "t_table_clock"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "belonging", value = 1 }
outcome = { unlocks = [{ unlock_kind = "action", id = "table_clock" }] }

# ---------- O-road and SL24: the old road ----------

# With B14 (its feature, so one moment): who walks the old road to mark it. Either answer marks it; each is a stretch of
# someone's time, the hands' a quarter of his (a hands card's bar is a quarter of its town copy's). Each answer starts
# the countdown Lucy's jobs wait on.
[[offers]]
id = "o_road"
text_key = "o_road"
askers = ["n1"]
gate = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "belonging", value = 1 }
line_keys = ["l_road_ask"]

[[offers.answers]]
id = "o_road_you"
label_key = "a_road_you"
cost_key = "a_road_you_cost"
[offers.answers.outcome]
stores = [{ store = "ask_wait", items = 3 }]
unlocks = [{ unlock_kind = "card", id = "mark_road" }]
queues = ["mark_road"]

[[offers.answers]]
id = "o_road_n2"
label_key = "a_road_n2"
cost_key = "a_road_n2_cost"
[offers.answers.outcome]
stores = [{ store = "ask_wait", items = 3 }]
unlocks = [{ unlock_kind = "card", id = "n2_mark_road" }]
orders = [{ tap_card = "n2_mark_road", first = true }]

# A36 on the hands, A37 on his lane.
[[cards]]
id = "mark_road"
presentation = "narrative"
label_key = "c_mark_road"
work_s = 900
cap = 1

[[cards]]
id = "n2_mark_road"
twin_of = "mark_road"
lane = "n2"
presentation = "narrative"
label_key = "c_n2_mark_road"
work_s = 3600
cap = 1

# Either walk marks it.
[[triggers]]
id = "t_marked_you"
when = { test = "at_least", subject_kind = "card_count", id = "mark_road", value = 1 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "road_marked" }] }

[[triggers]]
id = "t_marked_n2"
when = { test = "at_least", subject_kind = "card_count", id = "n2_mark_road", value = 1 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "road_marked" }] }

# SL24: the road found. P3, the week's last joint project, on the hands, run by its order card; the town clears its bed.
[[triggers]]
id = "t_road_marked"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "road_marked", value = 1 }
[triggers.outcome]
line_keys = ["l_road_marked"]
unlocks = [
  { unlock_kind = "store", id = "cleared" },
  { unlock_kind = "card", id = "cut_road" },
  { unlock_kind = "card", id = "shovel_road" },
  { unlock_kind = "card", id = "n1_clear_road" },
  { unlock_kind = "card", id = "n2_clear_road" },
  { unlock_kind = "card", id = "n3_clear_road" },
  { unlock_kind = "card", id = "n4_clear_road" },
  { unlock_kind = "card", id = "n5_clear_road" },
  { unlock_kind = "card", id = "n6_clear_road" },
  { unlock_kind = "card", id = "n7_clear_road" },
]

# The road's page, on SL24's condition (one moment with it), whoever walked it.
[[entries]]
id = "e_old_road"
section = "places"
sketch = "old_road"
hand = "ink"
runners = []

[[notes]]
id = "n_road_found"
entry = "e_old_road"
gate = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "road_marked", value = 1 }

# The road's bed cleared of ash, ahead of the stretches laid on it.
[[stores]]
id = "cleared"
label_key = "store_cleared"
cap_items = 24

[[cards]]
id = "shovel_road"
presentation = "action"
label_key = "c_shovel_road"
upside_key = "up_shovel_road"
work_s = 450
skill = "scavenging"
xp_per_hour = 900
outcome = { stores = [{ store = "cleared", items = 1 }] }

[[town_cards]]
id = "{lane}_clear_road"
twin_of = "shovel_road"
lanes = ["n1", "n2", "n3", "n4", "n5", "n6", "n7", "n8", "n9", "n10", "n11", "n12", "n14", "n15", "n23", "g_walkers", "g_widowers"]
presentation = "action"
label_key = "c_lane_clear_road"
upside_key = "up_shovel_road"
work_s = 1800
outcome = { stores = [{ store = "cleared", items = 1 }] }

# P3: ten stretches, each the same take (a card's inputs are one per stage), so the totals are week-three.md's: 120
# cleared, 60 stones, 40 stakes, 4 beams (the ruin's last four, after the hall's eight), and 20 cord for the markers
# (SL26's), cord's sink once the hall is up. Stages 7, 8 and 10 carry day nineteen's beats.
[[cards]]
id = "cut_road"
only_player = "project"
presentation = "craft"
label_key = "c_cut_road"
upside_key = "up_cut_road"
work_s = 2400
cap = 10
inputs = [
  { store = "cleared", items = 12 },
  { store = "stones", items = 6 },
  { store = "stakes", items = 4 },
  { store = "cord", items = 2 },
  { store = "beams", items = 2, every = 5 },
]
line_keys = ["l_road_1", "l_road_2", "l_road_3", "l_road_4", "l_road_5", "l_road_6", "l_road_7", "l_road_8",
             "l_road_9", "l_road_10"]

# "When the road's bed reaches 12, lay a stretch": passed over at the cap.
[[order_cards]]
store = "cleared"
tap_card = "cut_road"
when = { test = "at_least", subject_kind = "store", id = "cleared", value = 12, release = 12 }
offered_after = { unlock_kind = "card", id = "cut_road" }

# ---------- T4: the outer rows ----------

# B14 + 4 h. The frost under the covers takes a few hours' barley from the beds: a drain of six ripe on its own pool (the
# visitor's idiom), pausing while the beds are bare, the same whether watched or not.
[[triggers]]
id = "t_rows_black"
when = { test = "at_least", subject_kind = "store", id = "table_clock", value = 4 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "action", id = "beds", value = 1 }]
outcome = { line_keys = ["l_rows_black_1", "l_rows_black_2"], stores = [{ store = "rows_black_left", items = 6 }], unlocks = [{ unlock_kind = "feature", id = "rows_lost" }, { unlock_kind = "action", id = "rows_black" }] }

[[stores]]
id = "rows_black_left"
label_key = "store_rows_black_left"
cap_items = 6
hidden = true

[[standing]]
id = "rows_black"
label_key = "action_rows_black"
costs = [{ store = "rows_black_left", items_per_hour = 6 }, { store = "ripe", items_per_hour = 6 }]

# ---------- SL25: the hall's hearth ----------

# B14 + 10 h: a hearth for the hall, against the stones the road wants. On the hands alone, as the hall it stands in: a
# one-off build, and a town twin per lane would let each person lay one.
[[triggers]]
id = "t_hall_hearth"
when = { test = "at_least", subject_kind = "store", id = "table_clock", value = 10 }
outcome = { line_keys = ["l_hall_hearth"], unlocks = [{ unlock_kind = "card", id = "hall_hearth" }] }

[[cards]]
