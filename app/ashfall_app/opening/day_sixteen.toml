# ---------- Lucy's jobs ----------

# From O-road's answer, one at a time on day nine's countdown (ask_wait): each shows once the last is answered and the
# countdown has run out. Offers of no kind whose yes queues a short hands job (o_pelt's idiom) and whose no costs
# nothing. Each job pays a one-off, never a lasting bonus, so a no is never beaten outright (principles.md, "No blind
# permanent choices"): whether the hands' time is worth what it brings depends on what the town is short of.
