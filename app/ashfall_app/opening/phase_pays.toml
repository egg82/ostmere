[text]
pays_pf_wc = "a surer swing, {pct} woodcutting speed"
l_pf_wc_a = "you read the grain before the axe falls. green wood comes away clean."
l_pf_wc_b = "the swing is easy now. a tree drops in fewer strokes."
l_pf_wc_c = "your arms know the work. green wood piles up while you think."
l_pf_wc_d = "you learn the cut that drops a branch whole. you trim it and stack it."

pays_pf_scav = "a sharper eye, {pct} scavenging speed"
l_pf_scav_a = "you know where to look now. loose stones turn up under your hands."
l_pf_scav_b = "your eye picks the useful out of the rubble. you fill your sack."
l_pf_scav_c = "you stop walking past the good ground. the sack fills faster."
l_pf_scav_d = "you turn a stone and know it is sound. you keep it, and the next."

pays_pf_for = "a lighter touch, {pct} foraging speed"
l_pf_for_a = "you spot the green tops from far off. the roots come up whole."
l_pf_for_b = "your fingers find a root before the digging starts. you pull it clean."
l_pf_for_c = "you know which ground is soft. the roots come up easy."
l_pf_for_d = "you stop tearing roots and start lifting them. fewer break."

pays_pf_cook = "a surer knife, {pct} cooking speed"
l_pf_cook_a = "you trim a catch without waste. more of it is left for the pot."
l_pf_cook_b = "your knife knows where the joints are. the meat comes away clean."
l_pf_cook_c = "you judge the smoke by its smell now. less spoils, and the rest keeps."
l_pf_cook_d = "you stop wasting what comes in. every scrap goes to the pot."

pays_pf_arc = "a steadier hand, {pct} arcana speed"
l_pf_arc_a = "your hand sits steady on the stone. less is burned, and the wood lasts."
l_pf_arc_b = "you learn how the stone takes heat. you spend less wood on it."
l_pf_arc_c = "the stone answers sooner now. you set a little wood by."
l_pf_arc_d = "you stop forcing it. the work uses less, and you keep the rest."

pays_pf_melee = "a quicker strike, {pct} hunting speed"
l_pf_melee_a = "your strike lands where you meant it. the meat is clean to smoke."
l_pf_melee_b = "you read a beast's weight before it moves. the hunt ends sooner."
l_pf_melee_c = "you carry the kill home in one piece. there is more to smoke."
l_pf_melee_d = "you stop chasing and start waiting. the hunt gives more."

# Retired: the lines of the finds phases once paid (see retired_finds).
l_pp_wc_2 = "the wind took a birch in the night. it lies ready for the axe."
l_pp_wc_5 = "a stump gone grey and dry. it splits at a touch."
l_pp_wc_8 = "saplings crowd a gap in the canopy. you thin them for poles."
l_pp_wc_11 = "lightning split this birch to the root. the heartwood is dry."
l_pp_wc_14 = "your axe rings on stone. the roots have grown right round it."
l_pp_wc_17 = "the trunk is hollow at the heart, the shell sound and light."
l_pp_wc_20 = "two birches grown into each other. one cut drops both."
l_pp_scav_2 = "a keg rotted to its hoops. the nails inside have rusted to a lump."
l_pp_scav_5 = "a fence line under the bracken. the wire lifts in coils."
l_pp_scav_8 = "a cellar's top step, cut stone, under a skin of leaf mould."
l_pp_scav_11 = "the iron back of a hearth, cracked in two. you take both halves."
l_pp_scav_14 = "flint spilled from a sack that burst long ago. it is still sharp."
l_pp_scav_17 = "a door lies flat in the nettles. the boards are sound."
l_pp_scav_20 = "a plough share, left in the last furrow it cut."
l_pp_for_2 = "molehills along the field edge, the earth soft and full of roots."
l_pp_for_5 = "fungus in a ring on the turf. you take the outer ones."
l_pp_for_8 = "the stream bank has slumped. its roots hang bare."
l_pp_for_11 = "grey clay where the stream bends. it takes a thumbprint."
l_pp_for_14 = "nettles over an old fire pit. the roots run white and thick."
l_pp_for_17 = "a hollow log, soft inside and grown through with fungus."
l_pp_for_20 = "hoof fungus on a dead birch, dry as paper."
l_pp_cook_2 = "a marrow bone cracks clean. the pot goes rich and dark."
l_pp_cook_5 = "wild garlic under the alders. the stew smells of it all day."
l_pp_cook_8 = "you scrape the rack to bare wood. the smoke runs even."
l_pp_cook_11 = "a flat stone fits the pot like a lid. less boils away."
l_pp_cook_14 = "you bank the smoke and leave it overnight. it keeps."
l_pp_cook_17 = "the pot has a black crust now. nothing sticks to it."
l_pp_cook_20 = "you pull the pot back from the flame. it thickens slowly."
l_pp_arc_2 = "the fire burns down to white ash, fine as flour."
l_pp_arc_5 = "kindling dried on the hot stones, light as paper."
l_pp_arc_8 = "one stone stays warm till morning. you set it at the heart."
l_pp_arc_11 = "rain softens the bank by the hearth. the clay comes away in slabs."
l_pp_arc_14 = "a hearth stone splits clean in the heat. now there are two."
l_pp_arc_17 = "a log left on the warm stones overnight rings dry by morning."
l_pp_arc_20 = "ash drifts in the lee of the hearth, deep enough to scoop."
l_pp_melee_2 = "a wolf in its winter coat. the pelt is thick to the skin."
l_pp_melee_5 = "something ate half a deer and left. you take the rest."
l_pp_melee_8 = "sinew from the hunt, dried and twisted into cord."
l_pp_melee_11 = "a lame wolf, slow to turn. it is over quickly."
l_pp_melee_14 = "a carcass cached under stones. you lift them off one by one."
l_pp_melee_17 = "a pelt off a young wolf, not a scar on it."
l_pp_melee_20 = "an old den, empty. a pelt rots in it, but the back is good."
