# Later phases' level pays: what each level of every phase from 2 on pays, by its level within the phase, as data
# merged after prestige.toml (schema.Chapter, chapters.merge; expanded by phase_pays.py). Story spoilers: never shown
# to the owner. Mechanics: docs/design/prestige-phases.md, "Phases" and "The loop".
version = 1

# Every level adds 400 bp (+4%) to its skill's own work: a phase's levels add about what phase 1's compounding levels
# came to, so production grows by about the same each phase. A find every third level, from level 2, so a new phase's
# first level is one and no more than two levels in a row pay only speed.

# A find is the skill's staple: a store one of its own training cards spends for the rest of the game (the loader
# refuses any other), in an amount that grows by `items_per_phase` each phase, under a line from the pool that says the
# skill is getting better, never a story object, since a later phase lands at a different moment of the story for each
# player. `retired_finds` are what phases 2 up to `retired_through` once paid: released, so their triggers stay as they
# were under their old ids, gated out of reach. Their lines stay below only because those triggers name them.

[[phase_pays]]
skill = "woodcutting"
speed = [{ target = "work", id = "woodcutting", kind = "add_bp", amount_bp = 400 }]
speed_key = "pays_wc_faster"
retired_through = 4
retired_finds = [
  { level = 2, line_key = "l_pp_wc_2", store = "damp_wood", items = 6 },
  { level = 5, line_key = "l_pp_wc_5", store = "dry_wood", items = 8 },
  { level = 8, line_key = "l_pp_wc_8", store = "stakes", items = 8 },
  { level = 11, line_key = "l_pp_wc_11", store = "dry_wood", items = 10 },
  { level = 14, line_key = "l_pp_wc_14", store = "stones", items = 4 },
  { level = 17, line_key = "l_pp_wc_17", store = "dry_wood", items = 8 },
  { level = 20, line_key = "l_pp_wc_20", store = "damp_wood", items = 10 },
]

[phase_pays.find]
levels = [2, 5, 8, 11, 14, 17, 20]
store = "damp_wood"
items = 4
items_per_phase = 1
pays_key = "pays_pf_wc"
lines = ["l_pf_wc_a", "l_pf_wc_b", "l_pf_wc_c", "l_pf_wc_d"]

