when = { test = "after_time", value = 1188000 }
outcome = { line_keys = ["l_night_14"], unlocks = [{ unlock_kind = "action", id = "night_14" }] }

# A32, an hour into night 14 on the season's clock (B8 at 168 h on every route); S3 opens it, and its require reads
