# ---------- S3 and night 14 ----------

# S3 on the season's clock (B8 at 168 h on every route: 318 h), so it comes after B12 on typical and before dusk 14 on
# every route. A32 shows with it, unready, its countdown the season's clock: queueable When ready.
[[triggers]]
id = "t_sitter"
when = { test = "at_least", subject_kind = "store", id = "drift_clock", value = 150 }
outcome = { line_keys = ["l_sitter_1", "l_sitter_2"], unlocks = [{ unlock_kind = "feature", id = "sitter" }, { unlock_kind = "card", id = "sit_last_night" }] }

# Dusk 14 at 330 h on the calendar, a hidden clock the scene's night grade reads, so it opens nothing to see.
[[stores]]
id = "night_14"
label_key = "store_night_14"
