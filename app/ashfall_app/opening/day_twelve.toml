# Day twelve: B11 through the dig (S1, S2), SL20 and the bear, B12 (the cellar), SL21 and S3 to night 14 and S4, the
# edge of week 2's content, as data merged after day_eleven.toml (schema.Chapter, chapters.merge). Story spoilers:
# never shown to the owner. Spec: content/team/week-two.md, "Day twelve"; numbers: content/team/week-two-numbers.md.
version = 1
end_feature = "week_two_end"

# ---------- the dig, with B11's moment ----------

# The vigil kept (t_b11's condition, so one moment): the dig, its order card's feature and the chapter's clock.
[[triggers]]
id = "t_dig"
when = { test = "at_least", subject_kind = "card_count", id = "keep_vigil", value = 1 }
[triggers.outcome]
line_keys = ["l_dig_open"]
unlocks = [
  { unlock_kind = "feature", id = "dig" },
  { unlock_kind = "card", id = "dig_cellar" },
  { unlock_kind = "action", id = "dig_clock" },
]

# Never drawn: game hours since the vigil was kept, for the chapter's steps.
[[stores]]
id = "dig_clock"
label_key = "store_dig_clock"
cap_items = 8760
hidden = true

[[standing]]
id = "dig_clock"
label_key = "action_dig_clock"
makes = [{ store = "dig_clock", items_per_hour = 1 }]

# A staged comfort on the hands, run by its order card (below), so no stage is queued: stage 1 S1, stage 3 S2, stage 4
# B12 with its floor. Each stage takes props and shoring. Finished, picking draws three quarters of a bloom a pick, so
# typical leaves some bloom at night 14 (week-two.md, "Fungus as food").
[[cards]]
id = "dig_cellar"
presentation = "craft"
label_key = "c_dig_cellar"
upside_key = "up_dig_cellar"
work_s = 2400
cap = 4
inputs = [{ store = "stakes", items = 16 }, { store = "damp_wood", items = 6 }]
line_keys = ["l_dig_stage_1", "l_dig_stage_2", "l_dig_stage_3", "l_dig_done"]
[cards.finished]
modifiers = [
  { target = "cap", id = "roots", kind = "mul_bp", amount_bp = 15000, source = "dig_cellar" },
  { target = "side", id = "larder", kind = "add_bp", amount_bp = 20000, source = "dig_cellar" },
  { target = "rate", id = "pick_fungus", flow = "cost", store = "bloom", kind = "mul_bp", amount_bp = 7500, source = "dig_cellar" },
  { target = "rate", id = "n3_pick", flow = "cost", store = "bloom", kind = "mul_bp", amount_bp = 7500, source = "dig_cellar" },
  { target = "rate", id = "n5_pick", flow = "cost", store = "bloom", kind = "mul_bp", amount_bp = 7500, source = "dig_cellar" },
  { target = "rate", id = "n6_pick", flow = "cost", store = "bloom", kind = "mul_bp", amount_bp = 7500, source = "dig_cellar" },
  { target = "rate", id = "n7_pick", flow = "cost", store = "bloom", kind = "mul_bp", amount_bp = 7500, source = "dig_cellar" },
]

# "When stakes reach 16, dig": a stage whenever a stage's stakes are in, the shoring allowing; passed over at the cap.
[[order_cards]]
store = "stakes"
tap_card = "dig_cellar"
when = { test = "at_least", subject_kind = "store", id = "stakes", value = 16, release = 16 }
offered_after = { unlock_kind = "feature", id = "dig" }

# Morning 13, an hour after the vigil: the scene's night grade ends on this hidden clock.
[[stores]]
id = "morning_13"
label_key = "store_morning_13"
cap_items = 20
hidden = true

[[standing]]
id = "morning_13"
label_key = "action_morning_13"
makes = [{ store = "morning_13", items_per_hour = 20 }]

[[triggers]]
id = "t_morning_13"
when = { test = "at_least", subject_kind = "store", id = "dig_clock", value = 1 }
outcome = { line_keys = ["l_morning_13"], unlocks = [{ unlock_kind = "action", id = "morning_13" }] }

# S1: the dig's first stage.
[[triggers]]
id = "t_s1"
when = { test = "at_least", subject_kind = "card_count", id = "dig_cellar", value = 1 }
outcome = { line_keys = ["l_dig_1", "l_dig_2"] }

# S2: its third.
[[triggers]]
id = "t_s2"
when = { test = "at_least", subject_kind = "card_count", id = "dig_cellar", value = 3 }
outcome = { line_keys = ["l_steps_1", "l_steps_2"] }

# ---------- B12: the cellar ----------

# B12 on the last stage. t_b12_floor and its clock are a released floor nothing reads now, as B10's.
[[triggers]]
id = "t_b12_floor"
when = { test = "after_time", value = 900000 }
outcome = { unlocks = [{ unlock_kind = "action", id = "b12_floor" }] }

# Never drawn: hours past the floor.
[[stores]]
id = "b12_floor"
label_key = "store_b12_floor"
cap_items = 8760
hidden = true

[[standing]]
id = "b12_floor"
label_key = "action_b12_floor"
makes = [{ store = "b12_floor", items_per_hour = 1 }]

[[triggers]]
id = "t_b12"
when = { test = "at_least", subject_kind = "card_count", id = "dig_cellar", value = 4 }
requires = [
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "b9", value = 1 },
]
outcome = { line_keys = ["l_b12_1", "l_b12_2", "l_b12_3"], unlocks = [{ unlock_kind = "feature", id = "cellar" }] }

# ---------- SL20: the bear at the bloom ----------

# Its season: ninety-six hours of the season's clock, a hidden clock's action (requires reads only unlocks).
[[triggers]]
id = "t_bear_season"
when = { test = "at_least", subject_kind = "store", id = "drift_clock", value = 96 }
outcome = { unlocks = [{ unlock_kind = "action", id = "bear_season" }] }

# Never drawn: hours past the bear's season opening.
[[stores]]
id = "bear_season"
label_key = "store_bear_season"
cap_items = 8760
hidden = true

[[standing]]
id = "bear_season"
label_key = "action_bear_season"
makes = [{ store = "bear_season", items_per_hour = 1 }]

# Five hours after the vigil, in the bear's season: its sign at the bloom, a finite pool of hunts.
[[triggers]]
id = "t_bear_sign"
when = { test = "at_least", subject_kind = "store", id = "dig_clock", value = 5 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "action", id = "bear_season", value = 1 }]
[triggers.outcome]
line_keys = ["l_bear_sign"]
stores = [{ store = "bear_sign", items = 6 }]
unlocks = [
  { unlock_kind = "store", id = "bear_sign" },
  { unlock_kind = "store", id = "tallow" },
  { unlock_kind = "card", id = "hunt_bear" },
  { unlock_kind = "feature", id = "combat" },
]

# The lamps' clock starts with the sign (t_bear_sign's condition, so one moment).
[[triggers]]
id = "t_sign_clock"
when = { test = "at_least", subject_kind = "store", id = "dig_clock", value = 5 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "action", id = "bear_season", value = 1 }]
outcome = { unlocks = [{ unlock_kind = "action", id = "sign_clock" }] }

# Never drawn: hours since the bear's sign (SL20), the lamps' clock.
[[stores]]
id = "sign_clock"
label_key = "store_sign_clock"
cap_items = 8760
hidden = true

[[standing]]
id = "sign_clock"
label_key = "action_sign_clock"
makes = [{ store = "sign_clock", items_per_hour = 1 }]

# The hunts left this season: a pool nothing refills.
[[stores]]
id = "bear_sign"
label_key = "store_bear_sign"
cap_items = 6

[[stores]]
id = "tallow"
label_key = "store_tallow"
cap_items = 6

[[stores]]
id = "bear_lost"
label_key = "store_bear_lost"
cap_items = 20000

[[threats]]
id = "ash_bear"
label_key = "threat_ash_bear"
base = 16

# A fight card on the hands whose pool ends it, as everything has a cap: the player's to seek, never a raid.
[[cards]]
id = "hunt_bear"
presentation = "action"
label_key = "c_hunt_bear"
work_s = 2400
skill = "melee"
xp_per_hour = 2
inputs = [{ store = "smoked", items = 2 }, { store = "bear_sign", items = 1 }]
outcome = { stores = [{ store = "catch", items = 3 }, { store = "pelt", items = 1 }, { store = "tallow", items = 2 }] }
fight = { side = "hands", threat = "ash_bear", lost = "bear_lost", wounds = [{ store = "hurt", items = 2 }], won_line_keys = ["l_fight_bear_won_1", "l_fight_bear_won_2"], lost_line_keys = ["l_fight_bear_lost_1", "l_fight_bear_lost_2"] }

# The bear's page, with its sign (t_bear_sign's condition, one moment): its odds read unknown until the first hunt.
[[entries]]
id = "e_bear"
section = "creatures"
sketch = "ash_bear"
hand = "ink"
runners = ["hunt_bear"]

[[notes]]
id = "n_bear_1"
entry = "e_bear"
gate = { test = "at_least", subject_kind = "store", id = "dig_clock", value = 5 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "action", id = "bear_season", value = 1 }]
hand = "ink"

# Already there when the page is first written: the old hand's knot by the gutter.
[[notes]]
id = "n_gutter_1"
entry = "e_bear"
gate = { test = "at_least", subject_kind = "store", id = "dig_clock", value = 5 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "action", id = "bear_season", value = 1 }]
hand = "pencil"
sketch = "gutter_knot"

# ---------- SL21: lamps at the gate ----------

# Fifteen hours after the bear's sign, on its clock.
[[triggers]]
id = "t_lamps"
when = { test = "at_least", subject_kind = "store", id = "sign_clock", value = 15 }
outcome = { line_keys = ["l_lamps"], unlocks = [{ unlock_kind = "card", id = "tallow_lamps" }] }

# Three stages, the last holding the gap; run by its order card, as hide_flaps is.
[[cards]]
id = "tallow_lamps"
presentation = "craft"
label_key = "c_tallow_lamps"
upside_key = "up_tallow_lamps"
work_s = 600
cap = 3
inputs = [{ store = "tallow", items = 2 }, { store = "stakes", items = 2 }]
line_keys = ["l_lamps_1", "l_lamps_2", "l_lamps_done"]
[cards.finished]
modifiers = [{ target = "side", id = "gap", kind = "add_bp", amount_bp = 10000, source = "tallow_lamps" }]

[[order_cards]]
store = "tallow"
tap_card = "tallow_lamps"
when = { test = "at_least", subject_kind = "store", id = "tallow", value = 2, release = 2 }
offered_after = { unlock_kind = "card", id = "tallow_lamps" }

