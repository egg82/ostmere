# Day eight: week 1's last visit (the long goal shown at G2) and B8, the season's turn at 168 h, through U1-U3, SL15
# and SL16 to B9, as data merged after day_six.toml (schema.Chapter, chapters.merge). Story spoilers: never shown to
# the owner. Spec: content/team/week-two.md, "Week 1's last visit" and "Day eight"; numbers:
# content/team/week-two-numbers.md.
version = 1
end_feature = "b9"

# ---------- G2's visit: the long goal ----------

# On still_end (G2, day_six.toml's sit_fire_7): the build, its materials and the pelts' sink, shown hours before the
# turn so the town's split is set before the night that carries B8.
[[triggers]]
id = "t_ring_scored"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "still_end", value = 1 }
[triggers.outcome]
line_keys = ["l_ring_scored"]
unlocks = [
  { unlock_kind = "store", id = "stakes" },
  { unlock_kind = "store", id = "cord" },
  { unlock_kind = "card", id = "palisade" },
  { unlock_kind = "card", id = "cut_stakes" },
  { unlock_kind = "card", id = "n1_stakes" },
  { unlock_kind = "card", id = "n2_stakes" },
  { unlock_kind = "card", id = "twist_cord" },
  { unlock_kind = "card", id = "n4_cord" },
  { unlock_kind = "card", id = "hide_flaps" },
]

[[stores]]
id = "stakes"
label_key = "store_stakes"
cap_items = 24

[[stores]]
id = "cord"
label_key = "store_cord"
cap_items = 12

# P1, the week's joint project on the hands: twelve stages, each an entry on the gap's side. Run by
# its order card (below), so no stage is queued; it lands B10 in day nine.
[[cards]]
id = "palisade"
presentation = "craft"
label_key = "c_palisade"
upside_key = "up_palisade"
work_s = 1800
cap = 12
inputs = [{ store = "stakes", items = 16 }, { store = "cord", items = 4 }, { store = "stones", items = 6 }]
outcome = { modifiers = [{ target = "side", id = "gap", kind = "add_bp", amount_bp = 5000, source = "palisade" }] }
line_keys = ["l_stage_1", "l_stage_2", "l_stage_3", "l_stage_4", "l_stage_5", "l_stage_6", "l_stage_7", "l_stage_8",
             "l_stage_9", "l_stage_10", "l_stage_11", "l_stage_12"]

# The build's order, offered at the season's turn: a stage whenever a stage's stakes are in, cord and
# stones allowing; passed over at the cap.
[[triggers]]
id = "t_stakes_full"
when = { test = "at_least", subject_kind = "store", id = "stakes", value = 16 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "stakes_full" }] }

[[order_cards]]
store = "stakes"
tap_card = "palisade"
when = { test = "at_least", subject_kind = "store", id = "stakes", value = 16, release = 16 }
offered_after = { unlock_kind = "feature", id = "stakes_full" }

[[cards]]
id = "cut_stakes"
presentation = "action"
label_key = "c_cut_stakes"
work_s = 600
skill = "woodcutting"
xp_per_hour = 900
inputs = [{ store = "damp_wood", items = 4 }]
outcome = { stores = [{ store = "stakes", items = 1 }] }

# Stakes on the townsfolk's lanes; the three who come in day eleven expand where their lanes are declared.
[[town_cards]]
id = "{lane}_stakes"
lanes = ["n1", "n2", "n5", "n6", "n7"]
presentation = "action"
label_key = "c_lane_stakes"
work_s = 1200
inputs = [{ store = "damp_wood", items = 4 }]
outcome = { stores = [{ store = "stakes", items = 1 }] }

[[cards]]
id = "twist_cord"
presentation = "action"
label_key = "c_twist_cord"
work_s = 600
inputs = [{ store = "damp_wood", items = 2 }]
outcome = { stores = [{ store = "cord", items = 1 }] }

# The old man's cord: his share between this and the watch is SL16's decision. Its own card, since n4_mend shipped
# making nothing and an earlier file cannot name a store this one declares.
[[cards]]
id = "n4_cord"
lane = "n4"
presentation = "action"
label_key = "c_n4_cord"
work_s = 900
inputs = [{ store = "damp_wood", items = 2 }]
outcome = { stores = [{ store = "cord", items = 1 }] }

# His cord by a rule: under a stage's worth twice over he twists until near full, so a full stack sends him back to his
# share (the watch) instead of filling past the cap (week-two-numbers.md, "Cap loss": the stakes lanes' shape).
[[order_cards]]
store = "cord"
tap_card = "n4_cord"
when = { test = "at_most", subject_kind = "store", id = "cord", value = 7, release = 11 }
offered_after = { unlock_kind = "card", id = "n4_cord" }

# The pelts' sink after the bedding: four stages, its last making rest a tenth faster. Run by its order card, so no stage
# is queued (one queue entry a stage let a babysitter land week 1's staged builds ahead of a player who queues).
[[cards]]
id = "hide_flaps"
presentation = "craft"
label_key = "c_hide_flaps"
upside_key = "up_hide_flaps"
work_s = 600
cap = 4
inputs = [{ store = "pelt", items = 2 }, { store = "damp_wood", items = 4 }]
line_keys = ["l_flaps_1", "l_flaps_2", "l_flaps_3", "l_flaps_done"]
[cards.finished]
modifiers = [{ target = "rate", id = "rest", flow = "make", store = "energy", kind = "mul_bp", amount_bp = 11000, source = "hide_flaps" }]

[[order_cards]]
store = "pelt"
tap_card = "hide_flaps"
when = { test = "at_least", subject_kind = "store", id = "pelt", value = 2, release = 2 }
offered_after = { unlock_kind = "card", id = "hide_flaps" }

# ---------- B8: the season's turn ----------

# B8 at 168 h. What only the season brings draws a pool this turn fills (season_checks): the bloom, the larder's
# fungus, and the season's own clock, which the ash's standing draws to empty at 336 h exactly. No rate is raised.
[[triggers]]
id = "t_b8"
season = true
when = { test = "after_time", value = 604800 }
[triggers.outcome]
line_keys = ["l_b8_1", "l_b8_2", "l_b8_3"]
stores = [{ store = "drift_left", items = 336 }, { store = "bloom", items = 2000 }, { store = "fungus", items = 24 }]
unlocks = [
  { unlock_kind = "feature", id = "drift" },
  { unlock_kind = "store", id = "bloom" },
  { unlock_kind = "store", id = "fungus" },
  { unlock_kind = "action", id = "ashfall" },
  { unlock_kind = "card", id = "pick_fungus" },
  { unlock_kind = "card", id = "n3_pick" },
  { unlock_kind = "card", id = "fungus_stew" },
]

# Never drawn: the season's hours left. B8 fills it; the ash draws it.
[[stores]]
id = "drift_left"
label_key = "store_drift_left"
cap_items = 336
hidden = true

# Never drawn: ash on the roofs, the chip's face.
[[stores]]
id = "roof_ash"
label_key = "store_roof_ash"
cap_items = 48
hidden = true

[[standing]]
id = "ashfall"
label_key = "action_ashfall"
costs = [{ store = "drift_left", items_per_hour = 2 }]
makes = [{ store = "roof_ash", items_per_hour = 2 }]

# Never drawn: game hours since the turn, for the season's own steps. A clock, not something the season brings, so
# its own trigger opens it on the turn's feature and it runs on past the season.
[[stores]]
id = "drift_clock"
label_key = "store_drift_clock"
cap_items = 8760
hidden = true

[[standing]]
id = "drift_clock"
label_key = "action_drift_clock"
makes = [{ store = "drift_clock", items_per_hour = 1 }]

[[triggers]]
id = "t_drift_clock"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "drift", value = 1 }
outcome = { unlocks = [{ unlock_kind = "action", id = "drift_clock" }] }

# The bloom: a finite pool nothing refills, drawn by picking; sized so typical never empties it by night 14.
[[stores]]
id = "bloom"
label_key = "store_bloom"
cap_items = 2000

[[stores]]
id = "fungus"
label_key = "store_fungus"
cap_items = 24

[[cards]]
id = "pick_fungus"
presentation = "action"
label_key = "c_pick_fungus"
work_s = 30
skill = "foraging"
xp_per_hour = 300
inputs = [{ store = "bloom", items = 1 }]
outcome = { stores = [{ store = "fungus", items = 2 }] }

# Picking on her lane and on the three who come in day eleven, expanded where their lanes are declared.
[[town_cards]]
id = "{lane}_pick"
lanes = ["n3", "n5", "n6", "n7"]
presentation = "action"
label_key = "c_lane_pick"
work_s = 120
inputs = [{ store = "bloom", items = 1 }]
outcome = { stores = [{ store = "fungus", items = 1 }] }

[[cards]]
id = "fungus_stew"
presentation = "action"
label_key = "c_fungus_stew"
upside_key = "up_stew"
upside_of = "n2_eating"
work_s = 40
skill = "cooking"
xp_per_hour = 18
inputs = [{ store = "fungus", items = 6 }, { store = "dry_wood", items = 1 }]
outcome = { stores = [{ store = "stew", items = 3 }] }

# U1: six hours after the turn.
[[triggers]]
id = "t_howls"
when = { test = "at_least", subject_kind = "store", id = "drift_clock", value = 6 }
outcome = { line_keys = ["l_howls"] }

# U2: the first fungus stew, by tap or mix.
[[triggers]]
id = "t_caps"
when = { test = "at_least", subject_kind = "card_count", id = "fungus_stew", value = 1 }
outcome = { line_keys = ["l_caps_1", "l_caps_2"] }

# ---------- the roofs: a chip with a rule-run cure ----------

# The chip shows while the ash on the roofs is heavy. It opens with both its cures, on the hands and on his lane, the
# first time it would show; its order card is offered with it.
[[triggers]]
id = "t_roofs"
when = { test = "at_least", subject_kind = "store", id = "roof_ash", value = 16 }
outcome = { unlocks = [{ unlock_kind = "chip", id = "ash_laden" }, { unlock_kind = "card", id = "clear_roofs" }, { unlock_kind = "card", id = "n2_clear_roofs" }, { unlock_kind = "store", id = "ash" }] }

[[chips]]
id = "ash_laden"
label_key = "chip_ash_laden"
tone = "cold"
when = { test = "at_least", subject_kind = "store", id = "roof_ash", value = 16 }
effects = [{ target = "rate", id = "rest", flow = "make", store = "energy", kind = "mul_bp", amount_bp = 8500, source = "ash_laden" }]
cost_key = "chip_ash_laden_cost"
on_line_key = "l_ash_laden"
off_line_key = "l_ash_cleared"

[[stores]]
id = "ash"
label_key = "store_ash"
cap_items = 24

[[cards]]
id = "clear_roofs"
presentation = "action"
label_key = "c_clear_roofs"
work_s = 120
inputs = [{ store = "roof_ash", items = 16 }]
outcome = { stores = [{ store = "ash", items = 4 }] }

[[cards]]
id = "n2_clear_roofs"
lane = "n2"
presentation = "action"
label_key = "c_n2_clear_roofs"
work_s = 1200
inputs = [{ store = "roof_ash", items = 16 }]
outcome = { stores = [{ store = "ash", items = 4 }] }

# "When ash-laden, he clears the roofs": day one's hunger card on his lane (D-91's shape), its `when` the chip's.
[[order_cards]]
store = "roof_ash"
tap_card = "n2_clear_roofs"
chip = "ash_laden"
when = { test = "at_least", subject_kind = "store", id = "roof_ash", value = 16 }
offered_after = { unlock_kind = "card", id = "n2_clear_roofs" }

# The first clear, by either hand.
[[triggers]]
id = "t_roofs_first"
when = { test = "at_least", subject_kind = "store", id = "ash", value = 4 }
outcome = { line_keys = ["l_roofs_first"], unlocks = [{ unlock_kind = "feature", id = "roofs_cleared" }] }

# SL15: the first clear and twelve hours after the turn. Her ground takes the ash.
[[triggers]]
id = "t_ash_ground"
when = { test = "at_least", subject_kind = "store", id = "drift_clock", value = 12 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "roofs_cleared", value = 1 }]
outcome = { line_keys = ["l_ash_ground"], unlocks = [{ unlock_kind = "store", id = "ashed_ground" }, { unlock_kind = "card", id = "n3_ash_ground" }] }

[[stores]]
id = "ashed_ground"
label_key = "store_ashed_ground"
cap_items = 24

[[cards]]
id = "n3_ash_ground"
lane = "n3"
presentation = "action"
label_key = "c_n3_ash_ground"
work_s = 7200
inputs = [{ store = "ash", items = 4 }]
outcome = { stores = [{ store = "ashed_ground", items = 1 }] }

# SL16: twelve hours after the turn, the moment SL15 is, once the stakes are in: the build's order is offered then, with
# his cord already made, so the two are one moment. Its line comes with SL15's, after the first clear.
[[triggers]]
id = "t_cord_first"
when = { test = "at_least", subject_kind = "store", id = "stakes", value = 16 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "cord_made" }] }

[[triggers]]
id = "t_cord"
when = { test = "at_least", subject_kind = "store", id = "drift_clock", value = 12 }
requires = [
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "cord_made", value = 1 },
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "roofs_cleared", value = 1 },
]
outcome = { line_keys = ["l_cord"], unlocks = [{ unlock_kind = "feature", id = "cord_seen" }] }

# ---------- the gap and the pack ----------

[[sides]]
id = "gap"
label_key = "side_gap"
base = 4

[[threats]]
id = "wolf_pack"
label_key = "threat_wolf_pack"
base = 8

# The watch shares week 1 shipped, each held on the gap while it runs, at its share of its lane's time.
[while_running]
n1_watch = [{ side = "gap", amount_bp = 5000 }]
n2_watch = [{ side = "gap", amount_bp = 5000 }]
n4_watch = [{ side = "gap", amount_bp = 5000 }]

# In the season the rats come indoors: a step on the season's clock (combat's ramp idiom).
[[triggers]]
id = "t_rats_drift"
when = { test = "at_least", subject_kind = "store", id = "drift_clock", value = 1 }
outcome = { modifiers = [{ target = "threat", id = "ashrats", kind = "add_bp", amount_bp = 5000, source = "t_rats_drift" }] }

# U3: seventy hours of combat's clock and twelve of the season's. requires reads only unlocks, so the first clock's
# reach is a feature.
[[triggers]]
id = "t_pack_near"
when = { test = "at_least", subject_kind = "store", id = "r1_clock", value = 70 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "pack_near" }] }

[[triggers]]
id = "t_pack"
when = { test = "at_least", subject_kind = "store", id = "drift_clock", value = 12 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "pack_near", value = 1 }]
outcome = { line_keys = ["l_pack_1", "l_pack_2"], unlocks = [{ unlock_kind = "feature", id = "combat" }, { unlock_kind = "action", id = "pack" }] }

# Tallies: made only by the fight's lines, never unlocked; caps over a year of its rate.
[[stores]]
id = "pack_fought"
label_key = "store_pack_fought"
cap_items = 10000

[[stores]]
id = "pack_lost"
label_key = "store_pack_lost"
cap_items = 10000

[[standing]]
id = "pack"
label_key = "action_pack"
fight = { side = "gap", threat = "wolf_pack", lost = "pack_lost", fought = "pack_fought", fights_per_hour = 1, loses = [{ store = "smoked", items = 1 }], won_line_keys = ["l_fight_pack_won_1", "l_fight_pack_won_2", "l_fight_pack_won_3"], lost_line_keys = ["l_fight_pack_lost_1", "l_fight_pack_lost_2", "l_fight_pack_lost_3"] }

# ---------- B9: the book comes out ----------

# The creature pages come at the first pack fight (api/CONTRACT.txt, "JOURNAL"); the book is declared in the opening.
# Each note is a trigger the loader makes; B9 waits on the three pages.
[[entries]]
id = "e_wolf"
section = "creatures"
sketch = "wolf"
hand = "ink"
runners = ["hunt_wolf", "pack"]

[[entries]]
id = "e_ashrat"
section = "creatures"
sketch = "ashrat"
hand = "ink"
runners = ["rats"]

[[entries]]
id = "e_crow"
section = "creatures"
sketch = "crow"
hand = "ink"
runners = ["crows"]

[[notes]]
id = "n_wolf_1"
entry = "e_wolf"
gate = { test = "at_least", subject_kind = "store", id = "pack_fought", value = 1 }
hand = "ink"

# Already there when the page is first written: the old hand.
[[notes]]
id = "n_wolf_margin"
entry = "e_wolf"
gate = { test = "at_least", subject_kind = "store", id = "pack_fought", value = 1 }
hand = "pencil"

[[notes]]
id = "n_rat_1"
entry = "e_ashrat"
gate = { test = "at_least", subject_kind = "store", id = "pack_fought", value = 1 }
hand = "ink"

# Written with the page's first, the season's rat step (t_rats_drift) having come before the book on every route.
[[notes]]
id = "n_rat_2"
entry = "e_ashrat"
gate = { test = "at_least", subject_kind = "store", id = "pack_fought", value = 1 }
hand = "ink"

[[notes]]
id = "n_crow_1"
entry = "e_crow"
gate = { test = "at_least", subject_kind = "store", id = "pack_fought", value = 1 }
hand = "ink"

[[triggers]]
id = "t_b9"
when = { test = "at_least", subject_kind = "store", id = "pack_fought", value = 1 }
requires = [
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "entry", id = "e_ashrat", value = 1 },
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "entry", id = "e_crow", value = 1 },
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "wolves", value = 1 },
]
outcome = { line_keys = ["l_b9_1", "l_b9_2"], unlocks = [{ unlock_kind = "feature", id = "b9" }] }

