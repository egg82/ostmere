only_player = "magic"
presentation = "action"
label_key = "c_stir_air"
upside_key = "up_wash_meat"
work_s = 900
skill = "spellcraft"
xp_per_hour = 360
inputs = [{ store = "film", items = 12 }]
outcome = { stores = [{ store = "ash", items = 2 }] }

