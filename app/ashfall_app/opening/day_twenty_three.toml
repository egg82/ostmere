# Day twenty-three: from B19 (the stranger home) through SL31, I5 and O-fiddle, I6 (the post shown), O-book, SL32, I7,
# SL33 (night 24) and A39 to B20, as data merged after day_twenty_two.toml (schema.Chapter, chapters.merge). Story
# spoilers: never shown to the owner. Spec: content/team/week-four.md, "Day twenty-three"; numbers:
# content/team/week-four-numbers.md.
version = 1
end_feature = "kept"

# ---------- clocks ----------

# Never drawn: game hours since B19, for SL31, I5, I6 and O-book.
[[stores]]
id = "sorrel_clock"
label_key = "store_sorrel_clock"
cap_items = 8760
hidden = true

[[standing]]
id = "sorrel_clock"
label_key = "action_sorrel_clock"
makes = [{ store = "sorrel_clock", items_per_hour = 1 }]

[[triggers]]
id = "t_sorrel_clock"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "stranger_home", value = 1 }
outcome = { unlocks = [{ unlock_kind = "action", id = "sorrel_clock" }] }

# Latches, never drawn: hidden clocks started at B19 + 12 h and + 16 h, so an offer or trigger can wait on them beside a
# store condition (a requirement reads only an unlock). Machinery, no moment of their own (day_eighteen.toml's).
[[stores]]
id = "sorrel_16h"
label_key = "store_sorrel_16h"
cap_items = 1
hidden = true

[[standing]]
id = "sorrel_16h"
label_key = "action_sorrel_16h"
makes = [{ store = "sorrel_16h", items_per_hour = 1 }]

[[triggers]]
id = "t_sorrel_16h"
when = { test = "at_least", subject_kind = "store", id = "sorrel_clock", value = 16 }
outcome = { unlocks = [{ unlock_kind = "action", id = "sorrel_16h" }] }

[[stores]]
id = "sorrel_12h"
label_key = "store_sorrel_12h"
cap_items = 1
hidden = true

[[standing]]
id = "sorrel_12h"
label_key = "action_sorrel_12h"
makes = [{ store = "sorrel_12h", items_per_hour = 1 }]

[[triggers]]
id = "t_sorrel_12h"
when = { test = "at_least", subject_kind = "store", id = "sorrel_clock", value = 12 }
outcome = { unlocks = [{ unlock_kind = "action", id = "sorrel_12h" }] }

# ---------- SL31: a name ----------

[[triggers]]
id = "t_named"
when = { test = "at_least", subject_kind = "store", id = "sorrel_clock", value = 6 }
outcome = { line_keys = ["l_named"], unlocks = [{ unlock_kind = "feature", id = "sorrel_named" }] }

[lane_labels]
n13 = [{ after = { unlock_kind = "feature", id = "sorrel_named" }, label_key = "lane_n13_named" }]

# ---------- I5 and O-fiddle: a man and his wife ----------

# The tier's count at 175 meals, B19 + 12 h, so SL31 has the return before it. Both join on either answer, their first
# work by the answer (the kind's roles, day_eighteen.toml) and all their everyday work with it (the pot, the stakes,
# the road's bed, the walk, the fish and the wash), one moment; what the answer keeps is D-147's size: the rack's smoke
# a tenth more, or all clearing a tenth faster. The table feeds two more.
[[offers]]
id = "o_fiddle"
text_key = "o_fiddle"
kind = "work"
gate = { test = "at_least", subject_kind = "store", id = "meals", value = 175 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "action", id = "sorrel_12h", value = 1 }]
line_keys = ["l_fiddle_1", "l_fiddle_2"]

[[offers.answers]]
id = "o_fiddle_food"
label_key = "a_fiddle_food"
cost_key = "a_fiddle_food_cost"
role = "food"
[offers.answers.outcome]
line_keys = ["l_fiddle_food"]
stores = [{ store = "arrivals", items = 2 }]
unlocks = [
  { unlock_kind = "action", id = "n14_eating" },
  { unlock_kind = "action", id = "n15_eating" },
  { unlock_kind = "card", id = "n14_fungus_stew" },
  { unlock_kind = "card", id = "n14_stakes" },
  { unlock_kind = "card", id = "n14_clear_road" },
  { unlock_kind = "card", id = "n14_walk_ashwood" },
  { unlock_kind = "card", id = "n14_fog_fish" },
  { unlock_kind = "card", id = "n14_wash_meat" },
  { unlock_kind = "card", id = "n15_fungus_stew" },
  { unlock_kind = "card", id = "n15_stakes" },
  { unlock_kind = "card", id = "n15_clear_road" },
  { unlock_kind = "card", id = "n15_walk_ashwood" },
  { unlock_kind = "card", id = "n15_fog_fish" },
  { unlock_kind = "card", id = "n15_wash_meat" },
]
