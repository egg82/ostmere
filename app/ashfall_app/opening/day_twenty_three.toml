# ---------- I6: the cache torn up, and the post ----------

# Fourteen walks, B19 + 16 h, a return after O-fiddle's. The walks' cache is rooted out: six smoked over two hours on
# a drain of its own that pauses at empty (the visitor's idiom), never a store a gate reads. The post (P4) shows with
# its order card, the warm patch goes on the map, and the stretch's aim turns to it.
[[triggers]]
id = "t_cache"
when = { test = "at_least", subject_kind = "store", id = "ashwood_trips", value = 14 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "action", id = "sorrel_16h", value = 1 }]
[triggers.outcome]
line_keys = ["l_cache_1", "l_cache_2", "l_post_shown"]
stores = [{ store = "cache_torn", items = 6 }]
unlocks = [
  { unlock_kind = "feature", id = "post_shown" },
  { unlock_kind = "action", id = "cache_torn" },
  { unlock_kind = "card", id = "post" },
]

# Never drawn but by its drain: the meat the boar took from the cache.
[[stores]]
id = "cache_torn"
label_key = "store_cache_torn"
cap_items = 6
hidden = true

[[standing]]
id = "cache_torn"
label_key = "action_cache_torn"
costs = [{ store = "cache_torn", items_per_hour = 3 }, { store = "smoked", items_per_hour = 3 }]

# P4: twelve stages of the same take, charwood the walks' (no beams: finite pools). Its last stage is week five's B22;
# stage 1 is I7. Run by its order card, so no stage is queued (D-119).
[[cards]]
id = "post"
only_player = "project"
presentation = "craft"
label_key = "c_post"
upside_key = "up_post"
work_s = 2400
cap = 12
inputs = [
  { store = "charwood", items = 10 },
  { store = "cleared", items = 6 },
  { store = "stakes", items = 4 },
  { store = "stones", items = 3 },
  { store = "cord", items = 2 },
]

# "When charwood reaches 10, build the post": passed over at the cap.
[[order_cards]]
store = "charwood"
tap_card = "post"
when = { test = "at_least", subject_kind = "store", id = "charwood", value = 10, release = 10 }
offered_after = { unlock_kind = "card", id = "post" }

# ---------- I7: the ring ----------

[[triggers]]
id = "t_post_ring"
when = { test = "at_least", subject_kind = "card_count", id = "post", value = 1 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "post_shown", value = 1 }]
outcome = { line_keys = ["l_post_ring_1", "l_post_ring_2"], unlocks = [{ unlock_kind = "feature", id = "ring_up" }] }

# ---------- O-book ----------

# Day twenty-four's morning. Either answer leaves the book's making on the tasks: the first queues it, the second only
# shows it, and tapping it later is the same as the first. What reads the book reads its finish, never the answer
# (D-162, gates_read_feature).
[[offers]]
id = "o_book"
text_key = "o_book"
askers = ["n13"]
gate = { test = "at_least", subject_kind = "store", id = "sorrel_clock", value = 24 }
line_keys = ["l_book_ask"]
gates_read_feature = ["book_given"]

[[offers.answers]]
id = "o_book_make"
label_key = "a_book_make"
cost_key = "a_book_make_cost"
[offers.answers.outcome]
line_keys = ["l_book_yes"]
unlocks = [{ unlock_kind = "card", id = "bind_book" }]
queues = ["bind_book"]

[[offers.answers]]
id = "o_book_later"
label_key = "a_book_later"
cost_key = "a_book_later_cost"
[offers.answers.outcome]
line_keys = ["l_book_no"]
unlocks = [{ unlock_kind = "card", id = "bind_book" }]

[[cards]]
id = "bind_book"
only_player = "story"
presentation = "craft"
label_key = "c_bind_book"
upside_key = "up_bind_book"
work_s = 1800
cap = 1
inputs = [{ store = "pelt", items = 2 }, { store = "cord", items = 2 }]
line_keys = ["l_book_given"]
[cards.finished]
unlocks = [{ unlock_kind = "feature", id = "book_given" }]

# ---------- SL32: the second working ----------

# Moving the air, not heat: like into like, the stream's run into the air over the racks, so the tithe is small. A
# second cure for the film beside the wash: the player's time against a lane's.
[[triggers]]
id = "t_stir"
when = { test = "at_least", subject_kind = "store", id = "still_clock", value = 44 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "chip", id = "ashed", value = 1 }]
