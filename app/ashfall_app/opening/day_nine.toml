# Day nine: B9 through E1-E3, SL17 and SL18 to B10, the palisade's last stage and a save-time floor, as data merged
# after day_eight.toml (schema.Chapter, chapters.merge). Story spoilers: never shown to the owner. Spec:
# content/team/week-two.md, "Day nine"; numbers: content/team/week-two-numbers.md.
version = 1
end_feature = "skin_post"

# ---------- the chapter's clock ----------

# Never drawn: game hours since B9, for the chapter's steps. Opened on B9's feature, as the season's clock is on the
# turn's.
[[stores]]
id = "b9_clock"
label_key = "store_b9_clock"
cap_items = 8760
hidden = true

[[standing]]
id = "b9_clock"
label_key = "action_b9_clock"
makes = [{ store = "b9_clock", items_per_hour = 1 }]

[[triggers]]
id = "t_b9_clock"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "b9", value = 1 }
outcome = { unlocks = [{ unlock_kind = "action", id = "b9_clock" }] }

# E1: two hours after B9.
[[triggers]]
id = "t_ring"
when = { test = "at_least", subject_kind = "store", id = "b9_clock", value = 2 }
outcome = { line_keys = ["l_ring_1", "l_ring_2"] }

# ---------- the pack's step ----------

# The pack's ramp step on the season's clock (combat's ramp idiom), at 208 h on every route. Not on r1_clock: the card
# that opens combat unlocks its standing, so the ramp check counts it as made by a card.
[[triggers]]
id = "t_pack_step"
when = { test = "at_least", subject_kind = "store", id = "drift_clock", value = 40 }
outcome = { modifiers = [{ target = "threat", id = "wolf_pack", kind = "add_bp", amount_bp = 2500, source = "t_pack_step" }] }

# ---------- SL18: the gap fire ----------

# Five hours after B9 (E1 + 3 h). Its stones are the palisade's: the comfort against the build.
[[triggers]]
id = "t_gap_fire"
when = { test = "at_least", subject_kind = "store", id = "b9_clock", value = 5 }
outcome = { line_keys = ["l_gap_fire_1"], unlocks = [{ unlock_kind = "card", id = "gap_fire" }] }

[[cards]]
id = "gap_fire"
presentation = "craft"
label_key = "c_gap_fire"
upside_key = "up_gap_fire"
work_s = 1200
cap = 2
inputs = [{ store = "dry_wood", items = 6 }, { store = "stones", items = 8 }]
line_keys = ["l_gap_fire_2", "l_gap_fire_done"]
[cards.finished]
modifiers = [{ target = "side", id = "gap", kind = "add_bp", amount_bp = 2500, source = "gap_fire" }]

# Run by its order card, as hide_flaps is, so no stage is queued (one queue entry a stage let a babysitter land it
# ahead of a player who queues).
[[order_cards]]
store = "stones"
tap_card = "gap_fire"
when = { test = "at_least", subject_kind = "store", id = "stones", value = 8, release = 8 }
offered_after = { unlock_kind = "card", id = "gap_fire" }

# ---------- SL17: old wire on the track ----------

# Seven hours after B9, two after the gap fire is shown; the wire it brings is the fourth snare's.
[[triggers]]
id = "t_old_wire"
when = { test = "at_least", subject_kind = "store", id = "b9_clock", value = 7 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "card", id = "gap_fire", value = 1 }]
outcome = { line_keys = ["l_old_wire"], stores = [{ store = "wire", items = 2 }], unlocks = [{ unlock_kind = "card", id = "set_snare_4" }] }

[[cards]]
id = "set_snare_4"
presentation = "narrative"
label_key = "c_set_snare_4"
work_s = 600
cap = 1
inputs = [{ store = "wire", items = 2 }, { store = "dry_wood", items = 2 }]
[cards.finished]
line_keys = ["l_snare_4"]
unlocks = [{ unlock_kind = "action", id = "snare_4" }]

[[standing]]
id = "snare_4"
label_key = "action_snare"
makes = [{ store = "catch", items_per_hour = 1 }]

# ---------- E2: the open side ----------

# Half the ring up, once the gap fire burns (its first stage, so a visit after SL18 has passed) or a day after B9 for a
# camp that never lights it: the visitor's idiom, a drain on the rack and the pelts with its own clock store, an hour
# long, each store its own strip so one dry store never holds the other's. The strip's clock standing is what the two
# gates unlock: it moves only its own unshown store, so it opens nothing to see, and requires reads unlocks.
[[triggers]]
id = "t_open_side_lit"
when = { test = "at_least", subject_kind = "card_count", id = "gap_fire", value = 1 }
outcome = { unlocks = [{ unlock_kind = "action", id = "e2_clock" }] }

[[triggers]]
id = "t_open_side_late"
when = { test = "at_least", subject_kind = "store", id = "b9_clock", value = 24 }
outcome = { unlocks = [{ unlock_kind = "action", id = "e2_clock" }] }

[[triggers]]
id = "t_open_side"
when = { test = "at_least", subject_kind = "card_count", id = "palisade", value = 6 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "action", id = "e2_clock", value = 1 }]
[triggers.outcome]
line_keys = ["l_open_side_1", "l_open_side_2"]
stores = [{ store = "e2_clock", items = 12 }]
unlocks = [
  { unlock_kind = "action", id = "e2_clock" },
  { unlock_kind = "action", id = "e2_strip" },
  { unlock_kind = "action", id = "e2_strip_pelt" },
  { unlock_kind = "action", id = "ask_wait" },
]

# Never drawn: the strip's hour, 12 an hour while all three run.
[[stores]]
id = "e2_clock"
label_key = "store_e2_clock"
cap_items = 12
hidden = true

[[standing]]
id = "e2_clock"
label_key = "action_e2_clock"
costs = [{ store = "e2_clock", items_per_hour = 10 }]

[[standing]]
id = "e2_strip"
label_key = "action_e2_strip"
costs = [{ store = "smoked", items_per_hour = 6 }, { store = "e2_clock", items_per_hour = 1 }]

[[standing]]
id = "e2_strip_pelt"
label_key = "action_e2_strip"
costs = [{ store = "pelt", items_per_hour = 1 }, { store = "e2_clock", items_per_hour = 1 }]

# ---------- the season's second chore: the wind at the hides ----------

# The wind blows from the season's turn to its end: a pool the turn fills, drawn an hour at a time, as day eight's
# ashfall draws drift_left (day eight has shipped, so the wind is this chapter's own standing).
[[triggers]]
id = "t_wind_rises"
season = true
when = { test = "after_time", value = 604800 }
outcome = { stores = [{ store = "wind_left", items = 168 }], unlocks = [{ unlock_kind = "action", id = "wind" }] }

# Never drawn: the season's hours of wind left.
[[stores]]
id = "wind_left"
label_key = "store_wind_left"
cap_items = 168
hidden = true

# Never drawn but by its cures: what the wind has torn loose, the face of the chip below.
[[stores]]
id = "wind_torn"
label_key = "store_wind_torn"
cap_items = 18

[[standing]]
id = "wind"
label_key = "action_wind"
costs = [{ store = "wind_left", items_per_hour = 1 }]
makes = [{ store = "wind_torn", items_per_hour = 1 }]

# The wind tears the flaps loose: pegging them again takes pelts, and stones to weigh the hems, by hand or by a rule
# on n1's lane; left undone, the bays are draughty, a rest cost that stays small. Shown when it is due, on the season's
# clock: the torn flaps are past the chip's 12 by then, so the chore and its rule arrive together, the same hour on
# every route.
[[triggers]]
id = "t_wind"
when = { test = "at_least", subject_kind = "store", id = "drift_clock", value = 23 }
outcome = { line_keys = ["l_wind"], unlocks = [{ unlock_kind = "chip", id = "draughty" }, { unlock_kind = "card", id = "peg_flaps" }, { unlock_kind = "card", id = "n1_peg_flaps" }] }

[[chips]]
id = "draughty"
label_key = "chip_draughty"
tone = "cold"
when = { test = "at_least", subject_kind = "store", id = "wind_torn", value = 12 }
effects = [{ target = "rate", id = "rest", flow = "make", store = "energy", kind = "mul_bp", amount_bp = 9000, source = "draughty" }]
cost_key = "chip_draughty_cost"
on_line_key = "l_draughty"
off_line_key = "l_draughty_off"

[[cards]]
id = "peg_flaps"
presentation = "action"
label_key = "c_peg_flaps"
work_s = 120
inputs = [{ store = "wind_torn", items = 12 }, { store = "pelt", items = 3 }, { store = "stones", items = 4 }]

[[cards]]
id = "n1_peg_flaps"
lane = "n1"
presentation = "action"
label_key = "c_n1_peg_flaps"
work_s = 1200
inputs = [{ store = "wind_torn", items = 12 }, { store = "pelt", items = 3 }, { store = "stones", items = 4 }]

# "When draughty, {n1} pegs the flaps again": the chore's suggested rule (ash_laden's shape on her lane).
[[order_cards]]
store = "wind_torn"
tap_card = "n1_peg_flaps"
chip = "draughty"
when = { test = "at_least", subject_kind = "store", id = "wind_torn", value = 12 }
offered_after = { unlock_kind = "card", id = "n1_peg_flaps" }

# ---------- E3 ----------

[[triggers]]
id = "t_smoke"
when = { test = "at_least", subject_kind = "card_count", id = "palisade", value = 9 }
outcome = { line_keys = ["l_road_smoke_1", "l_road_smoke_2"] }

