# Day nineteen: from B16 (the empty place) through T10, T11, SL28 and B17 (the road over the top) to T13, the end of
# story day 21 and of week three, as data merged after day_eighteen.toml (schema.Chapter, chapters.merge). Story
# spoilers: never shown to the owner. Spec: content/team/week-three.md, "Day nineteen"; numbers:
# content/team/week-three-numbers.md.
version = 1
end_feature = "week_three_end"

# ---------- the road over the top ----------

# The road's ten stretches top the ridge; these take it over and down the far side, the chapter's long goal (D-149).
# Shown the morning after the fifteenth arrival, so its stretches and their beats come after B16 on every route, and
# laid by its own order card. Each stretch takes three of the road's: the bed is rock and roots past the top, and the
# cleared bed ahead holds twice what it did so a stretch's worth can be banked. His rule moves over to it, first out as
# before, and is passed over once the last stretch is laid.
[[triggers]]
id = "t_over_shown"
when = { test = "at_least", subject_kind = "card_count", id = "cut_road", value = 10 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "place_empty", value = 1 }]
[triggers.outcome]
line_keys = ["l_over_shown"]
unlocks = [{ unlock_kind = "card", id = "cut_over" }, { unlock_kind = "card", id = "n11_first_over" }]
modifiers = [{ target = "cap", id = "cleared", kind = "mul_bp", amount_bp = 20000, source = "t_over_shown" }]
orders = [{ tap_card = "n11_first_over", first = true }]

[[cards]]
id = "cut_over"
only_player = "project"
presentation = "craft"
label_key = "c_cut_over"
upside_key = "up_cut_over"
work_s = 2400
cap = 6
inputs = [
  { store = "cleared", items = 36 },
  { store = "stones", items = 10 },
  { store = "stakes", items = 4 },
  { store = "cord", items = 2 },
]

# "When the road's bed reaches 36, lay a stretch over the top": passed over at the cap.
[[order_cards]]
store = "cleared"
tap_card = "cut_over"
when = { test = "at_least", subject_kind = "store", id = "cleared", value = 36, release = 36 }
offered_after = { unlock_kind = "card", id = "cut_over" }

[[cards]]
id = "n11_first_over"
lane = "n11"
twin_of = "shovel_road"
presentation = "action"
label_key = "c_n11_first_over"
work_s = 1800
requires = [{ test = "at_most", subject_kind = "card_count", id = "cut_over", value = 5 }]
outcome = { stores = [{ store = "cleared", items = 1 }, { store = "damp_wood", items = 1 }] }

# ---------- T10: the far hills ----------

[[triggers]]
id = "t_far_hills"
when = { test = "at_least", subject_kind = "card_count", id = "cut_over", value = 1 }
outcome = { line_keys = ["l_far_hills_1", "l_far_hills_2"] }

# ---------- T11 and SL28: a stretch a day ----------

# Never drawn: game hours since T11, for SL28.
[[stores]]
id = "cut_night_clock"
label_key = "store_cut_night_clock"
cap_items = 8760
hidden = true

[[standing]]
id = "cut_night_clock"
label_key = "action_cut_night_clock"
makes = [{ store = "cut_night_clock", items_per_hour = 1 }]

[[triggers]]
id = "t_cut_night"
when = { test = "at_least", subject_kind = "card_count", id = "cut_over", value = 3 }
outcome = { line_keys = ["l_cut_night_1", "l_cut_night_2"], unlocks = [{ unlock_kind = "action", id = "cut_night_clock" }] }

# SL28, four hours on: his sister's cloth on his marker stakes. A one-off on her lane, two pelts, the stretches still to
# lay a quarter quicker for the hands.
[[triggers]]
id = "t_cloth"
when = { test = "at_least", subject_kind = "store", id = "cut_night_clock", value = 4 }
outcome = { line_keys = ["l_cloth_1", "l_cloth_2"], unlocks = [{ unlock_kind = "card", id = "road_cloths" }] }

[[cards]]
id = "road_cloths"
lane = "n12"
presentation = "craft"
label_key = "c_road_cloths"
upside_key = "up_road_cloths"
work_s = 1800
cap = 1
inputs = [{ store = "pelt", items = 2 }]
outcome = { modifiers = [{ target = "work", id = "cut_over", kind = "mul_bp", amount_bp = 12500, source = "road_cloths" }] }

# ---------- B17: the last stretch ----------

# Never drawn: game hours since B17, for T12, and R2's days for week four's gates (D-138).
[[stores]]
id = "b17_clock"
label_key = "store_b17_clock"
cap_items = 8760
hidden = true

[[standing]]
id = "b17_clock"
label_key = "action_b17_clock"
makes = [{ store = "b17_clock", items_per_hour = 1 }]

[[stores]]
id = "r2_clock"
label_key = "store_r2_clock"
cap_items = 8760
hidden = true

[[standing]]
id = "r2_clock"
label_key = "action_r2_clock"
makes = [{ store = "r2_clock", items_per_hour = 1 }]

# B17's sharp floor (389 h: week-three-numbers.md, "Landing bands"), as a hidden clock's latch (day_eighteen.toml's
# starer_floor): machinery, no moment of its own.
[[stores]]
id = "b17_floor"
label_key = "store_b17_floor"
cap_items = 1
hidden = true

[[standing]]
id = "b17_floor"
label_key = "action_b17_floor"
makes = [{ store = "b17_floor", items_per_hour = 1 }]

[[triggers]]
id = "t_floor_b17"
when = { test = "after_time", value = 1400400 }
outcome = { unlocks = [{ unlock_kind = "action", id = "b17_floor" }] }

# The last stretch laid, after B16, past the floor. He leaves
# the town at that instant (plan item 4), his eating with him; the next region opens, and the map with it.
[[triggers]]
id = "t_b17"
when = { test = "at_least", subject_kind = "card_count", id = "cut_over", value = 6 }
requires = [
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "place_empty", value = 1 },
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "action", id = "b17_floor", value = 1 },
]
[triggers.outcome]
line_keys = ["l_b17_1", "l_b17_2", "l_b17_3", "l_b17_4", "l_b17_5"]
unlocks = [
  { unlock_kind = "feature", id = "r2_open" },
  { unlock_kind = "action", id = "r2_clock" },
  { unlock_kind = "action", id = "b17_clock" },
]
leaves = [{ lane = "n11", stops = ["n11_eating"] }]

# ---------- T12: the lamp ----------

[[triggers]]
id = "t_lamp_out"
when = { test = "at_least", subject_kind = "store", id = "b17_clock", value = 4 }
outcome = { line_keys = ["l_lamp_out_1", "l_lamp_out_2"], unlocks = [{ unlock_kind = "feature", id = "lamp_out" }, { unlock_kind = "card", id = "sit_road_end" }] }

# ---------- night 21 and T13 ----------

# Dusk 21 at 498 h on the calendar, a hidden clock the scene's night grade reads, so it opens nothing to see.
[[stores]]
id = "night_21"
label_key = "store_night_21"
cap_items = 20
hidden = true
clock = "night"

[[standing]]
id = "night_21"
label_key = "action_night_21"
makes = [{ store = "night_21", items_per_hour = 20 }]

[[triggers]]
id = "t_night_21"
when = { test = "after_time", value = 1792800 }
outcome = { line_keys = ["l_night_21"], unlocks = [{ unlock_kind = "action", id = "night_21" }] }

# A38, an hour into night 21 on the season's clock (B13 at 336 h on every route); T12 opens it, and its require reads
# the clock itself, so its countdown shows from T12 (week two's A32).
[[cards]]
id = "sit_road_end"
only_player = "story"
presentation = "narrative"
label_key = "c_sit_road_end"
work_s = 5
cap = 1
glows = true
requires = [{ test = "at_least", subject_kind = "store", id = "clear_clock", value = 163 }]

# T13: the night sat; week three's last beat, the chapter's end feature.
[[triggers]]
id = "t_t13"
when = { test = "at_least", subject_kind = "card_count", id = "sit_road_end", value = 1 }
outcome = { line_keys = ["l_t13_1", "l_t13_2", "l_t13_3", "l_t13_4"], unlocks = [{ unlock_kind = "feature", id = "week_three_end" }] }

# ---------- the Camp ----------

# Lifted by the road's last stretch over the top.
[[camp_levels]]
at_items = 4200000
pays_key = "camp_pays_18"
pays_from = 48
pays_to = 72
held = true
lifted_by = ["cut_over"]
line_keys = ["l_camp_18"]
modifiers = [{ target = "cap", id = "cleared", kind = "mul_bp", amount_bp = 15000, source = "camp_18" }]

# Held at a "?" past week three's content, a goal on screen.
[[camp_levels]]
at_items = 5100000
pays_key = "pays_unknown"
held = true

# ---------- the map ----------

# The map's first sheet (api/CONTRACT.txt, "MAP"), drawn from B17: the ridge the road goes over, north of the town, and
# the hills past it, unnamed.
[[places]]
id = "p_ridge"
stamp = "mountain"
at = [0, 2]
reveal = { unlock_kind = "feature", id = "r2_open" }
label_key = "place_ridge"

[[places]]
id = "p_far_hills"
stamp = "range"
at = [1, 5]
reveal = { unlock_kind = "feature", id = "r2_open" }

# ---------- aims ----------

[[aims]]
id = "aim_past_ridge"
text_key = "aim_past_ridge"
after = { unlock_kind = "feature", id = "r2_open" }

# ---------- the journal ----------

[[subjects]]
id = "s_b17"
kind = "beat"
source = { source_kind = "trigger", id = "t_b17" }
