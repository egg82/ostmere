# ---------- the fifteenth arrival ----------

# The tier's count at 56, the pair joined, past the floor: he comes in and sits down, an arrival with no lane (B10's
# stranger), no offer and nothing asked. His clock starts.
[[triggers]]
id = "t_starer"
when = { test = "at_least", subject_kind = "store", id = "meals", value = 56 }
requires = [
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "answered", id = "o_cutter", value = 1 },
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "action", id = "starer_floor", value = 1 },
]
outcome = { line_keys = ["l_starer_in"], stores = [{ store = "arrivals", items = 1 }], unlocks = [{ unlock_kind = "action", id = "starer_clock" }] }

# ---------- B16: the empty place ----------

# The morning after: eight hours on his clock. He is the fifteenth (beats.yaml's arrivals 15): his trigger waits on the
# pair, who wait on the three. Nothing in the numbers changes: the snares are re-tied, not set.
[[triggers]]
id = "t_b16"
when = { test = "at_least", subject_kind = "store", id = "starer_clock", value = 8 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "belonging", value = 1 }]
outcome = { line_keys = ["l_b16_1", "l_b16_2", "l_b16_3"], unlocks = [{ unlock_kind = "feature", id = "place_empty" }] }

