# Never drawn: game hours since the fifteenth arrival sat down, for B16.
[[stores]]
id = "starer_clock"
label_key = "store_starer_clock"
cap_items = 8760
hidden = true

[[standing]]
id = "starer_clock"
label_key = "action_starer_clock"
makes = [{ store = "starer_clock", items_per_hour = 1 }]

# B16's sharp floor (week-three-numbers.md, "Landing bands"): the fifteenth arrival never sits down before 369 h of save
# time, so B16 never lands before 377 h.
# A latch, never drawn: a hidden clock started once save time passes 369 h, so an offer or trigger can wait on it beside
# a store condition (a requirement reads only an unlock). A hidden clock, not a feature, so it is machinery and no
# moment of its own.
[[stores]]
id = "starer_floor"
label_key = "store_starer_floor"
cap_items = 1
hidden = true

[[standing]]
id = "starer_floor"
label_key = "action_starer_floor"
makes = [{ store = "starer_floor", items_per_hour = 1 }]

[[triggers]]
id = "t_starer_floor_clock"
when = { test = "after_time", value = 1328400 }
outcome = { unlocks = [{ unlock_kind = "action", id = "starer_floor" }] }

# ---------- SL27: the first working ----------

[[triggers]]
id = "t_first_working"
when = { test = "at_least", subject_kind = "card_count", id = "warm_beds", value = 1 }
outcome = { line_keys = ["l_first_working_1", "l_first_working_2"] }

# ---------- the kind of ask the arrivals are ----------

# Where a newcomer goes to work first: the food or the building. Not the arrival kind (day three's), whose roles ask who
# builds a newcomer's room; the hall houses these. A rule set on the first answers every later ask of the kind, so an
# arrival the table draws while the player is away starts work at once. Either answer is a share in the town's split,
# changed there at any time.
[[offer_kinds]]
kind = "work"
roles = [{ role = "food", label_key = "k_work_food" }, { role = "build", label_key = "k_work_build" }]

# ---------- T7 and O-choir: three at the door ----------

# The tier's count reaches 24 meals, two hours past B15, once the road is found (the "build" answer's work is clearing
# it). All three join on either answer, each at a whole share: reaping the beds, or clearing the road's bed. The table
# feeds three more, a smoked an hour (week-three.md, "The table"). What the answer keeps is where they sing at their
# work: the beds grow a quarter faster for good, or all the road's clearing goes a quarter faster for good (D-146).
[[offers]]
id = "o_choir"
text_key = "o_choir"
kind = "work"
gate = { test = "at_least", subject_kind = "store", id = "meals", value = 24 }
requires = [
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "action", id = "b15_2h", value = 1 },
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "road_marked", value = 1 },
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "action", id = "beds", value = 1 },
]
line_keys = ["l_choir_1", "l_choir_2"]

[[offers.answers]]
id = "o_choir_beds"
label_key = "a_choir_beds"
cost_key = "a_choir_beds_cost"
role = "food"
[offers.answers.outcome]
line_keys = ["l_choir_beds"]
stores = [{ store = "arrivals", items = 3 }]
unlocks = [
  { unlock_kind = "card", id = "n8_reap" },
  { unlock_kind = "card", id = "n9_reap" },
  { unlock_kind = "card", id = "n10_reap" },
]
joins = [
  { lane = "n8", mix = "town:camp", card = "n8_reap", own_split = true },
  { lane = "n9", mix = "town:camp", card = "n9_reap", own_split = true },
  { lane = "n10", mix = "town:camp", card = "n10_reap", own_split = true },
]
modifiers = [
  { target = "rate", id = "beds", flow = "make", store = "ripe", kind = "mul_bp", amount_bp = 12500, source = "o_choir_beds" },
  { target = "rate", id = "table", flow = "cost", store = "smoked", kind = "add_bp", amount_bp = 5000, source = "o_choir_beds" },
]

[[offers.answers]]
