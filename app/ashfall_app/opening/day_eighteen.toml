# Day eighteen: from B15 (the field stone) through SL27, T7-T9 and the arrivals the table draws to B16 (the empty
# place), as data merged after day_sixteen.toml (schema.Chapter, chapters.merge). Story spoilers: never shown to the
# owner. Spec: content/team/week-three.md, "Day eighteen"; numbers: content/team/week-three-numbers.md.
version = 1
end_feature = "place_empty"

# ---------- clocks ----------

# Never drawn: game hours since B15, for O-choir's moment.
[[stores]]
id = "b15_clock"
label_key = "store_b15_clock"
cap_items = 8760
hidden = true

[[standing]]
id = "b15_clock"
label_key = "action_b15_clock"
makes = [{ store = "b15_clock", items_per_hour = 1 }]

[[triggers]]
id = "t_b15_clock"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "spellcraft", value = 1 }
outcome = { unlocks = [{ unlock_kind = "action", id = "b15_clock" }] }

# The count of who has come held 10 since day three; the table draws a fifteenth, so from the roof on it holds 20.
# A latch, never drawn: a hidden clock started once B15's clock reaches 2 h, so an offer or trigger can wait on it
# beside a store condition (a requirement reads only an unlock). A hidden clock, not a feature, so it is machinery and
# no moment of its own.
[[stores]]
id = "b15_2h"
label_key = "store_b15_2h"
cap_items = 1
hidden = true

[[standing]]
id = "b15_2h"
label_key = "action_b15_2h"
makes = [{ store = "b15_2h", items_per_hour = 1 }]

[[triggers]]
id = "t_b15_2h_clock"
when = { test = "at_least", subject_kind = "store", id = "b15_clock", value = 2 }
outcome = { unlocks = [{ unlock_kind = "action", id = "b15_2h" }] }

[[triggers]]
id = "t_hall_count"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "belonging", value = 1 }
outcome = { modifiers = [{ target = "cap", id = "arrivals", kind = "mul_bp", amount_bp = 20000, source = "t_hall_count" }] }

# Never drawn: game hours since the three joined, for T8 and O-cutter.
[[stores]]
id = "choir_clock"
label_key = "store_choir_clock"
cap_items = 8760
hidden = true

[[standing]]
id = "choir_clock"
label_key = "action_choir_clock"
makes = [{ store = "choir_clock", items_per_hour = 1 }]

# A latch, never drawn: a hidden clock started once the three have been in six hours, so an offer or trigger can wait on
# it beside a store condition (a requirement reads only an unlock). A hidden clock, not a feature, so it is machinery
# and no moment of its own.
[[stores]]
