# Day five: from B6 through story day 6 (morning 6, the ridge, the pair, dusk 6) to night 6, B7's eve, as data merged
# after day_four.toml (schema.Chapter, chapters.merge). Story spoilers: never shown to the owner. Spec:
# content/team/days-four-to-seven.md, "Day five"; numbers: content/team/days-four-to-seven-numbers.md. In
# schema.IN_WRITING until its lines are written (days-four-to-seven plan, item 8). B7 and A29 are b7.toml's.
version = 1
end_feature = "night_6"

# ---------- Arcana's cards ----------

# On the cards with B6 (feature arcana, A21's finish), so a save past B6 at the rebase has it with full stores.
[[triggers]]
id = "t_stone_open"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "arcana", value = 1 }
outcome = { unlocks = [{ unlock_kind = "card", id = "hand_on_stone" }, { unlock_kind = "card", id = "hearth_stones" }] }

# The first of the skill: damp wood into dry by the stone's heat, uncapped, run in the mix (the page's mix offer on
# the full line), so it drinks the damp wood the hands make, as the track does. A run takes much and gives little:
# little drinks dry wood in week 1 (fire and watch fires), so a richer yield only overflows its cap; Arcana's XP is
# sized for its small share (Arcana 4 about M1).
[[cards]]
id = "hand_on_stone"
presentation = "action"
label_key = "c_hand_on_stone"
work_s = 20
skill = "arcana"
xp_per_hour = 60
glows = true
inputs = [{ store = "damp_wood", items = 18 }]
outcome = { stores = [{ store = "dry_wood", items = 1 }] }

# The track's takes follow what the camp makes (day_three.toml, field_track): from B6 the stone drinks the damp wood
# and the track draws on stones, and from M1 a third forager brings roots, so its roots take rises twice.
[[triggers]]
id = "t_track_roots"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "arcana", value = 1 }
outcome = { modifiers = [{ target = "rate", id = "field_track", flow = "cost", store = "roots", kind = "mul_bp", amount_bp = 20000, source = "track_roots" }] }

[[triggers]]
id = "t_track_roots_2"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "pair_joined", value = 1 }
outcome = { modifiers = [{ target = "rate", id = "field_track", flow = "cost", store = "roots", kind = "mul_bp", amount_bp = 15000, source = "track_roots_2" }] }

[[triggers]]
id = "t_stone_first"
when = { test = "at_least", subject_kind = "card_count", id = "hand_on_stone", value = 1 }
outcome = { line_keys = ["l_stone_first"] }

# Hot stones into the pot: staged on the hands, queued When ready, on the cards with B6 and needing Arcana 4 (its
# level's marker says so; a level never opens a card: decisions.md, "No gate counts taps"). The last stage makes a pot
# four stew, after the clay hearth's three.
[[cards]]
id = "hearth_stones"
presentation = "craft"
label_key = "c_hearth_stones"
upside_key = "up_hearth_stones"
work_s = 1800
cap = 3
skill = "arcana"
xp_per_hour = 10
requires = [{ test = "at_least", subject_kind = "skill_level", id = "arcana", value = 4 }]
inputs = [{ store = "stones", items = 12 }, { store = "clay", items = 4 }]
line_keys = ["l_stones_1", "l_stones_2", "l_stones_done"]
[cards.finished]
modifiers = [{ target = "rate", id = "stew", flow = "make", store = "stew", kind = "add_bp", amount_bp = 5000, source = "hearth_stones" }]

# ---------- Arcana's levels ----------

# Each pay aims at another lane; speed levels pay the skill's own cards a tenth faster. The stone's card is on the
# hands, so the mix drives Arcana and its row is marked to the curve's top: from 9 each level a tenth faster, as
# Cooking's from 11 (day_three.toml). Week 2 adds its pays beside them, each its own trigger.
[[skill_levels]]
skill = "arcana"
levels = [
  { level = 2, pays_key = "pays_drying_wall" },
  { level = 3, pays_key = "pays_arc_faster" },
  { level = 4, pays_key = "pays_hearth_stones" },
  { level = 5, pays_key = "pays_dry_kindling" },
  { level = 6, pays_key = "pays_stone_smoke" },
  { level = 7, pays_key = "pays_arc_faster" },
  { level = 8, pays_key = "pays_arc_faster" },
  { level = 9, pays_key = "pays_arc_faster" },
  { level = 10, pays_key = "pays_arc_faster" },
  { level = 11, pays_key = "pays_arc_faster" },
  { level = 12, pays_key = "pays_arc_faster" },
  { level = 13, pays_key = "pays_arc_faster" },
  { level = 14, pays_key = "pays_arc_faster" },
  { level = 15, pays_key = "pays_arc_faster" },
  { level = 16, pays_key = "pays_arc_faster" },
  { level = 17, pays_key = "pays_arc_faster" },
  { level = 18, pays_key = "pays_arc_faster" },
  { level = 19, pays_key = "pays_arc_faster" },
  { level = 20, pays_key = "pays_arc_faster" },
  { level = 21, pays_key = "pays_arc_faster" },
  { level = 22, pays_key = "pays_arc_faster" },
  { level = 23, pays_key = "pays_arc_faster" },
  { level = 24, pays_key = "pays_arc_faster" },
