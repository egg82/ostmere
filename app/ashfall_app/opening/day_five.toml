# Day five: from B6 through story day 6 (morning 6, the ridge, the pair, dusk 6) to night 6, B7's eve, as data merged
# after day_four.toml (schema.Chapter, chapters.merge). Story spoilers: never shown to the owner. Spec:
# content/team/days-four-to-seven.md, "Day five"; numbers: content/team/days-four-to-seven-numbers.md. In
# schema.IN_WRITING until its lines are written (days-four-to-seven plan, item 8). B7 and A29 are b7.toml's.
version = 1
end_feature = "night_6"

# ---------- Arcana's cards ----------

# On the cards with B6 (feature arcana, A21's finish), so a save past B6 at the rebase has it with full stores.
[[triggers]]
id = "t_stone_open"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "arcana", value = 1 }
outcome = { unlocks = [{ unlock_kind = "card", id = "hand_on_stone" }, { unlock_kind = "card", id = "hearth_stones" }] }

# The first of the skill: damp wood into dry by the stone's heat, uncapped, run in the mix (the page's mix offer on
# the full line), so it drinks the damp wood the hands make, as the track does. A run takes much and gives little:
# little drinks dry wood in week 1 (fire and watch fires), so a richer yield only overflows its cap; Arcana's XP is
# sized for its small share (Arcana 4 about M1).
[[cards]]
id = "hand_on_stone"
only_player = "magic"
presentation = "action"
label_key = "c_hand_on_stone"
upside_key = "up_stone_dry"
work_s = 20
skill = "arcana"
xp_per_hour = 60
glows = true
inputs = [{ store = "damp_wood", items = 18 }]
outcome = { stores = [{ store = "dry_wood", items = 1 }] }

# The track's takes follow what the camp makes (day_three.toml, field_track): from B6 the stone drinks the damp wood
# and the track draws on stones, and from M1 a third forager brings roots, so its roots take rises twice.
[[triggers]]
id = "t_track_roots"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "arcana", value = 1 }
outcome = { modifiers = [{ target = "rate", id = "field_track", flow = "cost", store = "roots", kind = "mul_bp", amount_bp = 20000, source = "track_roots" }] }

[[triggers]]
id = "t_track_roots_2"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "pair_joined", value = 1 }
outcome = { modifiers = [{ target = "rate", id = "field_track", flow = "cost", store = "roots", kind = "mul_bp", amount_bp = 15000, source = "track_roots_2" }] }

# The stone fills dry_wood faster than the fire and the watch take it, so a day away from day four's end lost over half
# its making to the cap: the pile room comes to 2x with the stone.
[[triggers]]
id = "t_stone_pile"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "arcana", value = 1 }
outcome = { modifiers = [{ target = "cap", id = "dry_wood", kind = "mul_bp", amount_bp = 20000, source = "stone_pile" }] }

[[triggers]]
id = "t_stone_first"
when = { test = "at_least", subject_kind = "card_count", id = "hand_on_stone", value = 1 }
outcome = { line_keys = ["l_stone_first"] }

# Scavenging on her lane once the pair join (day_three.toml's town card; his leg rules it out).
[[triggers]]
id = "t_town_scavenge"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "pair_joined", value = 1 }
[triggers.outcome]
unlocks = [
  { unlock_kind = "card", id = "n3_scavenge" },
]

# ---------- stones' sink: the windbreak ----------

# A reach stake on the hearth's lane (issue #40), the cordwood shape: scavenging in the hands' mix makes more stones than
# the track takes from here to week two's end. Shown when the pair join (five round the fire), its own moment. Its order
# card comes on with stones full (cap 18 for certain once warm_ground is in, hence the requires), so it takes only what
# would overflow. Off the hands and never in the mix, so the track's share is set as before. A run takes 6, never more:
# it draws over its bar beside any tap that needs stones, and while the hands tap nothing makes them, so the 12 it leaves
# must cover a tap's whole need or that tap's drawn landing slips (a 12-stone lot did, under hearth_stones). 240 s a run
# keeps the absence runs fast enough.
[[triggers]]
id = "t_windbreak"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "pair_joined", value = 1 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "warm_ground", value = 1 }]
outcome = { unlocks = [{ unlock_kind = "card", id = "build_windbreak" }, { unlock_kind = "store", id = "windbreak" }] }

[[cards]]
id = "build_windbreak"
lane = "hearth"
presentation = "action"
label_key = "c_build_windbreak"
upside_key = "up_build_windbreak"
stake = "reach"
work_s = 240
inputs = [{ store = "stones", items = 6 }]
outcome = { stores = [{ store = "windbreak", items = 6 }] }

# Stacking stones is everyday work (decisions/people.md, "Who can do which job"): the hearth's card on a
# townsperson's lane at its takes and makes. His leg rules it out, as it does the digging; the family's copies
# unlock in day eleven.
[[town_cards]]
id = "{lane}_build_windbreak"
twin_of = "build_windbreak"
lanes = ["n1", "n2", "n3", "n5", "n6", "n7", "n8", "n9", "n10", "n11", "n12", "g_field"]
presentation = "action"
label_key = "c_build_windbreak"
upside_key = "up_build_windbreak"
stake = "reach"
work_s = 240
inputs = [{ store = "stones", items = 6 }]
outcome = { stores = [{ store = "windbreak", items = 6 }] }

[[triggers]]
id = "t_town_windbreak"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "card", id = "build_windbreak", value = 1 }
[triggers.outcome]
unlocks = [
  { unlock_kind = "card", id = "n1_build_windbreak" },
  { unlock_kind = "card", id = "n2_build_windbreak" },
  { unlock_kind = "card", id = "n3_build_windbreak" },
]

# Its cap is the last reach.
[[stores]]
id = "windbreak"
label_key = "store_windbreak"
cap_items = 18000

[[order_cards]]
store = "stones"
tap_card = "build_windbreak"
when = { test = "at_least", subject_kind = "store", id = "stones", value = 18, release = 18 }
offered_after = { unlock_kind = "card", id = "build_windbreak" }

[[triggers]]
id = "t_windbreak_1"
when = { test = "at_least", subject_kind = "store", id = "windbreak", value = 1000 }
outcome = { modifiers = [{ target = "rate", id = "chill", flow = "cost", store = "warmth", kind = "mul_bp", amount_bp = 9500, source = "windbreak_1" }] }

[[triggers]]
id = "t_windbreak_2"
when = { test = "at_least", subject_kind = "store", id = "windbreak", value = 2500 }
outcome = { modifiers = [{ target = "rate", id = "chill", flow = "cost", store = "warmth", kind = "mul_bp", amount_bp = 9500, source = "windbreak_2" }] }

[[triggers]]
id = "t_windbreak_3"
when = { test = "at_least", subject_kind = "store", id = "windbreak", value = 5000 }
outcome = { modifiers = [{ target = "rate", id = "chill", flow = "cost", store = "warmth", kind = "mul_bp", amount_bp = 9500, source = "windbreak_3" }] }

[[triggers]]
id = "t_windbreak_4"
when = { test = "at_least", subject_kind = "store", id = "windbreak", value = 8000 }
outcome = { modifiers = [{ target = "rate", id = "chill", flow = "cost", store = "warmth", kind = "mul_bp", amount_bp = 9500, source = "windbreak_4" }] }

[[triggers]]
id = "t_windbreak_5"
when = { test = "at_least", subject_kind = "store", id = "windbreak", value = 12000 }
outcome = { modifiers = [{ target = "rate", id = "chill", flow = "cost", store = "warmth", kind = "mul_bp", amount_bp = 9500, source = "windbreak_5" }] }

[[triggers]]
id = "t_windbreak_6"
when = { test = "at_least", subject_kind = "store", id = "windbreak", value = 18000 }
outcome = { modifiers = [{ target = "rate", id = "chill", flow = "cost", store = "warmth", kind = "mul_bp", amount_bp = 9500, source = "windbreak_6" }] }

# Hot stones into the pot: staged on the hands, queued When ready, on the cards with B6 and needing Arcana 4 (its
# level's marker says so). The last stage makes a pot four stew, after the clay hearth's three.
[[cards]]
id = "hearth_stones"
only_player = "magic"
presentation = "craft"
label_key = "c_hearth_stones"
upside_key = "up_hearth_stones"
work_s = 1800
cap = 3
skill = "arcana"
xp_per_hour = 10
requires = [{ test = "at_least", subject_kind = "skill_level", id = "arcana", value = 4 }]
inputs = [{ store = "stones", items = 12 }, { store = "clay", items = 4 }]
line_keys = ["l_stones_1", "l_stones_2", "l_stones_done"]
[cards.finished]
modifiers = [{ target = "rate", id = "stew", flow = "make", store = "stew", kind = "add_bp", amount_bp = 5000, source = "hearth_stones" }]

# ---------- Arcana's levels ----------

# Each pay aims at another lane; speed levels pay the skill's own cards a tenth faster. The stone's card is on the
# hands, so the mix drives Arcana and its row is marked to the curve's top: from 9 each level a tenth faster, as
# Cooking's from 11 (day_three.toml). Week 2 adds its pays beside them, each its own trigger.
[[skill_levels]]
skill = "arcana"
levels = [
  { level = 2, pays_key = "pays_drying_wall" },
  { level = 3, pays_key = "pays_arc_faster" },
