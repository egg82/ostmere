outcome = { unlocks = [{ unlock_kind = "action", id = "night_6" }] }

# ---------- O-pair, the second bay ----------

# O-pair's moment: morning 6, the camp's pot already feeding three. Never a level of stew, which only the stew card
# makes (decisions.md, "No gate counts taps"); stew 9 held at morning 6 on every route but one. Its own feature, so
# the aim can start at it.
[[triggers]]
id = "t_pair_offer"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "morning_6", value = 1 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "pair_offer" }] }

[[offers]]
id = "o_pair"
text_key = "o_pair"
gate = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "pair_offer", value = 1 }
line_keys = ["l_pair_1", "l_pair_2"]
kind = "arrival"

[[offers.answers]]
id = "o_pair_room"
label_key = "a_pair_room"
cost_key = "a_pair_room_cost"
role = "self"
[offers.answers.outcome]
line_keys = ["l_bay2_go"]
unlocks = [{ unlock_kind = "card", id = "make_bay2" }]
queues = ["make_bay2"]

[[offers.answers]]
id = "o_pair_hers"
label_key = "a_pair_hers"
cost_key = "a_pair_hers_cost"
role = "other"
[offers.answers.outcome]
