# Day thirty-one: from B23 (the pack called) through Y8 (the hall's raid and the latch), Y9 (the house and P5), O-burners,
# SL40, Y10, SL41, Y11 and Camp 20 to A43 and B24, week five's third chapter, as data merged after day_thirty.toml
# (schema.Chapter, chapters.merge). Story spoilers: never shown to the owner. Spec: content/team/week-five.md, "Day
# thirty-one"; numbers: content/team/week-five-numbers.md. Its moments run on day thirty's call_clock, from B23.
version = 1
end_feature = "house_woken"

# ---------- Y8: the hall's larder, the latch and the hall's raid ----------

# Six hours after the call. The larder is raided on its own two-hour drain that pauses at empty (the visitor's idiom),
# the same watched or not; from here the mourners raid the hall as well as the line, and the latch is what holds it.
[[triggers]]
id = "t_y8"
when = { test = "at_least", subject_kind = "store", id = "call_clock", value = 6 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "pack_called", value = 1 }]
[triggers.outcome]
line_keys = ["l_y8_1", "l_y8_2"]
stores = [{ store = "larder_torn", items = 6 }]
unlocks = [
  { unlock_kind = "feature", id = "larder_raided" },
  { unlock_kind = "action", id = "larder_torn" },
  { unlock_kind = "action", id = "raid_hall" },
  { unlock_kind = "feature", id = "combat" },
  { unlock_kind = "card", id = "iron_latch" },
]

# Never drawn but by its drain: the hams taken off the larder's hooks.
[[stores]]
id = "larder_torn"
label_key = "store_larder_torn"
cap_items = 6
hidden = true

[[standing]]
id = "larder_torn"
label_key = "action_larder_torn"
costs = [{ store = "larder_torn", items_per_hour = 3 }, { store = "smoked", items_per_hour = 3 }]

# The hall's larder: a side of its own, which the watch at the gap does not hold (they come over the roof).
[[sides]]
id = "latch"
label_key = "side_latch"
base = 20

[[stores]]
id = "hall_fought"
label_key = "store_hall_fought"
cap_items = 20000

[[stores]]
id = "hall_lost"
label_key = "store_hall_lost"
cap_items = 20000

[[standing]]
id = "raid_hall"
label_key = "action_raid_hall"
fight = { side = "latch", threat = "mourner", lost = "hall_lost", fought = "hall_fought", fights_per_hour = 1, loses = [{ store = "smoked", items = 1 }], won_line_keys = ["l_fight_hall_won_1", "l_fight_hall_won_2", "l_fight_hall_won_3", "l_fight_hall_won_4", "l_fight_hall_won_5", "l_fight_hall_won_6"], lost_line_keys = ["l_fight_hall_lost_1", "l_fight_hall_lost_2", "l_fight_hall_lost_3", "l_fight_hall_lost_4", "l_fight_hall_lost_5", "l_fight_hall_lost_6"] }

# The latch: a staged hands build run by its order card (D-119), its last stage a lasting hold on the larder's side
# (day twelve's lamps on the gap). Forged and fitted from what the town makes without end, so nothing finite feeds it.
[[cards]]
id = "iron_latch"
site = { layer = "larder_latch" }
only_player = "project"
presentation = "craft"
label_key = "c_iron_latch"
upside_key = "up_iron_latch"
work_s = 1800
cap = 4
inputs = [{ store = "stakes", items = 4 }, { store = "charwood", items = 2 }, { store = "cord", items = 1 }]
line_keys = ["l_latch_1", "l_latch_2", "l_latch_3", "l_latch_done"]
[cards.finished]
modifiers = [{ target = "side", id = "latch", kind = "add_bp", amount_bp = 20000, source = "iron_latch" }]

# "When stakes reach 16, work on the latch": stakes stand at their cap, so it is a sink that was waiting.
[[order_cards]]
store = "stakes"
tap_card = "iron_latch"
when = { test = "at_least", subject_kind = "store", id = "stakes", value = 16, release = 16 }
offered_after = { unlock_kind = "card", id = "iron_latch" }

# ---------- Y9: the house on the hill, and P5 ----------

# The first walk to the hill, a fact a requirement can read.
[[triggers]]
id = "t_hill_walked"
when = { test = "at_least", subject_kind = "store", id = "hill_trips", value = 1 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "hill_walked" }] }

# Ten hours after the call, once the hill has been walked: the house, and the town's work to clear it out.
[[triggers]]
id = "t_y9"
when = { test = "at_least", subject_kind = "store", id = "call_clock", value = 10 }
requires = [
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "pack_called", value = 1 },
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "hill_walked", value = 1 },
]
outcome = { line_keys = ["l_y9_1", "l_y9_2", "l_p5_shown"], unlocks = [{ unlock_kind = "feature", id = "house_found" }, { unlock_kind = "card", id = "waystation" }] }

# P5: eight stages, each eating at the post (D-212); stakes, not cord, which the town makes too slowly to feed it. Stage 3 is Y10; its last shows A43. Run by its order card.
[[cards]]
id = "waystation"
site = { no_site = "the house stands on the far hill, a walk from the post, off the scene" }
only_player = "project"
presentation = "craft"
label_key = "c_waystation"
upside_key = "up_waystation"
work_s = 3600
cap = 8
inputs = [
  { store = "charwood", items = 6 },
  { store = "stones", items = 4 },
  { store = "stakes", items = 2 },
  { store = "post_stores", items = 2 },
]

# "When the post's store reaches 2, work on the house": one stage's worth.
[[order_cards]]
store = "post_stores"
tap_card = "waystation"
when = { test = "at_least", subject_kind = "store", id = "post_stores", value = 2, release = 2 }
offered_after = { unlock_kind = "card", id = "waystation" }

[[triggers]]
id = "t_y10"
when = { test = "at_least", subject_kind = "card_count", id = "waystation", value = 3 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "house_found", value = 1 }]
outcome = { line_keys = ["l_y10_1", "l_y10_2"] }

# ---------- O-burners ----------

# Twelve hours after the call, a fact the offer can require.
[[triggers]]
id = "t_call_12h"
when = { test = "at_least", subject_kind = "store", id = "call_clock", value = 12 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "call_12h" }] }

# The tier's count at 380 meals, twelve hours after the call. Both join on either answer, at the post, their first work
# by the answer (the kind's roles, day_eighteen.toml); what the answer keeps is D-147's size. The table feeds two more.
[[offers]]
id = "o_burners"
text_key = "o_burners"
kind = "work"
gate = { test = "at_least", subject_kind = "store", id = "meals", value = 380 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "call_12h", value = 1 }]
line_keys = ["l_burners_1", "l_burners_2"]

[[offers.answers]]
id = "o_burners_food"
label_key = "a_burners_food"
cost_key = "a_burners_food_cost"
role = "food"
[offers.answers.outcome]
line_keys = ["l_burners_food"]
stores = [{ store = "arrivals", items = 2 }]
joins = [
  { lane = "n24", mix = "town:camp", card = "g_road_run_cart", own_split = false },
  { lane = "n25", mix = "town:camp", card = "g_road_run_cart", own_split = false },
]
whereabouts = [
  { person = "n24", no_scene = "runs the carts out to the post, past the wall, off the scene" },
  { person = "n25", no_scene = "runs the carts out to the post, past the wall, off the scene" },
]
modifiers = [
  { target = "rate", id = "smoke_catch", flow = "make", store = "smoked", kind = "mul_bp", amount_bp = 11000, source = "o_burners_food" },
  { target = "rate", id = "table", flow = "cost", store = "smoked", kind = "add_bp", amount_bp = 5000, source = "o_burners_food" },
]

[[offers.answers]]
id = "o_burners_build"
label_key = "a_burners_build"
cost_key = "a_burners_build_cost"
role = "build"
[offers.answers.outcome]
line_keys = ["l_burners_build"]
stores = [{ store = "arrivals", items = 2 }]
joins = [
  { lane = "n24", mix = "town:camp", card = "g_road_stakes", own_split = false },
  { lane = "n25", mix = "town:camp", card = "g_road_clear_road", own_split = false },
]
whereabouts = [
  { person = "n24", no_scene = "works the stakes, which the scene draws as the stack growing and never as anyone at it" },
  { person = "n25", no_scene = "clears the cut road, out past the palisade above the story strip's clearance, where no figure's head may sit" },
]
modifiers = [
  { target = "work", id = "shovel_road", kind = "mul_bp", amount_bp = 11000, source = "o_burners_build" },
  { target = "work", id = "n1_clear_road", kind = "mul_bp", amount_bp = 11000, source = "o_burners_build" },
  { target = "work", id = "n2_clear_road", kind = "mul_bp", amount_bp = 11000, source = "o_burners_build" },
