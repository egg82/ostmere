# What is in the post's shut store: the carts fill it; the crew out there, the hill's walks and later chapters draw it.
[[stores]]
id = "post_stores"
label_key = "store_post_stores"
cap_items = 24

# Never drawn: walks to the far hill, a count the house's chapter reads.
[[stores]]
id = "hill_trips"
label_key = "store_hill_trips"
cap_items = 8760
tally = true

# The cart out to the post: smoked in, the same out at the post; its haul is its bar, so the line costs only time and
# food (the table's against the post's).
[[cards]]
id = "run_cart"
site = { no_site = "the cart goes out the track to the post, past the wall, off the scene" }
presentation = "action"
label_key = "c_run_cart"
upside_key = "up_run_cart"
work_s = 2400
inputs = [{ store = "smoked", items = 4 }]
outcome = { stores = [{ store = "post_stores", items = 4 }] }

# Anyone the walk takes can push the cart: his leg rules him out.
[[town_cards]]
id = "{lane}_run_cart"
site = { no_site = "the cart goes out the track to the post, past the wall, off the scene" }
twin_of = "run_cart"
lanes = ["n1", "n2", "n3", "n5", "n6", "n7", "n8", "n9", "n10", "n12", "n13", "n14", "n15", "n23", "g_field", "g_road"]
presentation = "action"
label_key = "c_run_cart"
upside_key = "up_run_cart"
work_s = 9600
inputs = [{ store = "smoked", items = 4 }]
outcome = { stores = [{ store = "post_stores", items = 4 }] }

# The crew out at the trees eats from the post's store and cuts charwood while it lasts; dry, they wait for the next cart.
[[standing]]
id = "post_upkeep"
label_key = "action_post_upkeep"
costs = [{ store = "post_stores", items_per_hour = 1 }]
makes = [{ store = "charwood", items_per_hour = 1 }]

# The far hill, walked from the post alone: the post's store out, stones back.
[[cards]]
