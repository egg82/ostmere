  { unlock_kind = "card", id = "n12_run_cart" },
  { unlock_kind = "card", id = "n13_run_cart" },
  { unlock_kind = "card", id = "n14_run_cart" },
  { unlock_kind = "card", id = "n15_run_cart" },
  { unlock_kind = "card", id = "n23_run_cart" },
  { unlock_kind = "card", id = "g_field_run_cart" },
  { unlock_kind = "card", id = "g_road_run_cart" },
  { unlock_kind = "card", id = "n1_walk_hill" },
  { unlock_kind = "card", id = "n2_walk_hill" },
  { unlock_kind = "card", id = "n3_walk_hill" },
