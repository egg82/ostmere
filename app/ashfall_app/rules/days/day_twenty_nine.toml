# Day twenty-nine: from Y1 (the Drift's second turn) through SL37, Y2, Y3 and O-first-run to the first run and B22,
# week five's first chapter, as data merged after day_twenty_seven.toml (schema.Chapter, chapters.merge). Story
# spoilers: never shown to the owner. Spec: content/team/week-five.md, "Day twenty-nine"; numbers:
# content/team/week-five-numbers.md.
version = 1
end_feature = "outpost"

# ---------- the roofs' order card, offered once ----------

# Week two's roofs order card is offered until the Clear has turned (its rule retired then), so the Drift's roofs come
# back with the chip's hint dot alone (D-203). A trigger of its own, so a save already past the Clear gets it at once.
[[triggers]]
id = "t_roofs_offered"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "clear", value = 1 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "roofs_offered" }] }

# ---------- Y1: the Drift's second turn ----------

# Y1 at 672 h. The Drift reads drift_clock, offset by 504 (D-201): no new clock. The roofs' ash comes back on week two's
# ashfall, which drift_left now feeds again. The bloom and the bear's sign come back at week two's sizes within the hour,
# on a standing that draws a one-item pool rather than as a grant, so until the turn they read as used up, as they did
# through weeks three and four (D-224). Each of the Still's two leftovers drains on its own one-item pool, so one running
# dry never leaves the other standing (D-221). No rule is retired (D-202).
[[triggers]]
id = "t_y1"
season = true
when = { test = "after_time", value = 2419200 }
[triggers.outcome]
doings = ["n2"]
whereabouts = [{ person = "n2", no_scene = "up on the hall roof with a shovel, a pose the week's art adds; until then the line tells it" }]
line_keys = ["l_y1_1", "l_y1_2", "l_y1_3"]
stores = [
  { store = "drift_left", items = 336 },
  { store = "gifts_left", items = 1 },
  { store = "still_end_left", items = 1 },
  { store = "fish_end_left", items = 1 },
]
unlocks = [
  { unlock_kind = "feature", id = "drift_two" },
  { unlock_kind = "action", id = "gifts_back" },
  { unlock_kind = "action", id = "still_ends" },
  { unlock_kind = "action", id = "fish_ends" },
]

# Never drawn: the hour in which the bloom and the bear's sign come back.
[[stores]]
id = "gifts_left"
label_key = "store_gifts_left"
cap_items = 1
hidden = true

[[standing]]
id = "gifts_back"
label_key = "action_gifts_back"
costs = [{ store = "gifts_left", items_per_hour = 1 }]
makes = [{ store = "bloom", items_per_hour = 2000 }, { store = "bear_sign", items_per_hour = 6 }]

# Never drawn: the hour in which the wind takes the film off the open meat.
[[stores]]
id = "still_end_left"
label_key = "store_still_end_left"
cap_items = 1
hidden = true

# Never drawn: the hour in which the pale fish go with the fog.
[[stores]]
id = "fish_end_left"
label_key = "store_fish_end_left"
cap_items = 1
hidden = true

[[standing]]
id = "still_ends"
label_key = "action_still_ends"
costs = [{ store = "still_end_left", items_per_hour = 1 }, { store = "film", items_per_hour = 24 }]

[[standing]]
id = "fish_ends"
label_key = "action_fish_ends"
costs = [{ store = "fish_end_left", items_per_hour = 1 }, { store = "fish_rising", items_per_hour = 24 }]

# ---------- SL37: the fiddle ----------

# The first evening of wind, four hours into the season.
[[triggers]]
id = "t_fiddle_plays"
when = { test = "at_least", subject_kind = "store", id = "drift_clock", value = 508 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "drift_two", value = 1 }]
outcome = { doings = ["n14"], line_keys = ["l_fiddle_plays"], whereabouts = [{ person = "n14", no_scene = "plays at the fire in the evening, a figure the week's art adds; until then the line tells it" }] }

# ---------- Y2: prints at the post's door ----------

# The post's door hung and its last stage built, each a fact a requirement can read (a requirement reads only an
# unlock). Machinery, no moment of their own: on every route both are done before the turn.
[[triggers]]
id = "t_door_hung"
when = { test = "at_least", subject_kind = "card_count", id = "post_door", value = 1 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "door_hung" }] }

[[triggers]]
id = "t_post_built"
when = { test = "at_least", subject_kind = "card_count", id = "post", value = 12 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "post_built" }] }

[[triggers]]
id = "t_post_prints"
when = { test = "at_least", subject_kind = "store", id = "drift_clock", value = 510 }
requires = [
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "drift_two", value = 1 },
  { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "door_hung", value = 1 },
]
outcome = { line_keys = ["l_post_prints_1", "l_post_prints_2"], unlocks = [{ unlock_kind = "feature", id = "prints_seen" }] }

# ---------- Y3: the pin, and O-first-run ----------

# The next morning, once the prints are seen.
[[triggers]]
id = "t_pin"
when = { test = "at_least", subject_kind = "store", id = "drift_clock", value = 516 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "prints_seen", value = 1 }]
outcome = { line_keys = ["l_pin"], unlocks = [{ unlock_kind = "feature", id = "pin_laid" }] }

# Lucy asks the room with Y3, once the post's last stage is built. Either answer runs the load out and lands B22 at its
# end (D-207). The yes shows the run on the tasks rather than queuing it: a queued run is a promise, and no dilemma tests
# this one (D-176's shape, D-222).
[[offers]]
id = "o_first_run"
text_key = "o_first_run"
askers = ["n1"]
gate = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "pin_laid", value = 1 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "post_built", value = 1 }]
line_keys = ["l_first_run_ask"]

[[offers.answers]]
id = "o_first_run_yes"
label_key = "a_first_run_yes"
cost_key = "a_first_run_yes_cost"
[offers.answers.outcome]
line_keys = ["l_first_run_yes"]
unlocks = [{ unlock_kind = "card", id = "first_run" }]

[[offers.answers]]
id = "o_first_run_other"
label_key = "a_job_no"
cost_key = "a_first_run_other_cost"
[offers.answers.outcome]
doings = ["n1"]
whereabouts = [{ person = "n1", no_scene = "finds someone to take the load out, never named; the run is two hidden hours off the scene" }]
line_keys = ["l_first_run_other"]
stores = [{ store = "run_town_left", items = 2 }]
unlocks = [{ unlock_kind = "action", id = "run_town" }]

# A41: the load out to the post, a story step on the hands. Ready from the season's morning (684 h): the offer that
# shows it waits on Y3, which waits on that hour.
[[cards]]
id = "first_run"
site = { no_site = "the run goes out under the trees to the post, past the wall, off the scene" }
only_player = "story"
presentation = "action"
label_key = "c_first_run"
upside_key = "up_first_run"
work_s = 3600
cap = 1
glows = true
inputs = [{ store = "smoked", items = 6 }]

# The other answer: two hidden hours of someone else's run, drawing the same load as it goes.
[[stores]]
id = "run_town_left"
label_key = "store_run_town_left"
cap_items = 2
hidden = true

[[stores]]
id = "run_town"
label_key = "store_run_town"
cap_items = 2
hidden = true

[[standing]]
id = "run_town"
label_key = "action_run_town"
costs = [{ store = "run_town_left", items_per_hour = 1 }, { store = "smoked", items_per_hour = 3 }]
makes = [{ store = "run_town", items_per_hour = 1 }]

# The run's end by either answer: each says it its own way, then B22.
[[triggers]]
id = "t_first_run"
when = { test = "at_least", subject_kind = "card_count", id = "first_run", value = 1 }
outcome = { line_keys = ["l_b22_1y", "l_b22_2y", "l_b22_3y"], unlocks = [{ unlock_kind = "feature", id = "run_done" }] }

[[triggers]]
id = "t_run_town"
when = { test = "at_least", subject_kind = "store", id = "run_town", value = 2 }
outcome = { line_keys = ["l_b22_1o", "l_b22_2o", "l_b22_3o"], unlocks = [{ unlock_kind = "feature", id = "run_done" }] }

# ---------- B22: the post an outpost, and the tracker ----------

# The tracker is cast from who walked the Ashwood most, then who foraged most, then the earliest to join (D-208). From
# here the post has a store the carts fill and its crew draws (D-205), and the hill is walked from it (D-214).
[[triggers]]
id = "t_b22"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "run_done", value = 1 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "drift_two", value = 1 }]
[triggers.outcome]
line_keys = ["l_b22_4"]
casts = [{ role = "tracker", label_key = "role_tracker", patterns = ["{lane}_walk_ashwood", "{lane}_forage"] }]
unlocks = [
  { unlock_kind = "feature", id = "outpost" },
  { unlock_kind = "store", id = "post_stores" },
  { unlock_kind = "store", id = "hill_trips" },
  { unlock_kind = "action", id = "post_upkeep" },
  { unlock_kind = "card", id = "run_cart" },
  { unlock_kind = "card", id = "walk_hill" },
  { unlock_kind = "card", id = "n1_run_cart" },
  { unlock_kind = "card", id = "n2_run_cart" },
  { unlock_kind = "card", id = "n3_run_cart" },
  { unlock_kind = "card", id = "n5_run_cart" },
  { unlock_kind = "card", id = "n6_run_cart" },
  { unlock_kind = "card", id = "n7_run_cart" },
  { unlock_kind = "card", id = "n8_run_cart" },
