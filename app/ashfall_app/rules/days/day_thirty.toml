# Day thirty: from B22 (the post an outpost) through the track's chore, the line's raids, Y4, SL38, Y5, Y6 (night 30),
# SL39 and Y7 to A42 and B23, week five's second chapter, as data merged after day_twenty_nine.toml (schema.Chapter,
# chapters.merge). Story spoilers: never shown to the owner. Spec: content/team/week-five.md, "Day thirty"; numbers:
# content/team/week-five-numbers.md. What day twenty-nine left here opens on its end feature, outpost (D-223).
version = 1
end_feature = "pack_called"

# ---------- the track's chore: a season chip with cures and no order card ----------

# From the outpost the ash drifts over the cleared track to the post, one an hour on a pool sized to last to about the
# Clear's turn. Its chip comes with its hint dot and no ready-made rule (D-155, D-203).
[[triggers]]
id = "t_track_drifts"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "outpost", value = 1 }
outcome = { stores = [{ store = "track_left", items = 144 }], unlocks = [{ unlock_kind = "action", id = "track_drift" }] }

# Never drawn: the hours the track keeps drifting over.
[[stores]]
id = "track_left"
label_key = "store_track_left"
cap_items = 144
hidden = true

# Never drawn: the chip is its face.
[[stores]]
id = "road_ash"
label_key = "store_road_ash"
cap_items = 48
hidden = true

[[standing]]
id = "track_drift"
label_key = "action_track_drift"
costs = [{ store = "track_left", items_per_hour = 1 }]
makes = [{ store = "road_ash", items_per_hour = 1 }]

# The chip opens with its cures, on the hands and on the town's lanes, the first time it would show.
[[triggers]]
id = "t_track_drifted"
when = { test = "at_least", subject_kind = "store", id = "road_ash", value = 12 }
[triggers.outcome]
unlocks = [
  { unlock_kind = "chip", id = "drifted" },
  { unlock_kind = "card", id = "clear_track" },
  { unlock_kind = "card", id = "n1_clear_track" },
  { unlock_kind = "card", id = "n2_clear_track" },
  { unlock_kind = "card", id = "n3_clear_track" },
  { unlock_kind = "card", id = "n5_clear_track" },
  { unlock_kind = "card", id = "n6_clear_track" },
  { unlock_kind = "card", id = "n7_clear_track" },
  { unlock_kind = "card", id = "n8_clear_track" },
  { unlock_kind = "card", id = "n9_clear_track" },
  { unlock_kind = "card", id = "n10_clear_track" },
  { unlock_kind = "card", id = "n12_clear_track" },
  { unlock_kind = "card", id = "n13_clear_track" },
  { unlock_kind = "card", id = "n14_clear_track" },
  { unlock_kind = "card", id = "n15_clear_track" },
  { unlock_kind = "card", id = "n23_clear_track" },
  { unlock_kind = "card", id = "g_field_clear_track" },
