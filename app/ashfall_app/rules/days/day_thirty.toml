id = "clear_track"
site = { no_site = "the track runs from the road's end out to the post, past the wall, off the scene" }
presentation = "action"
label_key = "c_clear_track"
upside_key = "up_clear_track"
work_s = 600
skill = "scavenging"
xp_per_hour = 360
