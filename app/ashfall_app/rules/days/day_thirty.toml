# ---------- the line: a standing fight on the supply line, and what holds its side ----------

# From the outpost the mourners take from the post's store, one fight an hour; a lost fight costs one of its stores.
# The line's clock (hidden) times the chapter's later beats. The tracker's card is on every person's lane, each
# requiring their own lane's cast (D-208), so only the cast lane ever has it.
[[triggers]]
id = "t_line_opens"
when = { test = "at_least", subject_kind = "unlocked", unlock_kind = "feature", id = "outpost", value = 1 }
[triggers.outcome]
unlocks = [
  { unlock_kind = "action", id = "raid_line" },
  { unlock_kind = "feature", id = "combat" },
  { unlock_kind = "action", id = "line_clock" },
  { unlock_kind = "card", id = "n1_track" },
  { unlock_kind = "card", id = "n2_track" },
  { unlock_kind = "card", id = "n3_track" },
  { unlock_kind = "card", id = "n4_track" },
  { unlock_kind = "card", id = "n5_track" },
  { unlock_kind = "card", id = "n6_track" },
  { unlock_kind = "card", id = "n7_track" },
  { unlock_kind = "card", id = "n8_track" },
  { unlock_kind = "card", id = "n9_track" },
  { unlock_kind = "card", id = "n10_track" },
  { unlock_kind = "card", id = "n11_track" },
  { unlock_kind = "card", id = "n12_track" },
  { unlock_kind = "card", id = "n13_track" },
  { unlock_kind = "card", id = "n14_track" },
  { unlock_kind = "card", id = "n15_track" },
]

