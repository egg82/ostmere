[text]
l_y12_1 = "clearing the last ash from the back of the house, the walkers find a second door, black stone, set flush."
l_y12_2 = "no handle, no keyhole. it is warm to the hand, warmer than the hearth."
l_y13_1 = "the tracker and two of the walkers put a bar to its edge and lean on it until the bar bends. it doesn't move."
l_y13_2 = "in the middle of its face, at waist height, there is a shallow hollow, long and narrow, about the width of a wrist."
c_open_ward = "Lay your wrist to it"
l_b25_1 = "you lay your wrist in the hollow, the mark uppermost. the door goes in a hand's width and swings."
l_b25_2 = "the tracker looks at your wrist a long time, then draws the same mark on their own with a stick of charcoal."
l_b25_3 = "they swing the door shut and lay their wrist in the hollow, and it opens for them too. they try it again. it doesn't."
l_b25_4 = "behind the door a shaft goes down into the dark. warm air comes up it."
store_mark_clock = "hours since the door"
action_mark_clock = "Since the door"
l_y14 = "at supper the tracker eats with one sleeve rolled to the elbow, that wrist held away from the pot's steam. nobody gets near it."
store_night_35 = "night"
action_night_35 = "Night"
l_night_35 = "the light goes. it stays warm, and the ash keeps coming down."
l_y15_1 = "everyone is out in the yard. nobody can sleep inside in the heat. {n14} plays."
l_y15_2 = "the tracker spits on their wrist and rubs the charcoal off with a thumb. it comes away grey."
pays_find_for_16 = "a find, {pct} foraging speed"
pays_find_way_18 = "a find, {pct} speed walking the Ashwood"
pays_spell_12_gate = "{pct} spellcraft speed, {pct_b} speed warding the gate"
pays_arc_16_reach = "{pct} arcana speed, {pct_b} reach calling through the pack"
l_find_ash_caps = "ash-caps on the dead trunks round the post, opened in the wind."
l_find_marker = "on the path up the far hill, a road marker with its face still cut. the letters can't be read."
o_j_hill_stakes = "Lucy says somebody has to stake the path up the far hill, so the walkers keep to it in the dark."
a_j_hill_stakes_yes = "I'll stake it"
l_j_hill_stakes_yes = "you carry a bundle of stakes out past the post."
l_j_hill_stakes_no = "Lucy finds someone else."
l_echo_j_hill_stakes_no = "someone staked the hill path. the walkers keep to it quicker."
c_hill_stakes = "Stake the hill path"
up_hill_stakes = "the path marked, and stones dug up setting it"
l_hill_stakes = "a line of stakes runs up the far hill, pale in the ash."
place_house = "The house on the hill"
place_marker_hill = "The road marker"
aim_shaft = "the way down."
n_day_b25 = "the black door opened to the mark on my wrist. the tracker drew it in charcoal, and it opened once for them"
j_b25_catchup = "the black door at the back of the house was opened"
j_b25_late = "the black door at the back of the house stands open"
