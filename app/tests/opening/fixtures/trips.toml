# A test chapter, merged after the shipped chapters (tests/opening/test_trips.py): a trip (an uncapped hands card taking a
# pool and a material it makes at its cap), its town twin on a ruled lane, a count both add to (a tally store), finds on
# that count, and a skill whose first card is the trip. The skill's row and the triggers paying its levels are added by
# the test. Not story: the ids and words are the tests' own.
version = 1

[[stores]]
id = "t_pool"
label_key = "t_s_pool"
cap_items = 100
initial_items = 100

[[stores]]
id = "t_ore"
label_key = "t_s_ore"
cap_items = 5
initial_items = 5

[[stores]]
id = "t_trips"
label_key = "t_s_trips"
cap_items = 1000
tally = true

[[stores]]
id = "t_relics"
label_key = "t_s_relics"
cap_items = 10

[[lanes]]
id = "t_scout"
label_key = "t_l_scout"
ruled = true
told = "line"

[[cards]]
id = "t_trip"
presentation = "action"
label_key = "t_c_trip"
upside_key = "t_up"
work_s = 600
skill = "t_lore"
xp_per_hour = 60
inputs = [{ store = "t_pool", items = 1 }]
outcome = { stores = [{ store = "t_ore", items = 1 }, { store = "t_trips", items = 1 }] }

[[cards]]
id = "t_scout_trip"
lane = "t_scout"
presentation = "action"
label_key = "t_c_trip"
upside_key = "t_up"
work_s = 600
inputs = [{ store = "t_pool", items = 1 }]
outcome = { stores = [{ store = "t_ore", items = 1 }, { store = "t_trips", items = 1 }] }
twin_of = "t_trip"

[[triggers]]
id = "t_scout_arrives"
when = { test = "after_time", value = 100 }
outcome = { unlocks = [{ unlock_kind = "card", id = "t_scout_trip" }], orders = [{ tap_card = "t_scout_trip" }] }

[[triggers]]
id = "t_lore_arrives"
when = { test = "after_time", value = 50 }
outcome = { unlocks = [{ unlock_kind = "skill", id = "t_lore" }, { unlock_kind = "card", id = "t_trip" }] }

[[triggers]]
id = "t_find_3"
when = { test = "at_least", subject_kind = "store", id = "t_trips", value = 3 }
outcome = { stores = [{ store = "t_relics", items = 1 }], line_keys = ["t_l_find"], found_line_key = "t_l_find" }

[[triggers]]
id = "t_find_5"
when = { test = "at_least", subject_kind = "store", id = "t_trips", value = 5 }
outcome = { stores = [{ store = "t_relics", items = 2 }], line_keys = ["t_l_find"], found_line_key = "t_l_find" }

[line_kinds]
t_l_find = "find"
t_pays_lore = "find"

[text]
t_up = "what it is for"
t_s_pool = "Supplies"
t_s_ore = "Ore"
t_s_trips = "Trips"
t_s_relics = "Relics"
t_l_scout = "Scout"
t_c_trip = "Trip"
t_k_lore = "Lore"
t_pays_lore = "faster"
t_l_find = "Found {found}."
