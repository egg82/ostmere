# A test chapter, merged onto the opening alone (tests/opening/test_season_turns.py): two clock turns ten hours and
# four hours apart; the first fills a pool and opens a standing action drawing it and a card taking another, the
# second is the next turn. Not story: the ids and words are the tests' own. The planted variants are edits of this file.
version = 1
end_feature = "t_next"

[[stores]]
id = "t_pool"
label_key = "t_s_pool"
cap_items = 20

[[stores]]
id = "t_pool_card"
label_key = "t_s_pool_card"
cap_items = 20

[[standing]]
id = "t_burn"
label_key = "t_a_burn"
costs = [{ store = "t_pool", items_per_hour = 1 }]

[[cards]]
id = "t_gather"
presentation = "action"
label_key = "t_c_gather"
work_s = 60
inputs = [{ store = "t_pool_card", items = 1 }]
makes = [{ store = "dry_wood", items_per_hour = 30 }]
failed_line_key = "t_l_gather_failed"

[[features]]
id = "t_next"

[[triggers]]
id = "t_turn_1"
season = true
when = { test = "after_time", value = 36000 }
outcome = { stores = [{ store = "t_pool", items = 4 }, { store = "t_pool_card", items = 3 }], unlocks = [{ unlock_kind = "action", id = "t_burn" }, { unlock_kind = "card", id = "t_gather" }] }

[[triggers]]
id = "t_turn_2"
season = true
when = { test = "after_time", value = 50400 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "t_next" }] }

[line_kinds]
t_l_gather_failed = "story"

[text]
t_s_pool = "Season stock"
t_s_pool_card = "Season haul"
t_a_burn = "Season burn"
t_c_gather = "Gather"
t_l_gather_failed = "Nothing to gather."
