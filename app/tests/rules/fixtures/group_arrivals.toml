# A test chapter, merged onto the opening alone (tests/rules/expand/test_group_arrivals.py): an offer of a kind with two roles
# whose either answer joins four people, told by a mention, as members of one pooled lane, each answer handing the group
# its own card (its share). A second pooled lane with a card is there for the planted variants. Not story: the ids and
# words are the tests' own.
version = 1

[[stores]]
id = "t_food"
label_key = "t_s_food"
cap_items = 1000

[[stores]]
id = "t_stone"
label_key = "t_s_stone"
cap_items = 1000

[[lanes]]
id = "t_crew"
label_key = "t_l_crew"
ruled = true
pooled = true

[[lanes]]
id = "t_other"
label_key = "t_l_other"
ruled = true
pooled = true

[[lanes]]
id = "t_m1"
label_key = "t_l_m1"
ruled = true
told = "mention"
group = "t_crew"

[[lanes]]
id = "t_m2"
label_key = "t_l_m2"
ruled = true
told = "mention"
group = "t_crew"

[[lanes]]
id = "t_m3"
label_key = "t_l_m3"
ruled = true
told = "mention"
group = "t_crew"

[[lanes]]
id = "t_m4"
label_key = "t_l_m4"
ruled = true
told = "mention"
group = "t_crew"

[[cards]]
id = "t_crew_food"
lane = "t_crew"
presentation = "action"
label_key = "t_c_food"
upside_key = "t_up"
work_s = 60
makes = [{ store = "t_food", items_per_hour = 30 }]

[[cards]]
id = "t_crew_build"
lane = "t_crew"
presentation = "action"
label_key = "t_c_build"
upside_key = "t_up"
work_s = 60
makes = [{ store = "t_stone", items_per_hour = 60 }]

[[cards]]
id = "t_other_work"
lane = "t_other"
presentation = "action"
label_key = "t_c_other"
upside_key = "t_up"
work_s = 60
makes = [{ store = "t_food", items_per_hour = 30 }]

[[offer_kinds]]
kind = "t_work"
roles = [{ role = "food", label_key = "t_k_food" }, { role = "build", label_key = "t_k_build" }]

[[offers]]
id = "t_arrive"
text_key = "t_o_arrive"
kind = "t_work"
gate = { test = "after_time", value = 100 }

[[offers.answers]]
id = "t_arrive_food"
label_key = "t_a_food"
cost_key = "t_a_cost"
role = "food"
[offers.answers.outcome]
unlocks = [{ unlock_kind = "card", id = "t_crew_food" }]
joins = [{ lane = "t_m1", mix = "town:main", card = "t_crew_food", own_split = false }, { lane = "t_m2", mix = "town:main", card = "t_crew_food", own_split = false }, { lane = "t_m3", mix = "town:main", card = "t_crew_food", own_split = false }, { lane = "t_m4", mix = "town:main", card = "t_crew_food", own_split = false }]

[[offers.answers]]
id = "t_arrive_build"
label_key = "t_a_build"
cost_key = "t_a_cost"
role = "build"
[offers.answers.outcome]
unlocks = [{ unlock_kind = "card", id = "t_crew_build" }]
joins = [{ lane = "t_m1", mix = "town:main", card = "t_crew_build", own_split = false }, { lane = "t_m2", mix = "town:main", card = "t_crew_build", own_split = false }, { lane = "t_m3", mix = "town:main", card = "t_crew_build", own_split = false }, { lane = "t_m4", mix = "town:main", card = "t_crew_build", own_split = false }]

[[people.came]]
at_least = 1
keys = ["t_came_one", "t_came_one_2", "t_came_one_3", "t_came_one_4", "t_came_one_5", "t_came_one_6"]

[[people.came]]
at_least = 2
keys = ["t_came_some", "t_came_some_2", "t_came_some_3", "t_came_some_4", "t_came_some_5", "t_came_some_6"]

[[people.went]]
at_least = 1
keys = ["t_went_one", "t_went_one_2", "t_went_one_3", "t_went_one_4", "t_went_one_5", "t_went_one_6"]

