# A test chapter, merged onto the opening alone (tests/rules/loaders/test_people_loader.py): one person told by a line joins
# with a story line of their own; two told by a mention join together with none, and later one of them leaves. Not
# story: the ids and words are the tests' own. The planted variants are edits of this file.
version = 1

[[stores]]
id = "t_heap"
label_key = "t_s_heap"
cap_items = 20

[[lanes]]
id = "t_post"
label_key = "t_l_post"

[[lanes]]
id = "t_q1"
label_key = "t_l_q1"
ruled = true
told = "line"

[[lanes]]
id = "t_q2"
label_key = "t_l_q2"
ruled = true
told = "mention"

[[lanes]]
id = "t_q3"
label_key = "t_l_q3"
ruled = true
told = "mention"

[[cards]]
id = "t_q1_work"
lane = "t_q1"
presentation = "action"
label_key = "t_c_work"
upside_key = "t_up"
work_s = 60
makes = [{ store = "t_heap", items_per_hour = 30 }]

[[cards]]
id = "t_q2_work"
lane = "t_q2"
presentation = "action"
label_key = "t_c_work"
upside_key = "t_up"
work_s = 60
makes = [{ store = "t_heap", items_per_hour = 30 }]

[[cards]]
id = "t_q3_work"
lane = "t_q3"
presentation = "action"
label_key = "t_c_work"
upside_key = "t_up"
work_s = 60
makes = [{ store = "t_heap", items_per_hour = 30 }]

[[triggers]]
id = "t_q1_comes"
when = { test = "after_time", value = 100 }
outcome = { line_keys = ["t_l_comes"], unlocks = [{ unlock_kind = "card", id = "t_q1_work" }], joins = [{ lane = "t_q1", mix = "town:main", card = "t_q1_work", own_split = true }] }

[[triggers]]
id = "t_pair_comes"
when = { test = "after_time", value = 200 }
outcome = { unlocks = [{ unlock_kind = "card", id = "t_q2_work" }, { unlock_kind = "card", id = "t_q3_work" }], joins = [{ lane = "t_q2", mix = "town:main", card = "t_q2_work", own_split = true }, { lane = "t_q3", mix = "town:main", card = "t_q3_work", own_split = true }] }

[[triggers]]
id = "t_q3_goes"
when = { test = "after_time", value = 5000 }
outcome = { leaves = [{ lane = "t_q3" }] }

[[people.came]]
at_least = 1
keys = ["t_came_one", "t_came_one_2", "t_came_one_3", "t_came_one_4", "t_came_one_5", "t_came_one_6"]

[[people.came]]
at_least = 2
keys = ["t_came_some_a", "t_came_some_b", "t_came_some_b_3", "t_came_some_b_4", "t_came_some_b_5", "t_came_some_b_6"]

[[people.went]]
at_least = 1
keys = ["t_went_one", "t_went_one_2", "t_went_one_3", "t_went_one_4", "t_went_one_5", "t_went_one_6"]

[[subjects]]
id = "t_s_q1_joined"
kind = "person"
source = { source_kind = "lane", id = "t_q1", way = "joined" }
first = { keys = ["t_j_q1_came"] }
catchup = { keys = ["t_j_q1_came"] }

[line_kinds]
t_l_comes = "story"

