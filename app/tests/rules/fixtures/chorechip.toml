# A test chapter, merged onto the opening alone (tests/rules/expand/test_chore_chip_loader.py): a season's turn opens a
# standing action that piles up a film only it makes; a chip that costs a standing action's making shows while the film is
# high, and the trigger at its first showing opens its cures, a hands card and a helper's twin, with no order card for
# the chip (a chore whose rule is the player's to write). Not story: the ids and words are the tests' own. The planted
# variants are edits of this file.
version = 1

[[stores]]
id = "t_left"
label_key = "t_s_left"
cap_items = 200

[[stores]]
id = "t_film"
label_key = "t_s_film"
cap_items = 24

[[stores]]
id = "t_meal"
label_key = "t_s_meal"
cap_items = 50

[[standing]]
id = "t_settle"
label_key = "t_a_settle"
costs = [{ store = "t_left", items_per_hour = 1 }]
makes = [{ store = "t_film", items_per_hour = 1 }]

[[standing]]
id = "t_table"
label_key = "t_a_table"
costs = [{ store = "t_left", items_per_hour = 1 }]
makes = [{ store = "t_meal", items_per_hour = 2 }]

[[lanes]]
id = "t_helper"
label_key = "t_l_helper"
ruled = true
told = "line"

[[cards]]
id = "t_wash"
presentation = "action"
label_key = "t_c_wash"
upside_key = "t_up_wash"
work_s = 600
inputs = [{ store = "t_film", items = 12 }]

[[cards]]
id = "t_helper_wash"
twin_of = "t_wash"
lane = "t_helper"
presentation = "action"
label_key = "t_c_helper_wash"
upside_key = "t_up_wash"
work_s = 2400
inputs = [{ store = "t_film", items = 12 }]

[[chips]]
id = "t_ashed"
label_key = "t_ch_ashed"
tone = "cold"
when = { test = "at_least", subject_kind = "store", id = "t_film", value = 12 }
effects = [{ target = "rate", id = "t_table", flow = "make", store = "t_meal", kind = "mul_bp", amount_bp = 7500, source = "t_ashed" }]
cost_key = "t_ch_ashed_cost"

[[triggers]]
id = "t_turn"
season = true
when = { test = "after_time", value = 36000 }
outcome = { stores = [{ store = "t_left", items = 168 }], unlocks = [{ unlock_kind = "action", id = "t_settle" }, { unlock_kind = "action", id = "t_table" }, { unlock_kind = "store", id = "t_meal" }] }

[[triggers]]
id = "t_first"
when = { test = "at_least", subject_kind = "store", id = "t_film", value = 12 }
requires = [{ test = "at_least", subject_kind = "unlocked", unlock_kind = "action", id = "t_table", value = 1 }]
outcome = { unlocks = [{ unlock_kind = "chip", id = "t_ashed" }, { unlock_kind = "card", id = "t_wash" }, { unlock_kind = "card", id = "t_helper_wash" }] }

[text]
t_up = "what it is for"
t_s_left = "Season left"
t_s_film = "Film"
t_s_meal = "Meals"
t_a_settle = "Settling"
t_a_table = "Table"
t_l_helper = "Helper"
t_c_wash = "Wash"
t_c_helper_wash = "Helper washes"
t_ch_ashed = "Filmed"
t_ch_ashed_cost = "fewer meals"
t_up_wash = "clears the film"
