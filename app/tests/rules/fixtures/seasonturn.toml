# A test chapter, merged onto the opening alone (tests/opening/test_season_second_turn.py): a season's first turn opens a
# standing action that piles up a heap only it makes (a chip shows while it is high) and fills a gift pool; the next
# turn retires the clearing card's orders and the chip's order card is offered until then; the third turn, the season's
# second, refills a new pool, opens its standing action and a one-item pool a standing action drains, which empties the
# heap and the gift pool within the hour. It retires no rule. Not story: the ids and words are the tests' own. The
# planted variants are edits of this file.
version = 1
end_feature = "t_next"

[[stores]]
id = "t_pool"
label_key = "t_s_pool"
cap_items = 20

[[stores]]
id = "t_heap"
label_key = "t_s_heap"
cap_items = 20

[[stores]]
id = "t_gift"
label_key = "t_s_gift"
cap_items = 20

[[stores]]
id = "t_pool2"
label_key = "t_s_pool2"
cap_items = 20

[[stores]]
id = "t_thaw_left"
label_key = "t_s_thaw_left"
cap_items = 1
hidden = true

[[standing]]
id = "t_pile"
label_key = "t_a_pile"
costs = [{ store = "t_pool", items_per_hour = 1 }]
makes = [{ store = "t_heap", items_per_hour = 1 }]

[[standing]]
id = "t_brew"
label_key = "t_a_brew"
costs = [{ store = "t_pool2", items_per_hour = 1 }]

[[standing]]
id = "t_thaw"
label_key = "t_a_thaw"
costs = [{ store = "t_thaw_left", items_per_hour = 1 }, { store = "t_heap", items_per_hour = 24 }, { store = "t_gift", items_per_hour = 24 }]

[[cards]]
id = "t_clear"
presentation = "action"
label_key = "t_c_clear"
upside_key = "t_up"
work_s = 60
costs = [{ store = "t_heap", items_per_hour = 30 }]

[[chips]]
id = "t_heaped"
label_key = "t_ch_heaped"
tone = "cold"
when = { test = "at_least", subject_kind = "store", id = "t_heap", value = 3, release = 1 }

[[order_cards]]
store = "t_heap"
chip = "t_heaped"
when = { test = "at_least", subject_kind = "store", id = "t_heap", value = 3, release = 1 }
tap_card = "t_clear"
offered_until = { unlock_kind = "feature", id = "t_turned" }

[[features]]
id = "t_turned"

[[features]]
id = "t_next"

[[triggers]]
id = "t_open"
when = { test = "after_time", value = 30000 }
outcome = { unlocks = [{ unlock_kind = "card", id = "t_clear" }] }

[[triggers]]
id = "t_turn_1"
season = true
when = { test = "after_time", value = 36000 }
outcome = { stores = [{ store = "t_pool", items = 4 }, { store = "t_gift", items = 4 }], unlocks = [{ unlock_kind = "action", id = "t_pile" }, { unlock_kind = "chip", id = "t_heaped" }] }

[[triggers]]
id = "t_turn_2"
season = true
when = { test = "after_time", value = 50400 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "t_turned" }], retire_orders = ["t_clear"] }

[[triggers]]
id = "t_turn_3"
season = true
when = { test = "after_time", value = 64800 }
outcome = { stores = [{ store = "t_pool2", items = 4 }, { store = "t_thaw_left", items = 1 }], unlocks = [{ unlock_kind = "action", id = "t_brew" }, { unlock_kind = "action", id = "t_thaw" }, { unlock_kind = "feature", id = "t_next" }] }

[text]
t_up = "what it is for"
t_s_pool = "Season stock"
t_s_heap = "Heap"
t_s_gift = "Gift"
t_s_pool2 = "New stock"
t_s_thaw_left = "Thaw"
t_a_pile = "Piling up"
t_a_brew = "Brewing"
t_a_thaw = "Thaw"
t_c_clear = "Clear"
t_ch_heaped = "Heaped"
