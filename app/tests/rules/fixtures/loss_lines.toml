# A test chapter, merged onto the opening alone (tests/opening/test_loss_lines_loader.py): a fight card that tells its
# losses from pools of its own (api/contract/loss-lines.txt, "LOSS LINES"), opened only once a feature is, beside a plain fight
# card and a standing fight. Not story: the ids and words are the tests' own.
version = 1
end_feature = "t_kept"

[[sides]]
id = "t_hands"
label_key = "t_side_hands"
base = 4

[[threats]]
id = "t_rats"
label_key = "t_threat_rats"
base = 3

# Tallies: made only by their fight's lines, never unlocked.
[[stores]]
id = "t_lost_pool"
label_key = "t_s_lost_pool"
cap_items = 100000

[[stores]]
id = "t_lost_plain"
label_key = "t_s_lost_plain"
cap_items = 100000

[[stores]]
id = "t_lost_raid"
label_key = "t_s_lost_raid"
cap_items = 100000

[[stores]]
id = "t_fought_raid"
label_key = "t_s_fought_raid"
cap_items = 100000

[[standing]]
id = "t_raid"
label_key = "t_a_raid"
fight = { side = "t_hands", threat = "t_rats", lost = "t_lost_raid", fought = "t_fought_raid", fights_per_hour = 2, loses = [{ store = "stones", items = 1 }] }

[[cards]]
id = "t_pool"
presentation = "action"
label_key = "t_c_pool"
upside_key = "t_up"
work_s = 60
only_player = "self"
makes = [{ store = "dry_wood", items_per_hour = 30 }]
fight = { side = "t_hands", threat = "t_rats", lost = "t_lost_pool", loss_pool = ["t_l_pool_1", "t_l_pool_2", "t_l_pool_3", "t_l_pool_4", "t_l_pool_5", "t_l_pool_6"], loss_notes = ["t_n_pool_1", "t_n_pool_2", "t_n_pool_3"], on_loss_key = "t_on_loss", loss_after = "t_kept" }

[[cards]]
id = "t_plain"
presentation = "action"
label_key = "t_c_plain"
upside_key = "t_up"
work_s = 60
makes = [{ store = "dry_wood", items_per_hour = 30 }]
fight = { side = "t_hands", threat = "t_rats", lost = "t_lost_plain", lost_line_keys = ["t_l_plain_1", "t_l_plain_2", "t_l_plain_3", "t_l_plain_4", "t_l_plain_5", "t_l_plain_6"] }

[[features]]
id = "combat"

[[features]]
id = "t_kept"

[[triggers]]
id = "t_combat_on"
when = { test = "at_least", subject_kind = "store", id = "damp_wood", value = 1 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "combat" }, { unlock_kind = "card", id = "t_plain" }, { unlock_kind = "action", id = "t_raid" }] }

[[triggers]]
id = "t_kept_on"
when = { test = "at_least", subject_kind = "store", id = "damp_wood", value = 3 }
outcome = { unlocks = [{ unlock_kind = "feature", id = "combat" }, { unlock_kind = "feature", id = "t_kept" }, { unlock_kind = "card", id = "t_pool" }] }

[line_kinds]
t_l_pool_1 = "fight"
t_l_pool_2 = "fight"
t_l_plain_1 = "fight"
t_l_pool_3 = "fight"
t_l_pool_4 = "fight"
t_l_pool_5 = "fight"
t_l_pool_6 = "fight"
t_l_plain_2 = "fight"
t_l_plain_3 = "fight"
t_l_plain_4 = "fight"
t_l_plain_5 = "fight"
t_l_plain_6 = "fight"

[text]
t_up = "what it is for"
t_side_hands = "The town"
t_threat_rats = "Rats"
t_s_lost_pool = "Pool hunts lost"
t_s_lost_plain = "Plain hunts lost"
t_s_lost_raid = "Raids lost"
t_s_fought_raid = "Raids fought"
t_a_raid = "Rats at the stores"
t_c_pool = "Pool hunt"
t_c_plain = "Plain hunt"
t_l_pool_1 = "A pool loss, the first way"
t_l_pool_2 = "A pool loss, the second way"
t_l_plain_1 = "A plain loss"
t_l_pool_3 = "A pool loss, the third way"
t_l_pool_4 = "A pool loss, the fourth way"
t_l_pool_5 = "A pool loss, the fifth way"
t_l_pool_6 = "A pool loss, the sixth way"
