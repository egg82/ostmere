[pytest]
pythonpath = .
testpaths = tests
timeout = 6
timeout_method = thread
markers =
    playthrough: reads a whole scripted playthrough (tests/opening/routes.py); the `playthrough` CI job runs these, `tests` the rest
    smoke: a week-two test that plays a route from the start, the pull request's smoke for a change that re-keys every chapter (tools/weektwo_shards.py, WEEKTWO_SLICE)
    weektwo_shard(name): the week-two shard (tools/weektwo_shards.py) that runs this test, for one that reads no play of its own
    kills(*rows): the rows of the suite's MUTANTS_*.txt this test must turn red for (tools/mutate_suite.py)
