# Day one: from the opening's end (story dusk, day 1) through the night and story day 2 to B3. Spec, and what each id
# is: content/team/day-one.md. Ids only, no story text, like the rest of this file.
#   kind: beat (a day-one beat, shape fields as for beats:) | action (a one-off step) | stage (a stage of P0) |
#         ref (a spine beat placed in the day; its fields stay in beats:). The first ref opens the day, the last closes it.
#   visit: the session a typical player meets it in (V1 is the session the opening ends in; a beat that lands while
#          the player is away is met on the next visit, played in full).
#   target_hour: game hours after the opening's end on the typical route, where it lands in the engine. Provisional
#          until the simulator's routes replace them (flatcheck.py --route, keys "hours" and "visits").
# flatcheck.py checks: gates land before what they gate; the day's beats keep their authored order; turn, yes and
# register runs over B2, the H beats and B3; the near promise below is opened, advanced on every visit, and paid by
# the closing beat.
day_one_near_promise: C-promise-16
