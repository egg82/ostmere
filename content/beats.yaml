# Beat schedule for the pacing simulator. Numbers and system terms only: no story text.
# This is the one file in content/ a spoiler-safe tool reads.
#
# target_day: the day a typical route should land the beat (sharp ~0.83x, lazy ~1.17x).
# weekly: the bigger beat of its week.
# clock: true = lands on world time (a season turn), gates nothing downstream.
#
# Gate vocabulary (all conditions the engine can solve for):
#   start: true
#   project: <P or A id>                     project or one-off action complete
#   needs: {item}                            an action that fails, every time, until the item is held (no chance)
#   repeats: n                               an action done in n short pushes, a log line each
#   skill_level: {skill, level}              placeholder skill names from docs/core-loop.md
#   arrivals: n                              cumulative arrivals
#   tier: survival|safety|belonging|esteem|self_actualization
#   region_open: <R id>
#   region_days: {region, days}              days since the region opened
#   expeditions: {region, count}             expeditions completed to a region
#   journal_entries: n
#   season: still|drift|clear                first turn to it after the other gates hold
#   beat: <B id>                             another beat has landed
#   days_after: {beat, days}
#   hours_after: {beat|event, hours}        game hours after a beat lands, or after event: end
#   save_hours: n                            save time at least n hours (an engine after_time): a floor beside a play-driven gate
#   event: end                               the opening's end (feature keeps_going)
#   store_at_least: {store, n}               a store's level (an engine at_least on a store)
#   completions: {card, n}                   a card completed n times (the engine's card_count; n is a step, never a grind)
#   building_maxed: <building id>
#   any: [gates...]                          day_one only: the first of several steps
#   all: [gates...]
#
# unlocks: the system, skill or offer a beat makes available.
# Shape fields (docs/research/flat-story.md; checked by content/team/flatcheck.py):
#   turn: up|down                    which way the beat leaves the player's situation
#   outcome: yes|yes_but|no|no_and   only where something is attempted (quoted: YAML 1.1 reads bare yes/no as booleans)
#   opens / advances / pays: [C-promise-n]   ids in canon.jsonl, area promise
#   cost: none|time|people|stores|option|trust
#   moves: [PC, N-ids]               whose state changes
#   thread: {id, at: start|middle|end}
#   register: dread|wry|warm|grim|wonder

# pace_scale: the one number landing bands scale by. A spine beat from B5 on lands on the typical route in
# [(target_day - 1) * pace_scale, target_day * pace_scale] days from the save's start, sharp no sooner than
# 0.83 * (target_day - 0.5) * pace_scale days (content/team/day-three-numbers.md, D-93).
pace_scale: 1.0

season_cycle:
  length_days: 21
  order: [still, drift, clear]   # 7 days each; day 1 is still day 1

regions:
  - {id: R1, open_day: 1}
  - {id: R2, open_day: 20}
  - {id: R3, open_day: 36}
  - {id: R4, open_day: 55}
  - {id: R5, open_day: 70}

projects:   # kind: action | personal | joint | outpost
  # action: a one-off narrative action (tiny inputs, a log line, the next unlock), run once. Day 1 opens on these.
  - {id: A1,  region: R1, kind: action,   target_day: 1, gate: {start: true}, repeats: 3}
  - {id: A2,  region: R1, kind: action,   target_day: 1, gate: {project: A1}, unlocks: {skill: scavenging, status: cold}}
  - {id: A3,  region: R1, kind: action,   target_day: 1, gate: {project: A2}, unlocks: {system: journal}}
  - {id: A4,  region: R1, kind: action,   target_day: 1, gate: {project: A2}, unlocks: {action: gather_by_hand}}
