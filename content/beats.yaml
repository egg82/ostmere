  - {id: A9,  region: R1, kind: action,   target_day: 1, gate: {beat: B2}, unlocks: {skill: woodcutting}}
  - {id: A10, region: R1, kind: action,   target_day: 1, gate: {beat: B2}}   # Cooking's row opens with P0.3 (D-61)
  - {id: P0,  region: R1, kind: personal, target_day: 2}
  - {id: P1,  region: R1, kind: joint,    target_day: 11, opens: {tier: safety}}
  - {id: P2,  region: R1, kind: joint,    target_day: 16, opens: {tier: belonging}}
