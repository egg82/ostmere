# Side beats: building falls (a maxed building's prestige) and season-gated set pieces. Not on the critical path;
# each fires once when eligible. The simulator counts them toward "new things per week".
side_beats:
  - {id: F1, gate: {all: [{building_maxed: palisade}, {season: still}]}}
  - {id: F2, gate: {all: [{building_maxed: hall}, {season: drift}]}}
  - {id: F3, gate: {all: [{building_maxed: granary}, {region_open: R2}]}}
  - {id: F4, gate: {all: [{building_maxed: forge}, {region_days: {region: R3, days: 10}}]}}
  - {id: F5, gate: {all: [{building_maxed: watchtower}, {region_open: R4}]}}
  - {id: SB-face, gate: {days_after: {beat: B35, days: 4}}}

# Offers that feed the ending. Accepting or declining never moves progress.
ending_offers:
  - {id: O-tell,   gate: {beat: B43}}                # accepted / declined / unanswered
  - {id: O-book,   gate: {beat: B19}}                # accepted / declined
  - {id: O-pages,  gate: {beat: B49}}                # read now / keep sealed
  - {id: O-price,  gate: {beat: SB-face}}            # ask them to stop / let it stand
  - {id: O-final,  gate: {beat: B50}}                # one of E-d, E-b, E-c, each shown only when available

# Ending variants and the save state each reads. No moral meter: one informed final choice, plus what was built.
endings:
  core:
    - {id: E-d, requires: {all: [{tier: self_actualization}, {beat: B33}]}}
    - {id: E-b, requires: {beat: B44}}               # always available by the time O-final opens
    - {id: E-c, requires: {all: [{offer: O-tell, state: accepted}, {offer: O-book, state: accepted}]}}
  strands:   # each varies the epilogue independently of the core variant
    - {id: S-rim,       reads: outposts_supplied}     # which outposts fall inside the Rim
    - {id: S-notables,  reads: notable_arc_states}
    - {id: S-factions,  reads: emergent_quest_outcomes}
    - {id: S-memory,    reads: {offer: O-pages}}
    - {id: S-names,     reads: chronicle_deaths}      # count colours a line, never a variant
    - {id: S-yes,       reads: offers_declined_share} # picks one closing line of three, never judges
    - {id: S-seam,      reads: {offer: O-price}}
