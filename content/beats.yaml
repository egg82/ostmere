  - {id: P8,  region: R1, kind: joint,    target_day: 48, opens: {tier: self_actualization}}
  - {id: P9,  region: R3, kind: outpost,  target_day: 51}
  - {id: P10, region: R3, kind: joint,    target_day: 54, opens: {region: R4}}
