l_her_row = "she's out after roots before you've said a word."
l_her_first = "she sets down what she went for. no word about it."
l_her_rule = "she hears the rule. she nods once."
l_stool_1 = "you give up your seat. it was a poor seat."
l_stool_1_alt = "she gets the stool. the leg will tell her the rest."
l_stool_2 = "it rocks. she wedges the leg with a chip of stone."
l_stool_2_alt = "it rocks. a chip of stone goes under the short leg."
l_name = "lucy, she says. then she studies the ridge."
l_name_alt = "her name is lucy. then she watches the ridge."
l_evening_2 = "dusk. two at the fire."
l_night_2a = "wood dragged on stone, high up. a long scrape."
l_night_2a_alt = "wood on stone comes down off the ridge. it goes on a while."
l_night_2b = "then nothing. she heard it too. her hands stay still."
l_night_2b_alt = "after, quiet. she doesn't turn her head. neither do you."
l_morning_3 = "grey. she's up first. the chip is out; the stool rocks."
l_morning_3_alt = "she's up before you, the fire fed. the chip is gone from the stool."
l_make_room_fail = "too dark to build. you feel for a pole and give up."
l_room_1 = "one roof, and it's yours. she slept by the fire."
l_room_1_alt = "the lean-to is yours. the ash by the fire is pressed flat."
l_room_2 = "a shelter for her, a stack for wood. the order is yours."
l_room_2_alt = "a roof for her and a stack for the wood. both get built."
l_shelter = "green poles, low against the wall. she ducks in and stays."
l_shelter_alt = "a smaller roof of green birch beside yours. she walks its length."
l_woodstack = "a stack on a stone footing. twice the room for dry wood."
l_shelter_fail = "you go to raise a roof and come up short."
l_woodstack_fail = "the stack stays a plan. something is short."
l_offer_1 = "under her own roof, she asks you for something."
l_offer_1_alt = "with a roof over her, she turns to you with a favour."
l_offer_2 = "she asks you to bring her cart in. either answer is fine."
l_offer_2_alt = "she wants her cart. she says it's your call."
l_yes = "she looks at you. an offer, and you took it."
l_yes_alt = "it was offered, you took it. she keeps looking."
l_walk_go = "you leave the fire and go out the gap."
l_she_goes = "she walks out toward the ridge. her work waits."
l_walk_out = "the gap stands empty. the ridge is far."
l_b4_1 = "on the ridge, the cart's place, pressed square."
l_b4_1_alt = "the ground is pressed square where the cart stood."
l_b4_2 = "drag marks run from it, over the edge."
l_b4_2_alt = "scrapes lead off from it, over the edge."
l_b4_3 = "wolf prints crowd the ground around it."
l_b4_3_alt = "wolf prints in the dirt, all round."
l_b4_4 = "back by the fire, she takes the news. no word."
l_b4_4_alt = "you tell her at the fire. she hears it out."
l_b4_h1 = "she walks into camp with nothing."
l_b4_h1_alt = "she walks in. her hands are empty."
l_b4_h2 = "she sits at the fire. she doesn't look up."
l_b4_h2_alt = "she sits and looks into the fire."
l_b4_h3 = "she says nothing. you don't ask."
l_b4_h3_alt = "she doesn't speak. you leave it there."
l_camp_7 = "the wall dries nine now. the camp is two."
l_camp_8 = "the catch holds half as much more."
l_seed_stand = "an old wall, and roots gone to seed along it."
l_lichen = "lichen thick on a stone. it goes in the roast."
l_clay_bank = "a clay bank by the stream. roots grow in it."
l_old_bed = "an old bed, roots gone wild in it."
l_wet_hollow = "roots thick in a wet hollow. you wade in."
l_root_mat = "roots matted so tight you roll them up."
l_flagged_floor = "a buried floor of flags. you lever some up."
l_fallen_gable = "a gable down, timbers whole. you take them."
l_dressed_kerb = "a kerb of dressed stone. the edges are sharp."
l_straight_poles = "young birch grown straight. every one a pole."
l_root_plate = "a birch torn up by the roots, stones in its grip."
l_tighter_rack = "strips edge to edge. one more a batch."
