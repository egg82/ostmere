l_her_row = "she has gone for roots, unasked."
l_her_first = "she's back. what she brought goes with the rest."
l_her_rule = "she takes the rule and gets on with it."
l_stool_1 = "you hand over the stool, short leg and all."
l_stool_1_alt = "she gets the stool. you get the ground."
l_stool_2 = "it rocks. she wedges the short leg with stone."
l_stool_2_alt = "a chip of stone under the short leg. no remark."
l_name = "lucy, she says, for the stool. then she looks at the ridge."
l_name_alt = "lucy, she says. she takes the stool and looks out at the ridge."
l_evening_2 = "dusk. the fire, the two of you."
l_night_2a = "wood dragged on stone, far up. one long scrape."
l_night_2a_alt = "no wind to blur it: wood on stone, dragged."
l_night_2b = "then nothing. she heard it too. her hands go still."
l_night_2b_alt = "the quiet after. her hands stay where they are."
l_morning_3 = "she's up first, the fire fed. the stool's wedge is out."
l_morning_3_alt = "the fire is fed. the stool rocks, the chip gone."
l_make_room_fail = "you grope for stones in the black. nothing goes up."
l_room_1 = "one roof, two people. she slept out."
l_room_1_alt = "your lean-to is the only cover. she slept in the open."
l_room_2 = "a shelter, a woodstack. one first."
l_room_2_alt = "poles and stone for one. stone and wood for the other."
l_shelter = "a low roof of green birch, back to the wall."
l_shelter_alt = "poles and two stones, low and small. hers."
l_woodstack = "a woodstack on a stone footing. twice the dry."
l_shelter_fail = "a shelter wants more than this."
l_woodstack_fail = "that makes a pile, not a stack."
l_offer_1 = "she stands under her own roof and asks you something."
l_offer_1_alt = "a roof of her own, and a question for you."
l_offer_2 = "she asks you to fetch her people's cart."
l_offer_2_alt = "she says the dark square is her cart, and asks."
l_yes = "go, you tell her. she is looking at you."
l_yes_alt = "go, you say. she's still looking at you."
l_walk_go = "you turn to the gap and set out."
l_she_goes = "she leaves for the ridge, her own work waiting."
l_walk_out = "the road up is long, and the camp is out of sight."
l_b4_1 = "the cart's place: flat ash, nothing on it."
l_b4_1_alt = "the ash holds the cart's shape. no cart."
l_b4_2 = "drag marks run off from it, over the edge."
l_b4_2_alt = "something was pulled away, down over the edge."
l_b4_3 = "wolf prints all round it, overlapping."
l_b4_3_alt = "prints, wolf, round and round the place."
l_b4_4 = "you tell her. she listens to the end, and that is all."
l_b4_4_alt = "at the fire you give her the news. she takes it."
l_b4_h1 = "she walks in at the gap with nothing."
l_b4_h1_alt = "through the gap, back, her hands empty."
l_b4_h2 = "she sits at the fire, a little apart."
l_b4_h2_alt = "she sits and doesn't look up."
l_b4_h3 = "you don't ask. she doesn't offer."
l_b4_h3_alt = "nobody speaks. the fire does what it does."
l_camp_7 = "nine strips dry at a time now. there are two of you."
l_camp_8 = "the catch holds half as much more as it did."
l_seed_stand = "roots gone to seed by an old field wall."
l_lichen = "lichen thick on a stone. it goes in the roast."
l_clay_bank = "a soft clay bank by the stream, roots through it."
l_old_bed = "an old bed of roots, gone wild."
l_wet_hollow = "a wet hollow with roots thick in it."
l_root_mat = "a mat of roots that lifts in one piece."
l_flagged_floor = "ash over a flagged floor. you lift what you can."
l_fallen_gable = "a fallen gable with its timbers whole."
l_dressed_kerb = "dressed stone along a kerb, edges still sharp."
l_straight_poles = "young birch growing straight enough for poles."
l_root_plate = "a birch torn up whole, stones caught in its grip."
l_tighter_rack = "you turn the strips on edge. the rack takes one more."
