l_her_row = "she's gone for roots. nobody asked."
l_her_first = "she's back with what she went for."
l_her_rule = "she hears the rule and goes on."
l_stool_1 = "you slide her the stool. short leg and all."
l_stool_1_alt = "you push the stool over to her. you made it, so you apologise for nothing."
l_stool_2 = "it rocks. she wedges the leg with a chip of stone."
l_stool_2_alt = "she feels it rock, and fits a stone chip under it."
l_name = "lucy, she says, for the stool. a long look at the ridge."
l_name_alt = "she gives you lucy for the stool. the ridge gets a long look."
l_evening_2 = "dusk. the two of you, the fire between."
l_night_2a = "a long scrape, wood on stone, from the ridge."
l_night_2a_alt = "wood dragged over stone. it carries down on the still air."
l_night_2b = "then nothing. she heard it. she feeds the fire."
l_night_2b_alt = "nothing more comes. she keeps her eyes on the flames."
l_morning_3 = "grey. the fire is fed. the stool rocks, chipless."
l_morning_3_alt = "she's up before you. the stool rocks. the chip is gone."
l_make_room_fail = "no pole goes up in the dark. you try one."
l_room_1 = "one cover, two of you. she slept out."
l_room_1_alt = "only the lean-to has a roof. she slept beside the fire."
l_room_2 = "a roof for her, a woodstack. one first."
l_room_2_alt = "her shelter, the woodstack. one at a time."
l_shelter = "two stones and green poles, low by the lean-to. hers."
l_shelter_alt = "a small roof of poles, backed to the wall, beside yours."
l_woodstack = "a woodstack on stone by the wall. room for twice the dry."
l_shelter_fail = "not enough yet. the poles or the stones run short."
l_woodstack_fail = "short of stones or dry wood. the stack stays a plan."
l_offer_1 = "she glances at her roof, then asks you something."
l_offer_1_alt = "under her own roof she asks if you'd do a favour."
l_offer_2 = "she asks you to fetch her people's cart. either way is fine."
l_offer_2_alt = "will you fetch the cart? she'll go herself if you won't."
l_yes = "you say you'll go. she watches you say it."
l_yes_alt = "you go, then. she's looking at you."
l_walk_go = "you step into the gap, the ridge ahead."
l_she_goes = "she goes out the gap toward the ridge. her work waits."
l_walk_out = "the gap stands empty. the camp waits."
l_b4_1 = "the cart stood here. the ground is scuffed."
l_b4_1_alt = "a place scuffed bare. the cart stood there."
l_b4_2 = "drag marks run off over the edge."
l_b4_2_alt = "from the scuffed ground, drag marks go over the edge."
l_b4_3 = "wolf prints all round the place, crossed over."
l_b4_3_alt = "wolf prints, round and round the place."
l_b4_4 = "you tell her at the fire. she takes it in silence."
l_b4_4_alt = "you tell her at the fire. she takes it quietly."
l_b4_h1 = "she walks in through the gap with nothing."
l_b4_h1_alt = "she walks through the gap, hands empty."
l_b4_h2 = "she sits at the fire. not a look at you."
l_b4_h2_alt = "she sits down at the fire, a little apart."
l_b4_h3 = "you ask nothing. she offers nothing."
l_b4_h3_alt = "neither of you speaks. you read it off her."
l_camp_7 = "the wall dries nine now. it is a camp for two."
l_camp_8 = "the catch holds half as much more."
l_seed_stand = "roots gone to seed, by an old field wall."
l_lichen = "lichen thick on a stone. it goes in the roast."
l_clay_bank = "a clay bank by the stream, roots set in it."
l_old_bed = "an old bed of roots, gone wild and heavy."
l_wet_hollow = "a wet hollow with roots thick in it."
l_root_mat = "a root mat that lifts in one piece."
l_flagged_floor = "a flagged floor under the ash."
l_fallen_gable = "a fallen gable, its timbers whole."
l_dressed_kerb = "a kerb of dressed stone, the edges sharp."
l_straight_poles = "young birch, straight. good poles."
l_root_plate = "a birch root plate, stones in its grip."
l_tighter_rack = "you lay strips like slates. one more a batch."
